// Modified 2026-08-06
// M2X_Reactor — SystemHeat 模式重设计 (覆盖 MK2E 补丁的 1200kW/500EC 异常值)
// 4t / 800kW 热 / 80 EC/s (36%) / 200 kW/t (KPBS 对标) / 19% HALEU / 集成散热 800kW@800K

@PART[M2X_Reactor]:NEEDS[SystemHeat]:FINAL
{
    !MODULE[ModuleSystemHeatFissionReactor] {}
    MODULE
    {
        name = ModuleSystemHeatFissionReactor
        moduleID = NUKCore
        systemHeatModuleID = reactor
        HeatGeneration
        {
            key = 0 0 0 0
            key = 100 800 0 0
        }
        NominalTemperature = 800
        CriticalTemperature = 1300
        CoreDamageRate = 0.008
        RepairAmountPerKit = 20
        CurrentPowerPercent = 100
        ThrottleIncreaseRate = 5
        MinimumThrottle = 25
        ElectricalGeneration
        {
            key = 0 0
            key = 100 80
        }
        FuelName = EnrichedUranium
        INPUT_RESOURCE
        {
            ResourceName = EnrichedUranium
            Ratio = 0.0000000094
            FlowMode = NO_FLOW
        }
        OUTPUT_RESOURCE
        {
            ResourceName = DepletedFuel
            Ratio = 0.0000000094
            DumpExcess = false
            FlowMode = NO_FLOW
        }
    }
    // 集成散热器: 800 kW @ 800K (辐射 T⁴ 曲线: 400K=50, 600K=253)
    @MODULE[ModuleSystemHeatRadiator]
    {
        !temperatureCurve {}
        temperatureCurve
        {
            key = 0 0
            key = 400 50
            key = 600 253
            key = 800 800
        }
    }
    @RESOURCE[ElectricCharge]
    {
        @amount = 80
        @maxAmount = 80
    }
    @RESOURCE[EnrichedUranium]
    {
        @amount = 4
        @maxAmount = 4
    }
    @RESOURCE[DepletedFuel]
    {
        @maxAmount = 4
    }
}
