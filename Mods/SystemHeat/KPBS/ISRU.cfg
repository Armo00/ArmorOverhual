// Modified 2026-06-20

// Modifies PlanetaryBaseInc ISRU to use SystemHeat modules for stock and cryo fuel
@PART[KKAOSS_ISRU_g]:NEEDS[PlanetaryBaseInc]:Final
{
    @attachRules = 1,1,1,1,1
    %ISRUmultiplier = 4
    !MODULE[ModuleCoreHeat] {}

    MODULE
    {
        name = ModuleSystemHeat
        // Cubic metres
        volume = 5.0
        moduleID = isru
        iconName = Icon_Gears
    }

    !MODULE[ModuleOverheatDisplay] {}

    // LF only converter
    @MODULE[ModuleResourceConverter]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[LiquidFuel]],!OUTPUT_RESOURCE:HAS[#ResourceName[Oxidizer]],!OUTPUT_RESOURCE:HAS[#ResourceName[LqdHydrogen]],!OUTPUT_RESOURCE:HAS[#ResourceName[LqdMethane]]]
    {
        @name = ModuleSystemHeatConverter
        // must be unique
        moduleID = converter1
        // ModuleSystemHeat moduleID to link to
        systemHeatModuleID = isru

        // The shutdown temperature of the part
        shutdownTemperature = 1300

        // The temperature the system contributes to loops
        systemOutletTemperature = 800

        // Map loop temperature to system efficiency (0-1.0)
        systemEfficiency
        {
            key = 0 0.0
            key = 300 1.0
            key = 1000 1.0
            key = 1300 0.0
        }
        // Heat generation (kW)
        systemPower = 40

        !ThermalEfficiency  {} 
        !TemperatureModifier {}
        
        @GeneratesHeat = false
    }
    // LFO converter
    @MODULE[ModuleResourceConverter]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[LiquidFuel]],@OUTPUT_RESOURCE:HAS[#ResourceName[Oxidizer]]]
    {
        @name = ModuleSystemHeatConverter
        // must be unique
        moduleID = converter2
        // ModuleSystemHeat moduleID to link to
        systemHeatModuleID = isru

        // The shutdown temperature of the part
        shutdownTemperature = 1300

        // The temperature the system contributes to loops
        systemOutletTemperature = 800

        // Map loop temperature to system efficiency (0-1.0)
        systemEfficiency
        {
            key = 0 0.0
            key = 300 1.0
            key = 1000 1.0
            key = 1300 0.0
        }
        // Heat generation (kW)
        systemPower = 40
        
        !ThermalEfficiency  {} 
        !TemperatureModifier {}
            
        @GeneratesHeat = false
    }
    // Ox only
    @MODULE[ModuleResourceConverter]:HAS[!OUTPUT_RESOURCE:HAS[#ResourceName[LiquidFuel]],!OUTPUT_RESOURCE:HAS[#ResourceName[LqdHydrogen]],!OUTPUT_RESOURCE:HAS[#ResourceName[LqdMethane]],@OUTPUT_RESOURCE:HAS[#ResourceName[Oxidizer]]]
    {
        @name = ModuleSystemHeatConverter
        // must be unique
        moduleID = converter3
        // ModuleSystemHeat moduleID to link to
        systemHeatModuleID = isru

        // The shutdown temperature of the part
        shutdownTemperature = 1300

        // The temperature the system contributes to loops
        systemOutletTemperature = 800

        // Map loop temperature to system efficiency (0-1.0)
        systemEfficiency
        {
            key = 0 0.0
            key = 300 1.0
            key = 1000 1.0
            key = 1300 0.0
        }
        // Heat generation (kW)
        systemPower = 40

        !ThermalEfficiency  {} 
        !TemperatureModifier {}
        @GeneratesHeat = false
    }

    // Mono
    @MODULE[ModuleResourceConverter]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[MonoPropellant]]]
    {
        @name = ModuleSystemHeatConverter
        // must be unique
        moduleID = converter4
        // ModuleSystemHeat moduleID to link to
        systemHeatModuleID = isru

        // The shutdown temperature of the part
        shutdownTemperature = 1300

        // The temperature the system contributes to loops
        systemOutletTemperature = 800

        // Map loop temperature to system efficiency (0-1.0)
        systemEfficiency
        {
            key = 0 0.0
            key = 300 1.0
            key = 1000 1.0
            key = 1300 0.0
        }
        // Heat generation (kW)
        systemPower = 40

        !ThermalEfficiency  {} 
        !TemperatureModifier {}      
        @GeneratesHeat = false
    }

    // LH2 only converter
    @MODULE[ModuleResourceConverter]:NEEDS[CryoTanks]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[LqdHydrogen]],!OUTPUT_RESOURCE:HAS[#ResourceName[Oxidizer]]]
    {
        @name = ModuleSystemHeatConverter
        // must be unique
        moduleID = converter6
        // ModuleSystemHeat moduleID to link to
        systemHeatModuleID = isru

        // The shutdown temperature of the part
        shutdownTemperature = 1300

        // The temperature the system contributes to loops
        systemOutletTemperature = 800

        // Map loop temperature to system efficiency (0-1.0)
        systemEfficiency
        {
            key = 0 0.0
            key = 300 1.0
            key = 1000 1.0
            key = 1300 0.0
        }
        // Map system outlet temperature (K) to heat generation (kW)
        systemPower = 40

        !ThermalEfficiency  {} 
        !TemperatureModifier {}

        !OUTPUT_RESOURCE,*{}
        OUTPUT_RESOURCE
        {
            ResourceName = LqdHydrogen
            Ratio = 8.7312
            @Ratio *= #$/ISRUmultiplier$
            DumpExcess = false
            FlowMode = STAGE_PRIORITY_FLOW
        }

        @GeneratesHeat = false
    }

    // LH2O converter
    @MODULE[ModuleResourceConverter]:NEEDS[CryoTanks]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[LqdHydrogen]],@OUTPUT_RESOURCE:HAS[#ResourceName[Oxidizer]]]
    {
        @name = ModuleSystemHeatConverter
        // must be unique
        moduleID = converter7
        // ModuleSystemHeat moduleID to link to
