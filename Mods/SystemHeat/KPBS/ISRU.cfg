    }

    // LCH4O converter
    @MODULE[ModuleResourceConverter]:NEEDS[CryoTanks]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[LqdMethane]],@OUTPUT_RESOURCE:HAS[#ResourceName[Oxidizer]]]
    {
        @name = ModuleSystemHeatConverter
        // must be unique
        moduleID = converter9
        // ModuleSystemHeat moduleID to link to
        systemHeatModuleID = isru

        // The shutdown temperature of the part
        shutdownTemperature = 1300

        // The temperature the system contributes to loops
        systemOutletTemperature = 801

        // Map loop temperature to system efficiency (0-1.0)
        systemEfficiency
        {
            key = 0 0.0
            key = 300 1.0
            key = 1000 1.0
            key = 1300 0.0
        }
        // Map system outlet temperature (K) to heat generation (kW)
        systemPower = 40
        
        !ThermalEfficiency  {} 
        !TemperatureModifier {}

        !OUTPUT_RESOURCE,*{}
        OUTPUT_RESOURCE
        {
            ResourceName = LqdMethane
            Ratio = 0.4137
            @Ratio *= #$/ISRUmultiplier$
            DumpExcess = false
            FlowMode = STAGE_PRIORITY_FLOW
        }
        OUTPUT_RESOURCE
        {
            ResourceName = LqdOxygen
            Ratio = 0.5863
            @Ratio *= #$/ISRUmultiplier$
            DumpExcess = false
            FlowMode = STAGE_PRIORITY_FLOW
        }
        @GeneratesHeat = false
    }
}