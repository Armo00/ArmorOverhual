// Modified 2026-06-30

@PART[KKAOSS_Centrifuge]:FINAL
{
    !MODULE[ModuleCoreHeat] {}
    %MODULE[ModuleSystemHeat]
    {
        %name = ModuleSystemHeat
        // Cubic metres
        %volume = #$/mass$ //1 ton equals 1 cubic meter of cooling. it *very roughly* approximates the balance of squads ISRU
        %moduleID = isru
        %iconName = Icon_Gears
    }

    !MODULE[ModuleOverheatDisplay]{}

    @MODULE[ModuleResourceConverter]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[EnrichedUranium]]]:HAS[@INPUT_RESOURCE:HAS[#ResourceName[DepletedFuel]]]
    {
        @name = ModuleSystemHeatConverter
        @ConverterName = Uranium Reprocessor (SystemHeat)
        moduleID = Uranium Reprocessor (SystemHeat)
        systemHeatModuleID = isru
        shutdownTemperature = 1250
        systemOutletTemperature = 800 // temp for freeing water from hydrate regolith. other values could be: 400k for production of hydrazine, 5-600k for decomposition of hydrates, 700 for sabatier process, 373-1000k for high temp electrolysis of water.
        systemEfficiency
        {
            key = 0 0.0
            key = 300 0.5
            key = 1000 1.0
            key = 1250 0.5
            key = 1300 0.0
        }
    
        systemPower = 108
        !ThermalEfficiency {}
        !TemperatureModifier {}
        @GeneratesHeat = false //disable stock heating
    }

    @MODULE[ModuleResourceConverter]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[XenonGas]]]:HAS[@INPUT_RESOURCE:HAS[#ResourceName[DepletedFuel]]]
    {
        @name = ModuleSystemHeatConverter
        @ConverterName = Xenon Extractor (SystemHeat)
        moduleID = Xenon Extractor (SystemHeat)
        systemHeatModuleID = isru
        shutdownTemperature = 1250
        systemOutletTemperature = 800 // temp for freeing water from hydrate regolith. other values could be: 400k for production of hydrazine, 5-600k for decomposition of hydrates, 700 for sabatier process, 373-1000k for high temp electrolysis of water.
        systemEfficiency
        {
            key = 0 0.0
            key = 300 0.5
            key = 1000 1.0
            key = 1250 0.5
            key = 1300 0.0
        }
    
        systemPower = 54
        !ThermalEfficiency {}
        !TemperatureModifier {}
        @GeneratesHeat = false //disable stock heating
    }

    @MODULE[ModuleResourceConverter]:HAS[@OUTPUT_RESOURCE:HAS[#ResourceName[EnrichedUranium]]]:HAS[@INPUT_RESOURCE:HAS[#ResourceName[Ore]]]
    {
        @name = ModuleSystemHeatConverter
        @ConverterName = Uranium Extractor (SystemHeat)
        moduleID = Uranium Extractor (SystemHeat)
        systemHeatModuleID = isru
        shutdownTemperature = 1250
        systemOutletTemperature = 800 // temp for freeing water from hydrate regolith. other values could be: 400k for production of hydrazine, 5-600k for decomposition of hydrates, 700 for sabatier process, 373-1000k for high temp electrolysis of water.
        systemEfficiency
        {
            key = 0 0.0
            key = 300 0.5
            key = 1000 1.0
            key = 1250 0.5
            key = 1300 0.0
        }
    
        systemPower = 108
        !ThermalEfficiency {}
        !TemperatureModifier {}
        @GeneratesHeat = false //disable stock heating
    }
}