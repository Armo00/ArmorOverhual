// Modified 2026-08-06
// 2 MW thermal, 720 kW electrical, 36% efficiency
// Fuel: 19% HALEU rods, ~22 g/day at 2 MW
// Core: 12 unit = 131.6 kg, ~16.2 years runtime

@PART[KKAOSS_Nuclear_Reactor]:NEEDS[PlanetaryBaseInc,NearFutureElectrical]:FOR[SystemHeatFissionReactors]
{
    @description ^= :$: Produce 720KW of electrical power with 2MW of waste heat.:
    MODULE
    {
        name = ModuleSystemHeat
        volume = 1.25
        moduleID = reactor
        iconName = Icon_Nuclear
    }

    !MODULE[ModuleUpdateOverride] {}
    !MODULE[FissionReactor] {}
    !MODULE[FissionGenerator] {}
    !MODULE[ModuleCoreHeatNoCatchup] {}


    MODULE
    {
        name = ModuleSystemHeatFissionReactor
        moduleID = reactor
        // -- Heat stuff
        // ModuleSystemHeat instance to link to
        systemHeatModuleID = reactor
        // Heat kW
        HeatGeneration
        {
            key = 0 0 0 0 
            key = 100 2000 0 0 
        } 
        // Above this temp, risky
        NominalTemperature = 850
        // Above this temp, reactor takes damage
        CriticalTemperature = 1300
        // Amount of damage taken by core when over critical temp
        // %/s/K, so with value 0.001, at 200 K over CriticalTemp, reactor takes 0.2% damage/s
        CoreDamageRate = 0.007

        CurrentPowerPercent = 100
        ThrottleIncreaseRate = 5
        MinimumThrottle = 5

        // -- Electrical stuff
        // Power generated
        ElectricalGeneration
        {
            key = 0 0
            key = 100 200
        }

        // --- Fuel stuff
        // Base lifetime calculations off this resource
        FuelName = EnrichedUranium

        INPUT_RESOURCE
        {
            ResourceName = EnrichedUranium
            Ratio = 0.0000000235 // 2.35e-8, 19% HALEU rods, ~22 g/day at 2 MW
            FlowMode = NO_FLOW
        }
        OUTPUT_RESOURCE
        {
            ResourceName = DepletedFuel
            Ratio = 0.0000000235
            DumpExcess = false
            FlowMode = NO_FLOW
        }
    }
    MODULE
    {
        name = ModuleSystemHeatFissionFuelContainer
        EngineerLevelForTransfer = 3
        ResourceNames = EnrichedUranium, DepletedFuel
    }
}