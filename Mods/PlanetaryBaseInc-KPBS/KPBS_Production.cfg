// Modified 2026-08-06
// KPBS production parts — mass/cost/storage ×4/×8 only
// Converter rates handled separately per confirmed tables

// --- Drill (Mining) ---
@PART[KKAOSS_drill]:NEEDS[PlanetaryBaseInc]:Final
{
    @mass = 1.8
    @cost = 18400
    @entryCost = 56000
}

// --- ISRU ---
@PART[KKAOSS_ISRU_g]:NEEDS[PlanetaryBaseInc]:Final
{
    @mass = 9
    @cost = 26000
    @entryCost = 80400
}

// --- Nuclear Reactor ---
// 19% HALEU rods, 12 unit core (~16.2 years at 2 MW)
@PART[KKAOSS_Nuclear_Reactor]:NEEDS[PlanetaryBaseInc]:Final
{
    @mass = 15
    @cost = 1720000
    @entryCost = 5600000
    @RESOURCE[EnrichedUranium]
    {
        @amount = 12
        @maxAmount = 12
    }
    @RESOURCE[DepletedFuel]
    {
        @amount = 0
        @maxAmount = 50
    }
}

// --- Centrifuge ---
@PART[KKAOSS_Centrifuge]:NEEDS[PlanetaryBaseInc]:Final
{
    @mass = 15.0
    @cost = 960000
    @entryCost = 1080000
    @RESOURCE[EnrichedUranium]
    {
        @amount = 50
        @maxAmount = 50
    }
    %RESOURCE[DepletedFuel]
    {
        %amount = 0
        %maxAmount = 50
    }
}

