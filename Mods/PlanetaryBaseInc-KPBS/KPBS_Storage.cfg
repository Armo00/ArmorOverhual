// --- Liquid Fuel Container — MFT 12000L ServiceModule ---
@PART[KKAOSS_Liquid_Fuel_Tank]:NEEDS[PlanetaryBaseInc,RealFuels]:Final
{
    @mass = 1.0
    @cost = 10000
    @entryCost = 28000
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 12000
        type = ServiceModule
        basemass = -1
    }
}

