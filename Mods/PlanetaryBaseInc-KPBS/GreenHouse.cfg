@PART[KKAOSS_Greenhouse_g]:NEEDS[PlanetaryBaseInc,CommunityResourcePack]:FINAL
{
    @mass = 12
    @tags = cck-lifesupport
    @description ^= :$:  Rated for 10 people. All storage ×2 for 3000-day support.:

    !MODULE[PlanetaryGreenhouse]{}

    MODULE
    {
        name = PlanetaryGreenhouse
        ConverterName = GreenhouseAR
        StartActionName = Start Farming AR
        StopActionName = Stop Farming AR
        AutoShutdown = false
        GeneratesHeat = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 5   //  18000w
        }
        INPUT_RESOURCE
        {
            ResourceName = Fertilizer
            Ratio = 5.787037037037035e-06    //  0.02083-hr, 0.5-day
        }
        INPUT_RESOURCE
        {
            ResourceName = WasteWater
            Ratio = 0.0005699   //  2.052-hr, 49.248-day
        }
        INPUT_RESOURCE
        {
            ResourceName = CarbonDioxide
            Ratio = 0.05919    //  5114.8-day, 213.12-hr
        }
        INPUT_RESOURCE
        {
            ResourceName = Waste
            Ratio = 0.0000615   //  0.2214-hr, 5.3136-day
        }

        OUTPUT_RESOURCE
        {
            ResourceName = Oxygen
            Ratio = 0.0686 // 246.96-hr, 5927.04-day
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Food
            Ratio = 0.000678 // 2.4408-hr, 58.5792-day
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Water
            Ratio = 0.000449 // 1.575-hr, 37.8-day
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Hydrogen
            Ratio = 0.0178 //
            DumpExcess = true
        }
    }
    !RESOURCE,*{}
    RESOURCE
    {
        name = Fertilizer
        amount = 1500
        maxAmount = 1500
    }
    RESOURCE
    {
        name = Waste
        amount = 0
        maxAmount = 700
    }
}










