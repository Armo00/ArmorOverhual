// Isolated IVA scaling trial for the KPBS Central Hub.
// The exterior is already rescaled to 2x by KPBS_Scale.cfg.  Duplicate the
// IVA so that only this part receives a 2x interior model, leaving the
// original IVA available to any other part that shares it.
//
// This deliberately does NOT scale Kerbal characters.  Kerbal scale is not a
// per-IVA config setting and changing it globally breaks EVA/animation/collider
// assumptions.

+INTERNAL[KKAOSS_Central_Hub_internal]:NEEDS[PlanetaryBaseInc]:FINAL
{
	@name = AO_KPBS_Central_Hub_internal_x2
	@MODEL
	{
		%scale = 2,2,2
	}
}

@PART[KKAOSS_Central_Hub]:NEEDS[PlanetaryBaseInc]:FINAL
{
	@INTERNAL
	{
		@name = AO_KPBS_Central_Hub_internal_x2
	}
}
