// Modified 2026-09-06

PART:NEEDS[PlanetaryBaseInc,TacLifeSupport|IoncrossCrewSupport|LifeSupport]
{
    // Kerbal Space Program - Part Config
    // A container that converts CO2 into Waste and O2

    MODEL
    {
        model =PlanetaryBaseInc/ModSupport/Parts/LifeSupport/Container_CarbonExtractor
    }

    // --- general parameters ---
    name = KKAOSS_LS_container_Armor_convertor
    module = Part
    author = Nils277

    // --- asset parameters ---
    scale = 1
    rescaleFactor = 1
    CoMOffset = -0.45, 0, 0

    // --- node definitions ---
    node_stack_top = 0, 0, 0, 1, 0, 0, 1

    // --- editor parameters ---
    TechRequired = specializedElectrics
    entryCost = 48000
    cost = 10000
    category = none
    subcategory = 0
    title = K&K convertor
    manufacturer = K&K Advanced Orbit and Surface Structures
    description = This life support container allows the converting Ore into lifesupports. Using 42.7 Ore/day, generating water&oxygen for 1 kerbal for 10 days

    // --- attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision ---
    attachRules = 1,0,1,0,0
    tags = life support TAC converter recycl water carbin co2 oxygen o2 cck-lifesupport

    // --- standard part parameters ---
    mass = 2.8
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 15
    maxTemp = 2000

    MODULE:NEEDS[DeadlyReentry]
    {
        name = ModuleAeroReentry
        leaveTemp = true
        maxOperationalTemp = 1800
        skinMaxOperationalTemp = 1800
    }
}

//------------------COMMUNITY TECHTREE-------------------------
@PART[KKAOSS_LS_container_carbon_extractor]:NEEDS[PlanetaryBaseInc,CommunityTechTree]:FOR[PlanetarySurfaceStructures]
{
    @TechRequired = recycling
}

//------------------TAC LIFE SUPPORT CONFIG--------------------
@PART[KKAOSS_LS_container_Armor_convertor]:NEEDS[PlanetaryBaseInc,TacLifeSupport]:FOR[PlanetarySurfaceStructures]
{
    @TechRequired = advElectrics
    @cost = 28000

    MODULE
    {
        name = ModuleKPBSConverter
        converterName = Hydra-Producter
        StartActionName = Start
        StopActionName = Stop
        tag = Life Support
        GeneratesHeat = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 40
        }
        INPUT_RESOURCE
        {
            ResourceName = Ore
            Ratio = 0.002
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Oxygen
            Ratio = 0.274
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Water
            Ratio = 0.001792
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Fertilizer
            Ratio = 0.00004
            DumpExcess = true
        }
        UseSpecialistBonus = true
        SpecialistEfficiencyFactor = 0.2
        SpecialistBonusBase = 0.05
        ExperienceEffect = ConverterSkill
        EfficiencyBonus = 1
    }

    MODULE
    {
        name = ModuleKPBSConverter
        converterName = FuelGenerator
        StartActionName = Start Generate Liquidfuel
        StopActionName = Stop Generate Liquidfuel
        tag = Life Support
        GeneratesHeat = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 40
        }
        INPUT_RESOURCE
        {
            ResourceName = Ore
            Ratio = 0.144
        }
        OUTPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio = 0.288
            DumpExcess = true
        }
        UseSpecialistBonus = true
        SpecialistEfficiencyFactor = 0.2
        SpecialistBonusBase = 0.05
        ExperienceEffect = ConverterSkill
        EfficiencyBonus = 1
    }

    MODULE
    {
        name = ModuleKPBSConverter
        converterName = RCSGenerator
        StartActionName = Start MMH/NTO
        StopActionName = Stop MMH/NTO
        tag = Life Support
        GeneratesHeat = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 40
        }
        INPUT_RESOURCE
        {
            ResourceName = Ore
            Ratio = 0.144
        }
        OUTPUT_RESOURCE
        {
            ResourceName = MMH
            Ratio = 0.1996
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = NTO
            Ratio = 0.2004
            DumpExcess = true
        }
        UseSpecialistBonus = true
        SpecialistEfficiencyFactor = 0.2
        SpecialistBonusBase = 0.05
        ExperienceEffect = ConverterSkill
        EfficiencyBonus = 1
    }

    RESOURCE
    {
        name = Oxygen
        amount = 0
        maxAmount = 40000
    }
    RESOURCE
    {
        name = Water
        amount = 0
        maxAmount = 1200
    }
    RESOURCE
    {
        name = Fertilizer
        amount = 0
        maxAmount = 1200
    }
    RESOURCE
    {
        name = LiquidFuel
        amount = 0
        maxAmount = 1200
    }
    RESOURCE
    {
        name = MMH
        amount = 0
        maxAmount = 399.2
    }
    RESOURCE
    {
        name = NTO
        amount = 0
        maxAmount = 400.8
    }
}

//------------------IONCROSS CREW SUPPORT CONFIG--------------------
@PART[KKAOSS_LS_container_carbon_extractor]:NEEDS[PlanetaryBaseInc,IoncrossCrewSupport]:FOR[PlanetarySurfaceStructures]
{
    @TechRequired = specializedElectrics
    MODULE
    {
        name = ModuleKPBSConverter
        ConverterName = Carbon Extractor
        StartActionName = Start Extractor
        StopActionName = Stop Extractor

        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 3.0
            effectOnEfficency = 1
        }
        INPUT_RESOURCE
        {
            name = CarbonDioxide
            rateBase = 8.0
            effectOnEfficency = 1
        }
        OUTPUT_RESOURCE
        {
            name = Oxygen
            rateBase = 4.8
        }
    }
}

//------------------ECLSS SUPPORT CONFIG--------------------
@PART[KKAOSS_LS_container_carbon_extractor]:NEEDS[PlanetaryBaseInc,LifeSupport]:FOR[PlanetarySurfaceStructures]
{
    @TechRequired = specializedElectrics
    MODULE
    {
        name = ModuleKPBSConverter
        ConverterName = Carbon Extractor
        StartActionName = Start Extractor
        StopActionName = Stop Extractor

        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 8.0
        }
        INPUT_RESOURCE
        {
            name = CarbonDioxide
            rate = 0.12
        }
        OUTPUT_RESOURCE
        {
            name = Oxygen
            rate = 0.1
        }
    }
}
