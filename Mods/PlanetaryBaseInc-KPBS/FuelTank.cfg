// X50 Fuel Tank (was X720) — ServiceModule, 50 kL
@PART[KKAOSS_Fuel_Tank]:NEEDS[PlanetaryBaseInc,RealFuels]:Final
{
    @title = K&K X50 Fuel Tank
    @mass = 4.4
    @cost = 8000
    @entryCost = 33200
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 50000
        type = ServiceModule
        basemass = -1
    }
}

// X25 Small Fuel Tank (was X360) — ServiceModule, 25 kL
@PART[KKAOSS_Fuel_Tank_small]:NEEDS[PlanetaryBaseInc,RealFuels]:Final
{
    @title = K&K X25 Small Fuel Tank
    @mass = 2.4
    @cost = 4000
    @entryCost = 16600
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
