        basemass = -1
    }
}

@PART[KKAOSS_Rocket_Fuel_Tank]:NEEDS[PlanetaryBaseInc,RealFuels]:Final
{
    !RESOURCE,*{}
    @MODULE[ModuleFuelTanks]
    {
        @volume = 12000
    }
}

@PART[KKAOSS_small_Rocket_Fuel_Tank|KKAOSS_RCS_Tank]:NEEDS[PlanetaryBaseInc,RealFuels]:Final
{
    !RESOURCE,*{}
