        @volume = 6000
    }
}

// Battery — Z-150U: 150 kWh, 150 Wh/kg, $500/kWh
@PART[KKAOSS_Battery_Tank]:NEEDS[PlanetaryBaseInc]:Final
{
    @mass = 1.0
    @cost = 75
    @title = K&K Z-150U Battery Container
    @description = This Z-150U battery container provides massive power storage for stations and surface bases. Guarantee void when used on a Spacecraft!
    @RESOURCE[ElectricCharge]
    {
        @amount = 150000
        @maxAmount = 150000
    }
}
