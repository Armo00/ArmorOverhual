@PART[KKAOSS_Central_Hub]:NEEDS[PlanetaryBaseInc,RealFuels]:Final
{
    @mass = 26
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    @description ^= :$:  Life Support System rated for 380 crew-day.:
    %MODULE[RasterPropMonitorComputer]{}

    MODULE
    {
        name = ModuleFuelTanks
        volume = 5000
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = Food
            amount = Full
            maxAmount = 2222.7264
        }

        TANK
        {
            name = Water
            amount = Full
            maxAmount = 1470.8736
        }

        TANK
        {
            name = Oxygen
            amount = Full
            maxAmount = 224899.2
        }

        TANK
        {
            name = ElectricCharge
            amount = Full
            maxAmount = 50000
        }
    }
}

