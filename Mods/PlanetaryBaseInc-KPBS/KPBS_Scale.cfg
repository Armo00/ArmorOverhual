@PART[KKAOSS_INV_Tank|KKAOSS_INV_Tank_big|KKAOSS_INV_FuelTank_small_2|KKAOSS_INV_FuelTank_2|KKAOSS_LS_container_USILS_big|KKAOSS_LS_container_USILS_noms_big|KKAOSS_LS_container_USILS_noms_small|KKAOSS_LS_container_USILS_small|KKAOSS_LS_container_airfilter|KKAOSS_LS_container_algae|KKAOSS_LS_container_carbon_extractor|KKAOSS_LS_container_co2_big|KKAOSS_LS_container_co2_small|KKAOSS_LS_container_eclss_big|KKAOSS_LS_container_eclss_small|KKAOSS_LS_container_elektron|KKAOSS_LS_container_fertilizer_big|KKAOSS_LS_container_fertilizer_small|KKAOSS_LS_container_food_big|KKAOSS_LS_container_food_small|KKAOSS_LS_container_greenhouse|KKAOSS_LS_container_hydrogen|KKAOSS_LS_container_ifils_big|KKAOSS_LS_container_ifils_small|KKAOSS_LS_container_ioncross_big|KKAOSS_LS_container_ioncross_small|KKAOSS_LS_container_mulch_big|KKAOSS_LS_container_mulch_small|KKAOSS_LS_container_nitrogen|KKAOSS_LS_container_oxygen_big|KKAOSS_LS_container_oxygen_small|KKAOSS_LS_container_sabatier|KKAOSS_LS_container_snacks_big|KKAOSS_LS_container_snacks_small|KKAOSS_LS_container_tacls_big|KKAOSS_LS_container_tacls_small|KKAOSS_LS_container_tacls_waste_big|KKAOSS_LS_container_tacls_waste_small|KKAOSS_LS_container_waste_big|KKAOSS_LS_container_waste_small|KKAOSS_LS_container_wastewater_big|KKAOSS_LS_container_wastewater_small|KKAOSS_LS_container_water_big|KKAOSS_LS_container_water_small|KKAOSS_LS_container_waterpurifier|KKAOSS_LS_container_USILS_recycler|KKAOSS_LS_container_air_scrubber|KKAOSS_USI_Recicler_g|KKAOSS_LS_container_kerbalism_big|KKAOSS_LS_container_kerbalism_small]:NEEDS[PlanetaryBaseInc]:Final
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 2.5
    }
}

// ModSupport parts
@PART[KKAOSS_KIS_FuelTank|KKAOSS_KIS_FuelTank_small|KKAOSS_KIS_Tank|KKAOSS_KIS_Tank_big|KKAOSS_LS_drill_water|KKAOSS_Water_OrbitalScanner|KKAOSS_Water_SurfaceScanner|KKAOSS_MKS_Workshop|KKAOSS_MKS_WOLFTerminal|KKAOSS_DirtDrill|KKAOSS_MaterialKits|KKAOSS_OSEConverter|KKAOSS_OSEResources|KKAOSS_OSEworkshop|KKAOSS_Storage_Metal|KKAOSS_Storage_MetalOre|KKAOSS_Storage_RocketParts|KKAOSS_Launchpad|KKAOSS_PartRecycler|KKAOSS_ScrapMetal|KKAOSS_Smelter|KKAOSS_Workshop|KKAOSS_container_SEP|KKAOSS_MetalOreDrill]:NEEDS[PlanetaryBaseInc]:Final
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 2.5
    }
}

// ################################################################
// §3 — Docking Ports: size2 + description append
// ################################################################

@PART[KKAOSS_dock_gangway|KKAOSS_dock_habitat]:NEEDS[PlanetaryBaseInc]:Final
{
    @bulkheadProfiles = size2
    @description ^= :$:  Node uses size2.:
}

// ################################################################
// §4 — Landing Engine: thrust ×4 (= rescaleFactor²)
// ################################################################

@PART[KKAOSS_engine_g]:NEEDS[PlanetaryBaseInc]:Final
{
    @mass = 1.2
    @MODULE[ModuleEngines*]
    {
        @maxThrust = 440
    }
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 1800
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = LqdMethane
            amount = Full
            maxAmount = 41.37%
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 58.63%
        }
    }
}

// ################################################################
// §5 — Heat Shield: ablator ×4
// ################################################################

@PART[KKAOSS_base_heatshield]:NEEDS[PlanetaryBaseInc]:Final
{
    @mass = 1.4
    @RESOURCE[Ablator]
    {
        @amount = 4800
        @maxAmount = 4800
    }
}
