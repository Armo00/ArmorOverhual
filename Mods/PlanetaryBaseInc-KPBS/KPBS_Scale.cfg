// Modified 2026-06-19
// KPBS ×2 geometry scale pass

// ################################################################
// §1 — rescaleFactor (all parts)
// ################################################################

@PART[KKAOSS_*]:NEEDS[PlanetaryBaseInc]:Final
{
    @rescaleFactor = 2
}

// ################################################################
// §2 — TweakScale (all PlanetaryBase profile parts)
// defaultScale = 2.5 matches the ×2 scaled diameter
// Excluding srf-attached parts (landing gear, legs, ground plate)
// ################################################################

@PART[KKAOSS_Automatic_Control_g|KKAOSS_Central_Hub|KKAOSS_Control_g|KKAOSS_Cupola_g|KKAOSS_Service_g|KKAOSS_Centrifuge|KKAOSS_Nuclear_Fuel|KKAOSS_Nuclear_Reactor|KKAOSS_Fuel_Tank|KKAOSS_Fuel_Tank_small|KKAOSS_drill|KKAOSS_ISRU_g|KKAOSS_Science_g|KKAOSS_Greenhouse_g|KKAOSS_Habitat_MK1_g|KKAOSS_Habitat_MK2_g|KKAOSS_adapter_base_to_MK2_g|KKAOSS_adapter_base_to_Size1_g|KKAOSS_base_bicupler|KKAOSS_base_separator|KKAOSS_base_tricupler|KKAOSS_base_heatshield|KKAOSS_CrossSection_g|KKAOSS_dock_gangway|KKAOSS_dock_habitat|KKAOSS_engine_g|KKAOSS_adapter_g|KKAOSS_Flatbed|KKAOSS_airlock_end_g|KKAOSS_airlock_mid_g|KKAOSS_garage_adapter_g_2|KKAOSS_garage_cover_g_2|KKAOSS_garage_decoupler_g|KKAOSS_garage_front_g_2|KKAOSS_garage_side_g_2|KKAOSS_garage_struct_g_2|KKAOSS_garage_adapter_size3_g|KKAOSS_Storage_End_Cap_Storage|KKAOSS_Storage_g|KKAOSS_Storage_mid_g|KKAOSS_Storage_mini_g|KKAOSS_Storage_size2_m|KKAOSS_Storage_size2_s|KKAOSS_Battery_Tank|KKAOSS_Fuelcell_Tank|KKAOSS_Liquid_Fuel_Tank|KKAOSS_Ore_Tank|KKAOSS_Small_Ore_Tank|KKAOSS_RCS_Tank|KKAOSS_Rocket_Fuel_Tank|KKAOSS_small_Rocket_Fuel_Tank|KKAOSS_ScienceJr_Tank|KKAOSS_Xenon_Tank]:NEEDS[PlanetaryBaseInc]:Final
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 2.5
    }
}

