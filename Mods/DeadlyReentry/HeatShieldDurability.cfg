// Modified 2026-09-06
// AO / Deadly Reentry heat-shield normalization and durability tuning.
//
// Deadly Reentry converts stock ModuleAblator modules to ModuleHeatShield before
// AOs FINAL patches run. Some AO patches therefore miss the converted module,
// while other FINAL patches add a second ModuleAblator after DRE has finished.
// Normalize only AO-managed heat shields here and leave all resource quantities
// unchanged.
// KCHS_Mengzhou_Heat_Shield is a one-time KIU exception: its RealFuels FINAL
// patch still targets ModuleAblator after DRE has converted it, so normalize
// the dedicated lunar-return shield here without changing its resource load.

// Convert AO-added late ModuleAblator modules when DRE did not already create a
// ModuleHeatShield.
@PART[HeatShield0|HeatShield1|HeatShield1p5|HeatShield2|HeatShield3|HeatShield3_adv|BCS_Centauri_HeatShield|BCS_Centauri_HeatShield_Lunar|CST-100?Heat?Shield??Black*|CST-100?Heat?Shield??Brown*|Heatshield-M|KK_SpXCD_capsule|KK_SpXCD_capsule_cargo|KK_SpXCD_heatshield|NP_OdinCapsule2|NP_OdinCapsule2W|NP_newOdinShield|NP_FreyjaCapsule|CTNmavPOD|B2_LRB_engine|TE_18_DRAGONV2_HEATSHIELD|KCHS_Mengzhou_Heat_Shield]:HAS[!MODULE[ModuleHeatShield],@MODULE[ModuleAblator]]:NEEDS[DeadlyReentry]:FINAL
{
    @MODULE[ModuleAblator],0
    {
        @name = ModuleHeatShield
    }
}

// If a part already had a DRE module, discard any ModuleAblator added later by
// AO. This prevents two modules from consuming or managing the same resource.
@PART[HeatShield0|HeatShield1|HeatShield1p5|HeatShield2|HeatShield3|HeatShield3_adv|BCS_Centauri_HeatShield|BCS_Centauri_HeatShield_Lunar|CST-100?Heat?Shield??Black*|CST-100?Heat?Shield??Brown*|Heatshield-M|KK_SpXCD_capsule|KK_SpXCD_capsule_cargo|KK_SpXCD_heatshield|NP_OdinCapsule2|NP_OdinCapsule2W|NP_newOdinShield|NP_FreyjaCapsule|CTNmavPOD|B2_LRB_engine|TE_18_DRAGONV2_HEATSHIELD|KCHS_Mengzhou_Heat_Shield]:HAS[@MODULE[ModuleHeatShield],@MODULE[ModuleAblator]]:NEEDS[DeadlyReentry]:FINAL
{
    !MODULE[ModuleAblator],* {}
}

// Common DRE behavior. Durability is tuned with pyrolysisLossFactor below;
// keeping the DRE loss curve and conductivity avoids delayed protection and
// excessive heat leakage into the protected part.
@PART[HeatShield0|HeatShield1|HeatShield1p5|HeatShield2|HeatShield3|HeatShield3_adv|BCS_Centauri_HeatShield|BCS_Centauri_HeatShield_Lunar|CST-100?Heat?Shield??Black*|CST-100?Heat?Shield??Brown*|Heatshield-M|KK_SpXCD_capsule|KK_SpXCD_capsule_cargo|KK_SpXCD_heatshield|NP_OdinCapsule2|NP_OdinCapsule2W|NP_newOdinShield|NP_FreyjaCapsule|CTNmavPOD|B2_LRB_engine|TE_18_DRAGONV2_HEATSHIELD|KCHS_Mengzhou_Heat_Shield]:HAS[@MODULE[ModuleHeatShield]]:NEEDS[DeadlyReentry]:FINAL
{
    @MODULE[ModuleHeatShield],0
    {
        %lossExp = -7500
        %lossConst = 1
        %reentryConductivity = 0.001
        %ablationTempThresh = 900
        %depletedMaxTemp = 1800
    }
}

// Standard and LEO-rated shields. The current AO durability target is 57500;
// resource amount and maxAmount remain unchanged.
@PART[HeatShield0|HeatShield1|HeatShield1p5|HeatShield2|HeatShield3|BCS_Centauri_HeatShield|CST-100?Heat?Shield??Black*|CST-100?Heat?Shield??Brown*|NP_OdinCapsule2|NP_OdinCapsule2W|NP_newOdinShield]:HAS[@MODULE[ModuleHeatShield]]:NEEDS[DeadlyReentry]:FINAL
{
    @MODULE[ModuleHeatShield],0
    {
        %pyrolysisLossFactor = 57500
    }
}

// Reinforced, reusable, or integrated recovery shields.
@PART[Heatshield-M|KK_SpXCD_capsule|KK_SpXCD_capsule_cargo|KK_SpXCD_heatshield|NP_FreyjaCapsule|CTNmavPOD|B2_LRB_engine]:HAS[@MODULE[ModuleHeatShield]]:NEEDS[DeadlyReentry]:FINAL
{
    @MODULE[ModuleHeatShield],0
    {
        %pyrolysisLossFactor = 90000
    }
}

// Escape-velocity / lunar-return shields.
@PART[HeatShield3_adv|BCS_Centauri_HeatShield_Lunar|TE_18_DRAGONV2_HEATSHIELD|KCHS_Mengzhou_Heat_Shield]:HAS[@MODULE[ModuleHeatShield]]:NEEDS[DeadlyReentry]:FINAL
{
    @MODULE[ModuleHeatShield],0
    {
        %pyrolysisLossFactor = 150000
    }
}

// Preserve the CST-100 charred-ablator output behavior explicitly because its
// original AO patch targeted ModuleAblator and therefore missed DREs module.
@PART[CST-100?Heat?Shield??Black*|CST-100?Heat?Shield??Brown*]:HAS[@MODULE[ModuleHeatShield]]:NEEDS[DeadlyReentry]:FINAL
{
    @MODULE[ModuleHeatShield],0
    {
        %outputResource = CharredAblator
        %outputMult = 1.0
        %charMin = 0
        %charMax = 1
    }
}
