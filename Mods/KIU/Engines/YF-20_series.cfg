// Modified 2026-11-01

@PART[KCLV_YF-21C|KCLV_YF-20_Series_Engine|KCLV_YF22|KCLV_YF23V]:NEEDS[RealFuels]:FINAL
{
    %TechRequired = improvedGGEngine
}

// ============================================================================
// Alternate timeline: 1976 US aerospace assistance (LR-87 technology)
// ----------------------------------------------------------------------------
// In this timeline the US began supplying China with aerospace aid in 1976,
// including LR-87 technology: injector pattern, regenerative cooling practice,
// turbopump metallurgy and start-system design. Chinese engineers folded those
// lessons into the YF-20 family, producing the "-LR" variants below.
//
// Relative to the baseline YF-20 family:
//   * +10% vacuum thrust (higher chamber pressure)
//   * +10 s vacuum Isp, +9 s sea-level Isp (injector + cooling)
//   * -5% dry mass (massMult 0.95, improved turbine/blade alloys)
//   * YF-22-LR / YF-23-LR gain a second start from the transferred start system
// Propellants stay UDMH/NTO so existing CZ tankage remains compatible.
// ============================================================================

// YF-21-LR : LR-87-derived upgrade of the 4x YF-20 first-stage cluster
// Thrust 3640 kN (4 x 910 kN), TWR ~ 3640 / 28.0 ~ 130 (vacuum, 2.85 t dry)
@PART[KCLV_YF-21C]:NEEDS[RealFuels]:FINAL
{
    @MODULE[ModuleEngineConfigs]
    {
        CONFIG
        {
            name = YF-21-LR
            description = LR-assisted variant of the YF-21 (4 x YF-20). US-supplied LR-87 injector and cooling technology raised chamber pressure and cut dry mass. An engine from the 1976 alternate timeline.
            minThrust = 3640
            maxThrust = 3640
            heatProduction = 100
            massMult = 0.95
            %ullage = True
            %pressureFed = False
            %ignitions = 1
            cost = 240
            PROPELLANT
            {
                name = UDMH
                ratio = 0.46
                DrawGauge = True
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.54
            }
            atmosphereCurve
            {
                key = 0 301
                key = 1 270
            }
            IGNITOR_RESOURCE
            {
                name = TEATEB
                amount = 1.0
            }
        }
    }
}

