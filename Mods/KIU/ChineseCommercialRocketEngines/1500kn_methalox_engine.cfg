// Modified 2026-08-05

+PART[cryoengine-iguanodon-1]:Final
{
    @rescaleFactor = 0.8
    @name = KCLV_CCRE_1500M
    @title = YF-219
    @manufacturer = CASC 6th Academy
    @description = Several 1500kn class Chinese Commercial Methalox engines.
    %node_attach = 0.0, 0.895, 0.0, 0.0, 1.0, 0.0, 2
    %node_stack_top = 0.0, 1.187, 0.0, 0.0, 1.0, 0.0, 2
    %entryCost = 480000
    %cost = 0
    @mass = 1
    %TechRequired = advancedGGEngine

    %VABORGANIZER
    {
        %organizerSubcategory = MethaloxEngines
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
    {
        @SUBTYPE[1.25m]
        {
            @title = 1.5m
            @descriptionSummary = 1.5m Stack Mount
            @attachNode =  0.0, 0.895, 0.0, 0.0, 1.0, 0.0, 0
            @NODE[top]
            {
                %position = 0.0, 1.38, 0.0
            }
        }
        @SUBTYPE[Boattail]
        {
            @attachNode =  0.0, 0.895, 0.0, 0.0, 1.0, 0.0, 0
            @NODE[top]
            {
                %position = 0.0, 1.38, 0.0
            }
        }
        @SUBTYPE[Compact]
        {
            @attachNode =  0.0, 0.916, 0.0, 0.0, 1.0, 0.0, 0
            @NODE[top]
            {
                %position = 0.0, 1.3, 0.0
            }
        }
    }

    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.5
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }
    @MODULE[ModuleGimbal]
    {
        %gimbalRange = 8
    }
    !MODULE[ModuleEngineConfigs],*{}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = YF-219 Dev
        origMass = 1
        CONFIG
        {
            name = YF-219 Dev
            description = YF-219（液发-219）是航天科技集团六院研制的液氧/甲烷燃气发生器循环发动机，"八年九机"工程成果，与 YF-209 技术同源，用于长征十号乙二级。采用甲烷自生增压。本配置为首飞海平面型：海平面推力 140t，真空推力 152t，真空比冲 318s，海平面比冲 293s。
            minThrust = 402.6
            maxThrust = 1491.1
            heatProduction = 12
            massMult = 1.2
            ullage = True
            pressureFed = False
            ignitions = 100
            cost = 2350
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.8
            }
            atmosphereCurve
            {
                key = 0 318
                key = 1 293
            }
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.4137
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.5863
            }
        }

        CONFIG
        {
            name = YF-219E
            description = YF-219E 是 YF-219 的改进型（真空优化喷管），用于长征十号丙二级。真空推力 160t，真空比冲 329s；海平面比冲按首飞型同比例损失反推为 303s，海平面推力 1446kN。
            minThrust = 402.6
            maxThrust = 1569.6
            heatProduction = 13
            massMult = 1.25
            ullage = True
            pressureFed = False
            ignitions = 100
            cost = 2500
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.8
            }
            atmosphereCurve
            {
                key = 0 329
                key = 1 303
            }
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.4137
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.5863
            }
        }

    }

    @MODULE[ModuleWaterfallFX]
    {
        %moduleID = CCRE_1500M
        @TEMPLATE,0
        {
            @templateName = waterfall-methalox-lower-BE4-1
            @scale[*] *= #$/rescaleFactor$
        }
    }
}
