// Modified 2026-09-01
// Armor Overhaul: keep the Sol Wenchang coordinates while restoring a usable KSC terrain footprint.

@KSCSWITCHER:NEEDS[KSCSwitcher,SolSystem]:FINAL
{
    @LaunchSites
    {
        @Site[cn_wenchang]
        {
            @PQSCity
            {
                %latitude = 19.614492
                %longitude = 110.941133
                %repositionRadiusOffset = 30
                %repositionToSphereSurface = false
                %reorientFinalAngle = -190
            }

            @PQSMod_MapDecalTangent
            {
                %radius = 20000
                %heightMapDeformity = 0
                %absoluteOffset = 50
                %absolute = true
                %latitude = 19.614492
                %longitude = 110.941133
            }
        }
    }
}
