// Keep only Low / Default / High in settings.cfg for the Sol installation.
// Do not declare the obsolete RSS_High preset here: Parallax Continued checks
// that the selected preset is the LAST entry, not that its name is "High".
// Declaring RSS_High would append a fourth entry and make High fail that check.

// UpdateConfig in the installed DLL asks for "Kopernicus-config", whereas
// 02_ConfigCompat.cfg saves "Kopernicus_config". Without the alias below,
// ConfigReader uses the current selection as its comparison default and
// never writes SelectedPQSQuality to the user override file on exit.
// Supply the actual pre-user-override baseline, not a forced selection.
@Kopernicus_config_backup:HAS[@Kopernicus_config]:NEEDS[Kopernicus]:FINAL
{
    %Kopernicus-config
    {
        %SelectedPQSQuality = #$../Kopernicus_config/SelectedPQSQuality$
    }
}
