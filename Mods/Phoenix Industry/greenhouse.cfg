// Modified 2026-08-09
// DS-6 Greenhouse — 1 kerbal, 20 kW (20 kW/person) → EC 5.56
// 原 converter 引用 Snacks/Soil（Snacks mod 未安装，资源未定义 → 无法运行）
// 重写为 CRP/TAC 风格（与其他温室一致）：Fertilizer/WasteWater/CO₂/Waste → O₂/Food/Water/H₂

@PART[phoenixgreenhouse]:NEEDS[CommunityResourcePack]:Final
{
    @category = Science
    @tags = life support food produce greenhouse cck-lifesupport
    @description ^= :$: Rated for 1 kerbal. 20 kW (20.0 kW/person) power draw.:

    !MODULE[ModuleResourceConverter] {}
    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Greenhouse
        StartActionName = Start Farming
        StopActionName = Stop Farming
        GeneratesHeat = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 5.56   //  20000w, 20 kW/person × 1
        }
        INPUT_RESOURCE
        {
            ResourceName = Fertilizer
            Ratio = 5.787e-7
        }
        INPUT_RESOURCE
        {
            ResourceName = WasteWater
            Ratio = 5.699e-5
        }
        INPUT_RESOURCE
        {
            ResourceName = CarbonDioxide
            Ratio = 5.919e-3
        }
        INPUT_RESOURCE
        {
            ResourceName = Waste
            Ratio = 6.15e-6
        }

        OUTPUT_RESOURCE
        {
            ResourceName = Oxygen
            Ratio = 6.86e-3
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Food
            Ratio = 6.78e-5
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Water
            Ratio = 4.49e-5
            DumpExcess = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Hydrogen
            Ratio = 1.78e-3
            DumpExcess = true
        }
    }

    // 原 Snacks/Soil 资源未定义，替换为 CRP 存储
    !RESOURCE[Snacks] {}
    !RESOURCE[Soil] {}
    RESOURCE
    {
        name = Fertilizer
        amount = 300
        maxAmount = 300
    }
    RESOURCE
    {
        name = Waste
        amount = 0
        maxAmount = 50
    }
}
