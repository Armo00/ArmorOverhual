// Modified 2026-08-10
// Arc Reactor 625 (phoenixreactor-0625) — ArcElement 金属氢聚变反应堆
// 40 kg / 0.625m (rescale 0.25) / 10.8 GW (3,000,000 EC/s) / 几乎零发热
// Fuel: ArcElement 2.296296e-5 U/s (~1.49 kg/day), 装载 724 U = 543 kg (满功率 1 年)
// Product: LqdHelium 9.589698e-5 U/s (质量守恒 0.9945), DumpExcess=true 溢出排空
// EC 输出 DumpExcess=false → 电池充满自动暂停 (原版燃料电池行为)
// 部署同步: Y:\KSP_1.12.3\TestRun\GameData\zzzArmorOverhual (由 Dr Armor 手动同步)

+PART[phoenixreactor]:Final
{
    @rescaleFactor = 0.25
    @name = phoenixreactor-0625
    @title = Arc Reactor 625
    @description = A compact metallic-hydrogen fusion reactor rated at 10.8 GW of electrical power with negligible waste heat. Consumes ArcElement fuel and produces helium. Designed as the primary power source for large crewed spacecraft.
    @entryCost = 3000000
    @cost = 1000000
    @maxTemp = 2373.15
    @mass = 0.04
    %bulkheadProfiles = size0
    %attachRules = 1,1,1,1,0

    !MODULE[ModuleGenerator]{}
    !MODULE[ModuleCoreHeat]{}
    !MODULE[ModuleOverheatDisplay]{}
    !MODULE[TweakScale] {}
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 0.625
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Arc Reactor
        StartActionName = Start Arc Reactor
        StopActionName = Stop Arc Reactor
        ToggleActionName = Toggle Arc Reactor
        FillAmount = 0.95
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ArcElement
            Ratio = 0.00002296296   // ~1.49 kg/day, 724 U/yr
            FlowMode = NO_FLOW
        }
        OUTPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 3000000          // 10.8 GW; DumpExcess=false → auto-pause when EC full
            DumpExcess = false
        }
        OUTPUT_RESOURCE
        {
            ResourceName = LqdHelium
            Ratio = 0.00009589698    // mass conservation 0.9945
            DumpExcess = true        // overflow dumped, never blocks the reactor
        }
    }

    RESOURCE
    {
        name = ArcElement
        amount = 724
        maxAmount = 724
    }
    RESOURCE
    {
        name = LqdHelium
        amount = 0
        maxAmount = 100    // 演示收集罐; 溢出排空
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 3000000
        maxAmount = 3000000    // 1 秒输出缓冲
    }
}
