// Modified 2026-08-11
// Arc Reactor 10 (phoenixreactor-0625) — 10.8 GW 金属氢聚变反应堆
// 40 kg / 0.625m (rescale 0.25) / 10.8 GW (3,000,000 EC/s) / 几乎零发热
// Fuel: ArcElement 2.296296e-5 U/s (100 U = 75 kg → 满功率 ~50 天)
// Product: LqdHelium 9.589698e-5 U/s (质量守恒 0.9945), 满载时溢出排空
// EC 以 95% 为稳压目标，接近目标后自动匹配实际用电负载；无启停水位、无定时器

+PART[phoenixreactor]:Final
{
    @rescaleFactor = 0.25
    @name = phoenixreactor-0625
    @title = Arc Reactor 10
    @description = A compact metallic-hydrogen fusion reactor rated at 10.8 GW of electrical power with negligible waste heat. Consumes ArcElement fuel and produces helium. 100 units of fuel provide approximately 50 days of operation at full power.
    @entryCost = 3000000
    @cost = 1000000
    @maxTemp = 2373.15
    @mass = 0.04
    %bulkheadProfiles = size0
    %attachRules = 1,1,1,1,0

    !MODULE[ModuleGenerator]{}
    !MODULE[ModuleCoreHeat]{}
    !MODULE[ModuleOverheatDisplay]{}
    !MODULE[ModuleSystemHeatFissionReactor]{}
    !MODULE[TweakScale] {}
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 0.625
    }

    MODULE
    {
        name = ModuleArcReactor
        ConverterName = Arc Reactor
        StartActionName = Start Arc Reactor
        StopActionName = Stop Arc Reactor
        ToggleActionName = Toggle Arc Reactor
        powerPercentage = 100
        sliderStep = 1
        FillAmount = 0.95
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ArcElement
            Ratio = 0.00002296296   // ~1.98 U/day, 100 U → ~50 days at full power
            FlowMode = NO_FLOW
        }
        OUTPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 3000000      // 10.8 GW at 100% power
            FlowMode = ALL_VESSEL
            blocked_when_full = true
        }
        OUTPUT_RESOURCE
        {
            ResourceName = LqdHelium
            Ratio = 0.00009589698   // mass conservation 0.9945 (0.75 kg/U → 0.1786 kg/U)
            blocked_when_full = false // overflow dumped, never blocks the reactor
        }
    }

    RESOURCE
    {
        name = ArcElement
        amount = 100
        maxAmount = 100
    }
    RESOURCE
    {
        name = LqdHelium
        amount = 0
        maxAmount = 100    // 演示收集罐
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 1000000
        maxAmount = 1000000
    }
}
