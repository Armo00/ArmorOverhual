// Modified 2026-08-31

// 精准模型路径重定向：仅处理 Science.cfg / utility.cfg 涉及的 5 个 Stock 零件
// 原 @PART[*] 版本横扫全部零件，且 @model 重写对 mesh= 语法的零件无效（无 MODEL 节点）；
// 这里改为与 Science.cfg / utility.cfg 相同的 !mesh + MODEL 方式，目标路径一一对应
@PART[sensorAccelerometer]:FOR[zzzVSRPathPatch]
{
    !mesh = DELETE
    !MODEL {}
    MODEL
    {
        model = VenStockRevamp/Squad/Parts/ScienceParts/ACC
    }
}

