            pressureFed = False
            ignitions = 30
            cost = -1500
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1.5
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.7276
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.2724
            }
            atmosphereCurve
            {
                key = 0 435
                key = 1 346
            }
        }

    }
