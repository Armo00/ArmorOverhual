// Modified 2026-08-05
// RE-M7 "Pila" — High-pressure Gas Generator Hydrolox engine
// 扩张比 50:1, 真空优化, 涡轮废气注入喷管扩张段气膜冷却 (Merlin 1D Vac 风格)
// 三版本: 标准 (15.5MPa) / 增推 (+10% Pc) / 复用 (-10% Pc)

@PART[S2Pila]:Final
{
    @mass = 4
    @entryCost = 500000
    @cost = 15000
    %TechRequired = argumentedGGEngine

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    // ---- 氢氧羽流特效 (原文件 Hydrolox 误用 Hypergolic) ----
    PLUME
    {
        name = Hydrolox-Upper
        transformName = thrustTransform
        plumePosition = 0.0, 0.0, 0.5
        plumeScale = 1.15
        flarePosition = 0.0, 0.0, -1.0
        flareScale = 1.15
        localRotation = 0.0, 0.0, 0.0
        fixedScale = 1.0
        energy = 1.0
        speed = 1.0
        emissionMult = 0.5
    }

    PLUME
    {
        name = Hydrolox-Vernier
        transformName = vern01Transform
        plumePosition = 0.0, 0.1, 0.125
        plumeScale = 1.5
        flarePosition = 0.0, 0.0, 1.0
        flareScale = 1.0
        localRotation = 25.0, 0.0, 0.0
        fixedScale = 1.0
        energy = 1.0
        speed = 1.0
        emissionMult = 0.75
    }

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Standard
        origMass = 4

        CONFIG
        {
            name = Standard
            description = RE-M7 "Pila" 高压燃气发生器循环氢氧发动机. 燃烧室压力 15.5MPa, 扩张比 50:1 真空优化, 涡轮废气注入喷管扩张段气膜冷却. TWR: 84.13
            minThrust = 2500
            maxThrust = 3300
            powerEffectName = Hydrolox-Upper
            runningEffectName = Hydrolox-Vernier
            heatProduction = 196
            massMult = 1.0
            ullage = True
            pressureFed = False
            ignitions = 4
            cost = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1.5
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.7276
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.2724
            }
            atmosphereCurve
            {
                key = 0 435
                key = 1 355
            }
        }

        CONFIG
        {
            name = Boost
            description = RE-M7 "Pila" 增推版本. 燃烧室压力提高至 17.0MPa (+10%), 推力 +10%, 高压系统点火次数降至 2. TWR: 88.13
            minThrust = 2750
            maxThrust = 3630
            powerEffectName = Hydrolox-Upper
            runningEffectName = Hydrolox-Vernier
            heatProduction = 216
            massMult = 1.05
            ullage = True
            pressureFed = False
            ignitions = 2
            cost = 2000
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 2.0
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.7276
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.2724
            }
            atmosphereCurve
            {
                key = 0 435
                key = 1 362
            }
        }

        CONFIG
        {
            name = Reusable
            description = RE-M7 "Pila" 高复用版本. 燃烧室压力降至 14.0MPa (-10%), 推力和比冲小幅下降, 点火次数大幅提升至 30. TWR: 77.63
