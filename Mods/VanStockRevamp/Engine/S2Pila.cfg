// Modified 2026-08-05
// RE-M7 "Pila" — GG 开式循环氢氧发动机 (涡轮废气直接排放)
// 几何: 出口 1.7m / 喉部 0.25m / 扩张比 46:1 真空优化
// 三版本: 标准 (14.3MPa) / 增推 (+10% Pc) / 复用 (-10% Pc)

@PART[S2Pila]:Final
{
    @mass = 2.5
    @entryCost = 300000
    @cost = 11000
    %TechRequired = argumentedGGEngine

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    // ---- 氢氧羽流特效 (原文件 Hydrolox 误用 Hypergolic) ----
    PLUME
    {
        name = Hydrolox-Upper
        transformName = thrustTransform
        plumePosition = 0.0, 0.0, 0.5
        plumeScale = 1.15
        flarePosition = 0.0, 0.0, -1.0
        flareScale = 1.15
        localRotation = 0.0, 0.0, 0.0
        fixedScale = 1.0
        energy = 1.0
        speed = 1.0
        emissionMult = 0.5
    }

    PLUME
    {
        name = Hydrolox-Vernier
        transformName = vern01Transform
        plumePosition = 0.0, 0.1, 0.125
        plumeScale = 1.5
        flarePosition = 0.0, 0.0, 1.0
        flareScale = 1.0
        localRotation = 25.0, 0.0, 0.0
        fixedScale = 1.0
        energy = 1.0
        speed = 1.0
        emissionMult = 0.75
    }

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Standard
        origMass = 2.5

        CONFIG
        {
            name = Standard
            description = RE-M7 "Pila" 燃气发生器开式循环氢氧发动机. 燃烧室压力 14.3MPa, 扩张比 46:1 真空优化, 涡轮废气直接排放. 节流范围 64%. TWR: 57.08
            minThrust = 900
            maxThrust = 1400
            powerEffectName = Hydrolox-Upper
            runningEffectName = Hydrolox-Vernier
            heatProduction = 15
            massMult = 1.0
            ullage = True
            pressureFed = False
            ignitions = 4
            cost = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1.5
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.7276
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.2724
            }
            atmosphereCurve
            {
                key = 0 435
                key = 1 355
            }
        }

        CONFIG
        {
            name = Boost
            description = RE-M7 "Pila" 增推版本. 燃烧室压力提高至 15.7MPa (+10%), 推力 +10%, 高压下节流范围收窄至 90%, 点火次数降至 2. TWR: 60.77
            minThrust = 1400
            maxThrust = 1550
            powerEffectName = Hydrolox-Upper
            runningEffectName = Hydrolox-Vernier
            heatProduction = 15
            massMult = 1.04
            ullage = True
            pressureFed = False
            ignitions = 2
            cost = 500
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 2.0
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.7276
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.2724
            }
            atmosphereCurve
            {
                key = 0 435
                key = 1 362
            }
        }

