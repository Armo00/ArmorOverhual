// Modified 2026-09-01
// Bluedog Design Bureau real-size baseline.
// BDB's native design scale is normally 62.5% of the referenced hardware;
// RO's BDB patches therefore use 1.6 except where the reference gives a
// part-specific physical scale below.  Deleted programme families are
// explicitly excluded even if a shared BDB directory still contains a
// historical compatibility part.

@PART[bluedog_*]:HAS[#rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

// KSP treats an omitted rescaleFactor as 1.0.
@PART[bluedog_*]:HAS[~rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

// Apollo family and associated lunar hardware — 5/8 KSP scale in BDB.
@PART[bluedog_Apollo_*|bluedog_LM_*|bluedog_LRV_*|bluedog_LTV|bluedog_LTV_*|bluedog_ALSEP_*|bluedog_LittleJoe2_*|bluedog_EarlyLunarShelter*]:NEEDS[Bluedog_DB]:FINAL
