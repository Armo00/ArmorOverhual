// Modified 2026-09-06
// Removed BDB programme families: Able, Agena and Vanguard.
// Their dedicated PART trees/configs are absent. These deletions remove the
// last Able/Ablestar fairing choices embedded in otherwise retained shared
// SAF fairing parts without affecting the launch-clamp collection.

@PART[bluedog_FairingBase_0p625m_SAF]:NEEDS[Bluedog_DB,B9PartSwitch]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fairingSwitch]]
	{
		!SUBTYPE[able1] {}
		!SUBTYPE[able2] {}
		!SUBTYPE[able3] {}
		!SUBTYPE[ableConic] {}
		!SUBTYPE[ableHemi] {}
	}
}

@PART[bluedog_Juno4_FairingBase_0p9375]:NEEDS[Bluedog_DB,B9PartSwitch]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fairingSwitch]]
	{
		!SUBTYPE[AblestarPlus] {}
	}
}
