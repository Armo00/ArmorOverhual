// RF conversion by historical propellant family; source thrust and Isp are retained.
@PART[bluedog_Apollo_AARDV_Core|bluedog_Apollo_SIMbay_subSatellite|bluedog_CentaurD_Avionics|bluedog_CentaurT_Avionics|bluedog_Delta_Avionics|bluedog_Hexagon_Mk8_Capsule|bluedog_Jupiter_Guidance|bluedog_LDC_S2_Avionics|bluedog_MOL_ControlSegment|bluedog_Pegasus_ElectronicsCanister|bluedog_Saturn_S4B_InstrumentUnit|bluedog_Saturn_S4_InstrumentUnit|bluedog_Skylab_ATM_core|bluedog_Skylab_powerModule_core|bluedog_Skylab_VFB_entryProbe|bluedog_Skylab_TRS_probeCore|bluedog_IUS_Avionics|bluedog_TOS_Avionics|bluedog_Minotaur_GCA|bluedog_Minuteman_Avionics|bluedog_Pegasus_Avionics|bluedog_Taurus_Avionics|bluedog_HOSS_Avionics|bluedog_Titan2_S2_NoseCone|bluedog_Titan3_AvionicsTruss]:HAS[@MODULE[ModuleEngines*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @PROPELLANT[LiquidFuel]
        {
            @name = Kerosene
            @ratio = 0.37694087
            %DrawGauge = True
        }
        @PROPELLANT[Oxidizer]
        {
            @name = LqdOxygen
            @ratio = 0.62305913
        }
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
            @ratio = 1.0
            %DrawGauge = True
        }
        @PROPELLANT[SolidFuel]
        {
            @name = HTPB
            @ratio = 1.0
            %DrawGauge = True
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
}

// Explicit fallback only. These retained liquid RCS modules have no usable
// per-part historical mapping in either local RO reference tree. This patch
// deliberately does not create or remove ModuleEngineConfigs, so mixed
// RCS/main-engine parts cannot lose their calibrated main-engine MECs.
@PART[bluedog_Jupiter_Guidance|bluedog_Skylab_VFB_entryProbe|bluedog_Skylab_TRS_probeCore]:HAS[@MODULE[ModuleRCS*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleRCS*]
    {
        !resourceName = NULL
        !PROPELLANT,*
        {
        }
        PROPELLANT
        {
            name = Hydrazine
            ratio = 1.0
            DrawGauge = True
        }
        !atmosphereCurve
        {
        }
        atmosphereCurve
        {
            key = 0 230
            key = 1 95
        }
    }
    @RESOURCE[MonoPropellant]
    {
        @name = Hydrazine
    }
}

// Named fallback for every other retained BDB solid engine. Their source cfgs
// are enumerated in the audit; this block is intentionally exact, not wildcard.
@PART[bluedog_Skylab_VFB_entryProbe]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @RESOURCE[SolidFuel]
    {
        @name = HTPB
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = HTPB-SourceFallback
        origMass = #$/mass$
        CONFIG
        {
            name = HTPB-SourceFallback
            minThrust = #$/MODULE[ModuleEnginesRF]/minThrust$
            maxThrust = #$/MODULE[ModuleEnginesRF]/maxThrust$
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = HTPB
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,0$
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,1$
            }
        }
    }
}

// Preserve BDB's B9 geometry, node and transform selectors after AO converts
// the primary engine to ModuleEnginesRF.  Only remove the nested stock-engine
// performance modifiers: RF/MEC is authoritative for thrust, Isp and propellant.
// This deliberately keeps the B9 modules themselves so LinkB9PSModule can drive
// the physical model selected by an RF configuration.
@PART[bluedog_Apollo_AARDV_Core|bluedog_Apollo_SIMbay_subSatellite|bluedog_CentaurD_Avionics|bluedog_CentaurT_Avionics|bluedog_Delta_Avionics|bluedog_Hexagon_Mk8_Capsule|bluedog_Jupiter_Guidance|bluedog_LDC_S2_Avionics|bluedog_MOL_ControlSegment|bluedog_Pegasus_ElectronicsCanister|bluedog_Saturn_S4B_InstrumentUnit|bluedog_Saturn_S4_InstrumentUnit|bluedog_Skylab_ATM_core|bluedog_Skylab_powerModule_core|bluedog_Skylab_VFB_entryProbe|bluedog_Skylab_TRS_probeCore|bluedog_IUS_Avionics|bluedog_TOS_Avionics|bluedog_Minotaur_GCA|bluedog_Minuteman_Avionics|bluedog_Pegasus_Avionics|bluedog_Taurus_Avionics|bluedog_HOSS_Avionics|bluedog_Titan2_S2_NoseCone|bluedog_Titan3_AvionicsTruss]:HAS[@MODULE[ModuleEnginesRF],@MODULE[ModuleB9PartSwitch]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleB9PartSwitch],*
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesFX]]],*
            {
            }
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesRF]]],*
            {
            }
        }
    }
}

