@PART[bluedog_Jupiter_Guidance]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!RESOURCE[MonoPropellant],*
	{
	}
	!RESOURCE[ElectricCharge],*
	{
	}
	!MODULE[ModuleFuelTanks],*
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		volume = 30.06
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = full
			maxAmount = 60
			utilization = 1000
		}
		TANK
		{
			name = Hydrazine
			amount = full
			maxAmount = 30
		}
	}
}

