// Modified 2026-09-01
// Individually calibrated NTR and Juno IV engine MECs from local RO references.

@PART[bluedog_NERVA_FF]:HAS[@MODULE[ModuleEnginesRF]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        engineID = NERVA_FF
        configuration = NERVA_NRX-Hydrogen
        origMass = 11.297
        CONFIG
        {
            name = NERVA_NRX-Hydrogen
            minThrust = 122
            maxThrust = 243
            heatProduction = 100
            massMult = 1.0
            ullage = True
            pressureFed = False
            ignitions = 30
            throttleResponseRate = 0.035
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1.0
            }
            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 1.0
                DrawGauge = True
            }
            PROPELLANT
            {
                name = EnrichedUranium
                ratio = 0.00000000001
            }
            atmosphereCurve
            {
                key = 0 848
                key = 1 529
            }
        }
    }
}

