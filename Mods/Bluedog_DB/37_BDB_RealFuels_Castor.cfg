@PART[bluedog_Peacekeeper_Castor120]:HAS[@MODULE[ModuleEnginesRF]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
    }
    !MODULE[ModuleEngineConfigs]:HAS[#type[ModuleEngines]]
    {
    }
    !MODULE[ModuleFuelTanks],*
    {
    }
    !RESOURCE,*
    {
    }
    @MODULE[ModuleEnginesRF]
    {
        @minThrust = 1875
        @maxThrust = 1875
        %useThrustCurve = true
        !thrustCurve
        {
        }
        thrustCurve
        {
            key = 0 0.15 0 15
            key = 0.03 0.86 0.5 0
            key = 0.1 1 5 1
            key = 0.25 0.95 -1 0
            key = 0.3 1.05 5 0.4
            key = 0.97 1.05 -0.4 0
            key = 1 1 -5 0
        }
        @atmosphereCurve
        {
            @key,0 = 0 280
            @key,1 = 1 253
        }
    }
    MODULE
    {
        name = ModuleFuelTanks
        type = HTPB
        volume = 27655
        basemass = -1
        TANK
        {
            name = HTPB
            amount = 27655
            maxAmount = 27655
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Castor-120
        origMass = 4.35
        CONFIG
        {
            name = Castor-120
            minThrust = 1875
            maxThrust = 1875
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = HTPB
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 280
                key = 1 253
            }
            curveResource = HTPB
            thrustCurve
            {
                key = 0 0.15 0 15
                key = 0.03 0.86 0.5 0
                key = 0.1 1 5 1
                key = 0.25 0.95 -1 0
                key = 0.3 1.05 5 0.4
                key = 0.97 1.05 -0.4 0
                key = 1 1 -5 0
            }
        }
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = AOCastor120Length
        switcherDescription = Engine Geometry
        switcherDescriptionPlural = Engine Geometries
        SUBTYPE
        {
            name = Castor120
            transform = Castor120
        }
    }
    MODULE
    {
        name = ModuleB9DisableTransform
        transform = Castor120XL
    }
    MODULE
    {
        name = ModuleB9DisableTransform
        transform = SR118
    }
}

