// RealFuels tank migration for retained BDB hardware.
// Values are taken from the BDB RO reference, with legacy RO-only tank names
// mapped to tank definitions available in this installation:
// Tank-Iso*/Tank-Sep*/SM-* -> Default or ServiceModule as appropriate.

// BDB's own B9 fuel switches are disabled when RealFuels is installed.  Keep
// stock-resource leftovers from becoming unusable by converting them locally.


// RF conversion by historical propellant family; source thrust and Isp are retained.
@PART[bluedog_Apollo_AARDV_Antenna|bluedog_Apollo_ASTP_Antenna|bluedog_Apollo_Block2_highGain|bluedog_Apollo_Block3_highGain|bluedog_Apollo_Block5_highGain|bluedog_Apollo_ScimitarAntenna|bluedog_LM_Antenna_EVA|bluedog_LM_Antenna_VHF|bluedog_LRV_highGain|bluedog_Apollo_dipoleAntenna|bluedog_Apollo_VHFantenna|bluedog_Hexagon_VHF_Bent|bluedog_Hexagon_VHF_Straight|bluedog_MOL_rackDish|bluedog_MOL_TrackingAntenna|bluedog_GooLab_Antenna|bluedog_MORL_antenna|bluedog_Skylab_ATM_antenna|bluedog_Skylab_discone_antenna|bluedog_Skylab_EOSS_dishSmall|bluedog_Skylab_EOSS_paraAntenna|bluedog_Skylab_VFB_antenna|bluedog_Skylab_TRS_omniAntenna|bluedog_Titan_Transtage_Antenna]:HAS[@MODULE[ModuleEngines*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @PROPELLANT[LiquidFuel]
        {
            @name = Kerosene
            @ratio = 0.37694087
            %DrawGauge = True
        }
        @PROPELLANT[Oxidizer]
        {
            @name = LqdOxygen
            @ratio = 0.62305913
        }
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
            @ratio = 1.0
            %DrawGauge = True
        }
        @PROPELLANT[SolidFuel]
        {
            @name = HTPB
            @ratio = 1.0
            %DrawGauge = True
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
}

// Preserve BDB's B9 geometry, node and transform selectors after AO converts
// the primary engine to ModuleEnginesRF.  Only remove the nested stock-engine
// performance modifiers: RF/MEC is authoritative for thrust, Isp and propellant.
// This deliberately keeps the B9 modules themselves so LinkB9PSModule can drive
// the physical model selected by an RF configuration.
@PART[bluedog_Apollo_AARDV_Antenna|bluedog_Apollo_ASTP_Antenna|bluedog_Apollo_Block2_highGain|bluedog_Apollo_Block3_highGain|bluedog_Apollo_Block5_highGain|bluedog_Apollo_ScimitarAntenna|bluedog_LM_Antenna_EVA|bluedog_LM_Antenna_VHF|bluedog_LRV_highGain|bluedog_Apollo_dipoleAntenna|bluedog_Apollo_VHFantenna|bluedog_Hexagon_VHF_Bent|bluedog_Hexagon_VHF_Straight|bluedog_MOL_rackDish|bluedog_MOL_TrackingAntenna|bluedog_GooLab_Antenna|bluedog_MORL_antenna|bluedog_Skylab_ATM_antenna|bluedog_Skylab_discone_antenna|bluedog_Skylab_EOSS_dishSmall|bluedog_Skylab_EOSS_paraAntenna|bluedog_Skylab_VFB_antenna|bluedog_Skylab_TRS_omniAntenna|bluedog_Titan_Transtage_Antenna]:HAS[@MODULE[ModuleEnginesRF],@MODULE[ModuleB9PartSwitch]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleB9PartSwitch],*
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesFX]]],*
            {
            }
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesRF]]],*
            {
            }
        }
    }
}

