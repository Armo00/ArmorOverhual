// BDB Antenna: all existing adjustments for this part type.
// Internal patch order preserves the previous configuration sequence.
// Tank volumes are fixed per part; other parameter values retain the prior layout.

// Bluedog Design Bureau real-size baseline.
// BDB's native design scale is normally 62.5% of the referenced hardware;
// RO's BDB patches therefore use 1.6 except where the reference gives a
// part-specific physical scale below.  Deleted programme families are
// explicitly excluded even if a shared BDB directory still contains a
// historical compatibility part.
@PART[bluedog_Apollo_AARDV_Antenna|bluedog_Apollo_ASTP_Antenna|bluedog_Apollo_Block2_highGain|bluedog_Apollo_Block3_highGain|bluedog_Apollo_Block5_highGain|bluedog_Apollo_ScimitarAntenna|bluedog_LM_Antenna_EVA|bluedog_LM_Antenna_VHF|bluedog_LRV_highGain|bluedog_Apollo_dipoleAntenna|bluedog_Apollo_VHFantenna|bluedog_Hexagon_VHF_Bent|bluedog_Hexagon_VHF_Straight|bluedog_MOL_rackDish|bluedog_MOL_TrackingAntenna|bluedog_GooLab_Antenna|bluedog_MORL_antenna|bluedog_Skylab_ATM_antenna|bluedog_Skylab_discone_antenna|bluedog_Skylab_EOSS_dishSmall|bluedog_Skylab_EOSS_paraAntenna|bluedog_Skylab_VFB_antenna|bluedog_Skylab_TRS_omniAntenna|bluedog_Titan_Transtage_Antenna]:HAS[#rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

