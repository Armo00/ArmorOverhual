            {
                name = top
                position = 0.0, 12.731, 0.0
            }
        }
    }
    MODULE
    {
        name = ModuleB9DisableTransform
        transform = Length_17
    }
}

@PART[bluedog_SRMU]:NEEDS[Bluedog_DB,RealFuels,B9PartSwitch]:FINAL
