// Preserve BDB's B9 geometry, node and transform selectors after AO converts
// the primary engine to ModuleEnginesRF.  Only remove the nested stock-engine
// performance modifiers: RF/MEC is authoritative for thrust, Isp and propellant.
// This deliberately keeps the B9 modules themselves so LinkB9PSModule can drive
// the physical model selected by an RF configuration.
@PART[bluedog_*]:HAS[@MODULE[ModuleEnginesRF],@MODULE[ModuleB9PartSwitch]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleB9PartSwitch],*
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesFX]]],*
            {
            }
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesRF]]],*
            {
            }
        }
    }
}

// XLR-129 uses RF's bimodal CONFIG/SUBCONFIG selector.  Keep BDB's short and
// extended nozzle meshes synchronized with the corresponding RF mode.
@PART[bluedog_XLR129]:HAS[@MODULE[ModuleBimodalEngineConfigs],@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleWaterfallFX],#moduleID[XLR129Vac]]],*
            {
            }
        }
    }
    @MODULE[ModuleBimodalEngineConfigs]
    {
        @CONFIG[XLR129-P-1]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = XLR129_250K_B
            }
            @SUBCONFIG[XLR129-P-1-Extended]
            {
                %LinkB9PSModule[engineSwitch]
                {
                    subtype = XLR129_250K_V
                }
            }
        }
        @CONFIG[LR129-P-1]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = XLR129_250K_B
            }
            @SUBCONFIG[LR129-P-1-Extended]
            {
                %LinkB9PSModule[engineSwitch]
                {
                    subtype = XLR129_250K_V
                }
            }
        }
        @CONFIG[LR129-P-2]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = XLR129_350K_B
            }
            @SUBCONFIG[LR129-P-2-Extended]
            {
                %LinkB9PSModule[engineSwitch]
                {
                    subtype = XLR129_350K_V
                }
            }
        }
    }
}

// Direct RF-to-model mappings where BDB and AO have an unambiguous family
// relationship.  The J-2T performance upgrades share the same aerospike mesh.
@PART[bluedog_G1]:HAS[@MODULE[ModuleEngineConfigs],@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleEngineConfigs]
    {
        @CONFIG[G-1]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = G-1
            }
        }
        @CONFIG[G-1A]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = G-1A
            }
        }
    }
}

@PART[bluedog_DeltaIV_RS68]:HAS[@MODULE[ModuleEngineConfigs],@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
