        }
    }
}

@PART[bluedog_Saturn_Engine_J2T]:HAS[@MODULE[ModuleEngineConfigs],@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleEngineConfigs]
    {
        @CONFIG[J-2T-200K|J-2T-250K]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = J2T
            }
        }
    }
}

// BDB's optional Chrayol paint patch adds the same unscoped Titan-II texture
// to both the Titan-I and Titan-II paint switchers.  Let PaintB own that texture
// so two B9 modules no longer compete for the same renderer property.
@PART[bluedog_Titan_S1_UpperTank|bluedog_Titan_S1_LowerTank]:NEEDS[Bluedog_DB,B9PartSwitch]:FINAL
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitchPaintA]]
    {
        @SUBTYPE[Chrayol]
        {
            !TEXTURE:HAS[#currentTexture[bluedog_Titan2_SecondStageTank]],*
            {
            }
        }
    }
}
