// Modified 2026-09-01
// Prevent retained BDB B9 switches from recreating stock SolidFuel resources.

@PART[bluedog_Scout_Castor_Inline|bluedog_Scout_Algol_Short|bluedog_Scout_Algol_Radial|bluedog_Scout_Algol_Inline]:NEEDS[Bluedog_DB,RealFuels,B9PartSwitch]:FINAL
{
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[volumeSwitch]],*
    {
    }
}

@PART[bluedog_Delta_GEM60]:NEEDS[Bluedog_DB,RealFuels,B9PartSwitch]:FINAL
{
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]],*
    {
    }
    MODULE
    {
        name = ModuleB9DisableTransform
        transform = GEM60XL
    }
}

@PART[bluedog_LittleJoe2_Recruit]:NEEDS[Bluedog_DB,RealFuels,B9PartSwitch]:FINAL
{
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]],*
    {
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = AORecruitGeometry
        switcherDescription = Engine Geometry
        SUBTYPE
        {
            name = Single
            transform = Single
        }
    }
    MODULE
    {
        name = ModuleB9DisableTransform
        transform = Tri
    }
}

@PART[bluedog_Saturn_AJ260]:NEEDS[Bluedog_DB,RealFuels,B9PartSwitch]:FINAL
{
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[realnameMeshSwitchLength]],*
