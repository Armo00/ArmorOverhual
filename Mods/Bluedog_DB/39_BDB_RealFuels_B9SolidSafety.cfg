        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = RS68
            }
        }
        @CONFIG[RS-68A]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = RS68A
            }
        }
        @CONFIG[RS-68B]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = RS68B
            }
        }
        @CONFIG[RS-68K]
        {
            %LinkB9PSModule[engineSwitch]
            {
                subtype = RS68C
