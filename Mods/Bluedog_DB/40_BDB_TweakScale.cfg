// Modified 2026-09-01

// Normalize BDB's own diameter-based TweakScale modules after RealScale, then
// add AO's percentage-based free profile to uncovered RF propulsion/tank and
// ordinary structural/coupling hardware. Real-size geometry remains 100%.

@PART[bluedog_*]:HAS[@MODULE[TweakScale],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,TweakScale]:FINAL
{
    @MODULE[TweakScale],*
    {
        @type = free
        @defaultScale = 100
    }
}

@PART[bluedog_*]:HAS[@MODULE[ModuleEnginesRF],!MODULE[TweakScale],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,TweakScale]:FINAL
{
    MODULE
    {
        name = TweakScale
        type = free
        defaultScale = 100
    }
}

@PART[bluedog_*]:HAS[@MODULE[ModuleFuelTanks],!MODULE[TweakScale],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,TweakScale,RealFuels]:FINAL
