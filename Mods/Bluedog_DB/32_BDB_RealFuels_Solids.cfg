// Modified 2026-09-01
// BDB solid motors. Stock thrust curves, transforms, engineIDs and Waterfall
// modules are deliberately retained; only RF propellant/MEC data are supplied.

// P-11 subsatellite solid motor. Source: Agena/RO_Agena.cfg.
@PART[bluedog_Agena_Subsat_Hitchhiker]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]
    {
        @maxThrust = 6.0
        @PROPELLANT[HTPB]
        {
            @name = PSPC
        }
        @atmosphereCurve
        {
            @key,0 = 0 294
            @key,1 = 1 100
        }
    }
    @RESOURCE[SolidFuel]
    {
        @name = PSPC
        @amount = 2
        @maxAmount = 2
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = P-11
        origMass = 0.05
        CONFIG
        {
            name = P-11
            minThrust = 0
            maxThrust = 6.0
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = PSPC
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 294
                key = 1 100
                key = 7 0.001
            }
        }
    }
}

// Corona recovery solid retro. Source: Agena/RO_Return_Capsules.cfg.
@PART[bluedog_Corona_Retro]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]
    {
        @minThrust = 0
        @maxThrust = 15.0
        @PROPELLANT[HTPB]
        {
            @name = PSPC
        }
    }
    @RESOURCE[SolidFuel]
    {
        @name = PSPC
        @amount = 6
        @maxAmount = 6
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Corona-Retro
        origMass = #$/mass$
        CONFIG
        {
            name = Corona-Retro
            minThrust = 0
            maxThrust = 15.0
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = PSPC
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,0$
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,1$
            }
        }
    }
}

// Hexagon Mk8 recovery retro. CTPB is supplied by AO file 01 using the same
// HTPB-derived definition that RealismOverhaul normally creates.
// The Nitrogen spin RCS MEC in file 31 remains a separate ModuleRCS config.
@PART[bluedog_Hexagon_Mk8_Retro]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]
    {
        @minThrust = 0
        @maxThrust = 7.22
        @PROPELLANT[HTPB]
        {
            @name = CTPB
        }
        @atmosphereCurve
        {
            @key,0 = 0 255
            @key,1 = 1 211
        }
    }
    @RESOURCE[SolidFuel]
    {
        @name = CTPB
        @amount = 14.3
        @maxAmount = 14.3
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Hexagon-Retro
        origMass = 0.015
        CONFIG
        {
            name = Hexagon-Retro
            minThrust = 0
            maxThrust = 7.22
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = CTPB
                ratio = 1.0
                DrawGauge = True
            }
            curveResource = CTPB
            atmosphereCurve
            {
                key = 0 255
                key = 1 211
            }
        }
    }
}

