// Modified 2026-09-01
// RSMP installs its BDB plume first; BDB's AFTER[Bluedog_DB] patches otherwise
// add a second Waterfall module. Keep RSMP's main plume and only retain BDB's
// separate RCS plume where the part still has an RCS module.

