// bluedog_Titan_Transtage: preserve legacy resource cleanup; calibrated tank follows below.
@PART[bluedog_Titan_Transtage]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!RESOURCE[MonoPropellant],*
	{
	}
	!RESOURCE[ElectricCharge],*
	{
	}
}


@PART[bluedog_Titan_Transtage]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!MODULE[ModuleFuelTanks],* 
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 8788.96916
		basemass = -1
	}
}

// RF conversion by historical propellant family; source thrust and Isp are retained.
@PART[bluedog_Athena_OAM|bluedog_Peacekeeper_PostBoostVehicle|bluedog_Minuteman_PSRE|bluedog_Titan_Transtage]:HAS[@MODULE[ModuleEngines*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @PROPELLANT[LiquidFuel]
        {
            @name = Kerosene
            @ratio = 0.37694087
            %DrawGauge = True
        }
        @PROPELLANT[Oxidizer]
        {
            @name = LqdOxygen
            @ratio = 0.62305913
        }
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
            @ratio = 1.0
            %DrawGauge = True
        }
        @PROPELLANT[SolidFuel]
        {
            @name = HTPB
            @ratio = 1.0
            %DrawGauge = True
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
}

// Titan Transtage: two AJ10-138 family chambers. Source: Engine_Configs/AJ10_Adv_Config.cfg.
@PART[bluedog_Titan_Transtage]:HAS[@MODULE[ModuleEnginesRF]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = AJ10-138
        origMass = 0.69475
        CONFIG
        {
            name = AJ10-138
            minThrust = 35.585
            maxThrust = 35.585
            heatProduction = 100
            massMult = 1.1
            ullage = True
            pressureFed = True
            ignitions = 0
            PROPELLANT
            {
                name = Aerozine50
                ratio = 0.4432
                DrawGauge = True
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5568
            }
            atmosphereCurve
            {
                key = 0 302.2
                key = 0.868 1
            }
        }
        CONFIG
        {
            name = AJ10-138A
            minThrust = 35.585
            maxThrust = 35.585
            heatProduction = 100
            massMult = 1.1
            ullage = True
            pressureFed = True
            ignitions = 0
            PROPELLANT
            {
                name = Aerozine50
                ratio = 0.4432
                DrawGauge = True
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5568
            }
            atmosphereCurve
            {
                key = 0 310.6
                key = 0.868 1
            }
        }
    }
}

// Preserve BDB's B9 geometry, node and transform selectors after AO converts
// the primary engine to ModuleEnginesRF.  Only remove the nested stock-engine
// performance modifiers: RF/MEC is authoritative for thrust, Isp and propellant.
// This deliberately keeps the B9 modules themselves so LinkB9PSModule can drive
// the physical model selected by an RF configuration.
@PART[bluedog_Athena_OAM|bluedog_Peacekeeper_PostBoostVehicle|bluedog_Minuteman_PSRE|bluedog_Titan_Transtage]:HAS[@MODULE[ModuleEnginesRF],@MODULE[ModuleB9PartSwitch]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleB9PartSwitch],*
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesFX]]],*
            {
            }
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesRF]]],*
            {
            }
        }
    }
}

// Normalize BDB's own diameter-based TweakScale modules after RealScale, then
// add AO's percentage-based free profile to uncovered RF propulsion/tank and
// ordinary structural/coupling hardware. Real-size geometry remains 100%.
@PART[bluedog_Athena_OAM|bluedog_Peacekeeper_PostBoostVehicle|bluedog_Minuteman_PSRE|bluedog_Titan_Transtage]:HAS[@MODULE[TweakScale],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,TweakScale]:FINAL
{
    @MODULE[TweakScale],*
    {
        @type = free
        @defaultScale = 100
    }
}


@PART[bluedog_Athena_OAM|bluedog_Peacekeeper_PostBoostVehicle|bluedog_Minuteman_PSRE|bluedog_Titan_Transtage]:HAS[@MODULE[ModuleEnginesRF],!MODULE[TweakScale],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,TweakScale]:FINAL
