// Modified 2026-09-06

// Opt these BDB parts out of AO global runtime tank-volume arithmetic.
@PART[bluedog_Athena_OAM|bluedog_Peacekeeper_PostBoostVehicle|bluedog_Minuteman_PSRE|bluedog_Titan_Transtage]:NEEDS[Bluedog_DB,RealFuels]:FIRST
{
    %aoBDBExplicitTank = true
}
// BDB UpperStage: all existing adjustments for this part type.
// Internal patch order preserves the previous configuration sequence.
// Tank volumes are fixed per part; other parameter values retain the prior layout.

// Bluedog Design Bureau real-size baseline.
// BDB's native design scale is normally 62.5% of the referenced hardware;
// RO's BDB patches therefore use 1.6 except where the reference gives a
// part-specific physical scale below.  Deleted programme families are
// explicitly excluded even if a shared BDB directory still contains a
// historical compatibility part.
@PART[bluedog_Athena_OAM|bluedog_Peacekeeper_PostBoostVehicle|bluedog_Minuteman_PSRE|bluedog_Titan_Transtage]:HAS[#rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

// KSP treats an omitted rescaleFactor as 1.0.
@PART[bluedog_Athena_OAM|bluedog_Peacekeeper_PostBoostVehicle|bluedog_Minuteman_PSRE|bluedog_Titan_Transtage]:HAS[~rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

// Do not use bluedog_Pegasus_* here: BDB uses the prefix both for the
// Pegasus launcher and for the unrelated Saturn-launched Pegasus satellites.
@PART[bluedog_Minuteman_PSRE]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.36
}

// RealFuels tank migration for retained BDB hardware.
// Values are taken from the BDB RO reference, with legacy RO-only tank names
// mapped to tank definitions available in this installation:
// Tank-Iso*/Tank-Sep*/SM-* -> Default or ServiceModule as appropriate.

// BDB's own B9 fuel switches are disabled when RealFuels is installed.  Keep
// stock-resource leftovers from becoming unusable by converting them locally.
// bluedog_Minuteman_PSRE: offline fixed volume 50 L; see FixedTankVolumes.md.
@PART[bluedog_Minuteman_PSRE]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!RESOURCE[LiquidFuel],*
	{
	}
	!RESOURCE[Oxidizer],*
	{
	}
	!MODULE[ModuleFuelTanks],*
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		volume = 50
		type = Default
	}
}

// bluedog_Athena_OAM: offline fixed volume 125.06 L; see FixedTankVolumes.md.
@PART[bluedog_Athena_OAM]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!RESOURCE[MonoPropellant],*
	{
	}
	!RESOURCE[ElectricCharge],*
	{
	}
	!MODULE[ModuleFuelTanks],*
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		volume = 125.06
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = full
			maxAmount = 60
			utilization = 1000
		}
		TANK
		{
			name = Hydrazine
			amount = full
			maxAmount = 125
		}
	}
}

