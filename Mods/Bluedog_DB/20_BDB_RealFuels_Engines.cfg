// Modified 2026-09-01
// RF conversion by historical propellant family; source thrust and Isp are retained.

@PART[bluedog_*]:HAS[@MODULE[ModuleEngines*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @PROPELLANT[LiquidFuel]
        {
            @name = Kerosene
            @ratio = 0.38
            %DrawGauge = True
        }
        @PROPELLANT[Oxidizer]
        {
            @name = LqdOxygen
            @ratio = 0.62
        }
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
            @ratio = 1.0
            %DrawGauge = True
        }
        @PROPELLANT[SolidFuel]
        {
            @name = HTPB
            @ratio = 1.0
            %DrawGauge = True
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
}

// This base is retained solely for the separately calibrated X-405/X-405H
// patches below. All other retained kerolox engines have per-model MECs.
@PART[bluedog_Vanguard_GE405|bluedog_Vega_GE405H]:HAS[@MODULE[ModuleEnginesRF]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Kerolox
        origMass = #$/mass$
        CONFIG
        {
            name = Kerolox
            minThrust = #$/MODULE[ModuleEnginesRF]/minThrust$
            maxThrust = #$/MODULE[ModuleEnginesRF]/maxThrust$
            heatProduction = 100
            massMult = 1.0
            ullage = True
            pressureFed = False
            ignitions = 1
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.5
            }
            PROPELLANT
            {
                name = Kerosene
                ratio = 0.38
                DrawGauge = True
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.62
            }
            atmosphereCurve
            {
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,0$
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,1$
            }
        }
    }
}

// M-1 base is refined by the exact M-1-Spec block below. Other former members
// of this family receive per-model MECs in 23_BDB_RealFuels_HydroloxEngines.cfg.
@PART[bluedog_M1]:HAS[@MODULE[ModuleEnginesRF]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEnginesRF]
    {
        @PROPELLANT[Kerosene]
        {
            @name = LqdHydrogen
            @ratio = 0.728
        }
        @PROPELLANT[LqdOxygen]
        {
            @ratio = 0.272
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Hydrolox
        origMass = #$/mass$
        CONFIG
        {
            name = Hydrolox
            minThrust = #$/MODULE[ModuleEnginesRF]/minThrust$
            maxThrust = #$/MODULE[ModuleEnginesRF]/maxThrust$
            heatProduction = 100
            massMult = 1.0
            ullage = True
            pressureFed = False
            ignitions = 5
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.5
            }
            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.728
                DrawGauge = True
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.272
            }
            atmosphereCurve
            {
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,0$
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,1$
            }
        }
    }
}

// AJ10-42 Able: UDMH/IWFNA pressure-fed storable engine.
// Source: RealismOverhaul/Engine_Configs/AJ10_Early_Config.cfg.
@PART[bluedog_Able_Engine]:HAS[@MODULE[ModuleEnginesRF]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEnginesRF]
    {
        @PROPELLANT[Kerosene]
        {
            @name = UDMH
            @ratio = 0.4067
        }
        @PROPELLANT[LqdOxygen]
        {
            @name = IWFNA
            @ratio = 0.5943
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = AJ10-42
        origMass = 0.08
        CONFIG
        {
            name = AJ10-42
            minThrust = 33.0
            maxThrust = 33.0
            heatProduction = 100
            massMult = 1.0
            ullage = True
            pressureFed = True
            ignitions = 1
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.2
            }
            PROPELLANT
            {
                name = UDMH
                ratio = 0.4067
                DrawGauge = True
            }
            PROPELLANT
            {
                name = IWFNA
                ratio = 0.5943
            }
            atmosphereCurve
            {
                key = 0 267
                key = 1 122
            }
        }
    }
}

// M-1 reference configuration, distinct from the generic hydrolox family.
// Source: RealismOverhaul/Engine_Configs/M1_Config.cfg.
@PART[bluedog_M1]:HAS[@MODULE[ModuleEnginesRF],@MODULE[ModuleEngineConfigs]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEnginesRF]
    {
        @PROPELLANT[LqdHydrogen]
        {
            @ratio = 0.7631
        }
        @PROPELLANT[LqdOxygen]
        {
            @ratio = 0.2369
        }
    }
    @MODULE[ModuleEngineConfigs]
    {
        @configuration = M-1-Spec
        @origMass = 9.071
        @CONFIG[Hydrolox]
        {
            @name = M-1-Spec
            @minThrust = 5337.866
            @maxThrust = 5337.866
            @ignitions = 2
            @PROPELLANT[LqdHydrogen]
            {
                @ratio = 0.7631
            }
            @PROPELLANT[LqdOxygen]
            {
                @ratio = 0.2369
            }
            @atmosphereCurve
            {
                @key,0 = 0 428
                @key,1 = 1 306
            }
        }
    }
}

