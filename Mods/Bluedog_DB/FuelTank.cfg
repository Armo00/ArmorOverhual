// RF conversion by historical propellant family; source thrust and Isp are retained.
@PART[bluedog_LM_Descent_Tanks|bluedog_CentaurD_FuelTank|bluedog_CentaurIII_FuelTank|bluedog_CentaurT_TankA|bluedog_CentaurT_TankB|bluedog_CentaurT_TankC|bluedog_CentaurT_TankD|bluedog_Centaur_Kickstage|bluedog_DeltaIV_s1_lowerTank|bluedog_DeltaIV_s1_upperTank|bluedog_DCSS_Tank|bluedog_DeltaIV_DCSS_5m|bluedog_DeltaK_Stage|bluedog_Juno4_FuelTank_1|bluedog_Juno4_FuelTank_2|bluedog_Jupiter_FuelTank|bluedog_CELV_SustainerTank|bluedog_LDC_S1_Tank1|bluedog_LDC_S1_Tank2|bluedog_LDC_S2_Tank1|bluedog_LDC_S2_Tank2|bluedog_MOL_Propellant|bluedog_Saturn_LRB_Tank|bluedog_Saturn_S1C_Tank|bluedog_Saturn_S1E_Tank|bluedog_Saturn_S1_Tanks|bluedog_Saturn_S2_Tank|bluedog_Saturn_S4B_Tank|bluedog_Saturn_S4F_Tank|bluedog_Saturn_S4_AdapterTank|bluedog_Saturn_S4_Tank|bluedog_DeltaE_Tank|bluedog_DeltaIII_AdapterTank|bluedog_HOSS_Tank|bluedog_Thor_1p25mAdapter_Long|bluedog_Thor_LowerTank_1|bluedog_Thor_MediumExtensionTank|bluedog_Thor_UpperTank_1|bluedog_Titan1_S2_Tank|bluedog_Titan_S1_LowerTank|bluedog_Titan_S1_UpperTank|bluedog_Titan_S2_Tank|bluedog_Vega_Tank1|bluedog_Vega_Tank2|bluedog_Vega_ThirdStage_Tank]:HAS[@MODULE[ModuleEngines*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @PROPELLANT[LiquidFuel]
        {
            @name = Kerosene
            @ratio = 0.37694087
            %DrawGauge = True
        }
        @PROPELLANT[Oxidizer]
        {
            @name = LqdOxygen
            @ratio = 0.62305913
        }
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
            @ratio = 1.0
            %DrawGauge = True
        }
        @PROPELLANT[SolidFuel]
        {
            @name = HTPB
            @ratio = 1.0
            %DrawGauge = True
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
}

// Explicit fallback only. These retained liquid RCS modules have no usable
// per-part historical mapping in either local RO reference tree. This patch
// deliberately does not create or remove ModuleEngineConfigs, so mixed
// RCS/main-engine parts cannot lose their calibrated main-engine MECs.
@PART[bluedog_Centaur_Kickstage|bluedog_DCSS_Tank|bluedog_DeltaIV_DCSS_5m|bluedog_DeltaK_Stage|bluedog_Juno4_FuelTank_2|bluedog_DeltaE_Tank|bluedog_Vega_Tank1|bluedog_Vega_ThirdStage_Tank]:HAS[@MODULE[ModuleRCS*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleRCS*]
    {
        !resourceName = NULL
        !PROPELLANT,*
        {
        }
        PROPELLANT
        {
            name = Hydrazine
            ratio = 1.0
            DrawGauge = True
        }
        !atmosphereCurve
        {
        }
        atmosphereCurve
        {
            key = 0 230
            key = 1 95
        }
    }
    @RESOURCE[MonoPropellant]
    {
        @name = Hydrazine
    }
}

// Named fallback for every other retained BDB solid engine. Their source cfgs
// are enumerated in the audit; this block is intentionally exact, not wildcard.
@PART[bluedog_Saturn_S4_AdapterTank]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @RESOURCE[SolidFuel]
    {
        @name = HTPB
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = HTPB-SourceFallback
        origMass = #$/mass$
        CONFIG
        {
            name = HTPB-SourceFallback
            minThrust = #$/MODULE[ModuleEnginesRF]/minThrust$
            maxThrust = #$/MODULE[ModuleEnginesRF]/maxThrust$
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = HTPB
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,0$
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,1$
            }
        }
    }
}

