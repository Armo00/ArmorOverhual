// Modified 2026-09-01
// RealFuels tank migration for retained BDB hardware.
// Values are taken from the BDB RO reference, with legacy RO-only tank names
// mapped to tank definitions available in this installation:
// Tank-Iso*/Tank-Sep*/SM-* -> Default or ServiceModule as appropriate.

// BDB's own B9 fuel switches are disabled when RealFuels is installed.  Keep
// stock-resource leftovers from becoming unusable by converting them locally.
@PART[bluedog_*]:HAS[@RESOURCE[LiquidFuel],@RESOURCE[Oxidizer],!MODULE[ModuleFuelTanks],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	MODULE
	{
		name = ModuleFuelTanks
		type = Default
		volume = 0
		@volume = #$/RESOURCE[LiquidFuel]/maxAmount$
		@volume += #$/RESOURCE[Oxidizer]/maxAmount$
		@volume *= 5
		basemass = -1
	}
	!RESOURCE[LiquidFuel],* 
	{
	}
	!RESOURCE[Oxidizer],* 
	{
	}
}

@PART[bluedog_*]:HAS[@RESOURCE[LqdHydrogen],@RESOURCE[Oxidizer],!MODULE[ModuleFuelTanks],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	MODULE
	{
		name = ModuleFuelTanks
		type = BalloonCryo
		volume = 0
		@volume = #$/RESOURCE[LqdHydrogen]/maxAmount$
		@volume += #$/RESOURCE[Oxidizer]/maxAmount$
		@volume *= 5
		basemass = -1
	}
	!RESOURCE[LqdHydrogen],* 
	{
	}
	!RESOURCE[Oxidizer],* 
	{
	}
}

@PART[bluedog_*]:HAS[@RESOURCE[MonoPropellant],!MODULE[ModuleFuelTanks],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 0
		@volume = #$/RESOURCE[MonoPropellant]/maxAmount$
		@volume *= 5
		basemass = -1
	}
	!RESOURCE[MonoPropellant],* 
	{
	}
}

