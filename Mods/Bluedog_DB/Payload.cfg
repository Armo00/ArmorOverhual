}

// Named fallback for every other retained BDB solid engine. Their source cfgs
// are enumerated in the audit; this block is intentionally exact, not wildcard.
@PART[bluedog_saturn_h03_SLA_panel|bluedog_Saturn_S4B_SLA_Panel]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
