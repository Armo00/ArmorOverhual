@PART[bluedog_Titan3_CommercialPLF_SAF|bluedog_Titan3_CommercialPLF]:HAS[@MODULE[ModuleRCS*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleRCS*]
    {
        !resourceName = NULL
        !PROPELLANT,*
        {
        }
        PROPELLANT
        {
            name = Hydrazine
            ratio = 1.0
            DrawGauge = True
        }
        !atmosphereCurve
        {
        }
        atmosphereCurve
        {
            key = 0 230
            key = 1 95
        }
    }
    @RESOURCE[MonoPropellant]
    {
        @name = Hydrazine
