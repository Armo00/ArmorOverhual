// Opt these BDB parts out of AO global runtime tank-volume arithmetic.
@PART[bluedog_Apollo_Block1_Nose|bluedog_LittleJoe2_Fin|bluedog_DeltaIV_noseCone|bluedog_CELV_Fin|bluedog_LDC_NoseCone|bluedog_Saturn_AJ260_Nose|bluedog_Saturn_S1B_Fin|bluedog_Saturn_S1C_Airbrake|bluedog_Saturn_S1C_Fin|bluedog_Saturn_S1_LargeFin|bluedog_Saturn_S1_SmallFin|bluedog_Saturn_S2_Fin|bluedog_MORL_aeroCone|bluedog_Minuteman_Nose|bluedog_Pegasus_Fin|bluedog_Pegasus_Strongback|bluedog_Scout_Algol_Fin|bluedog_Delta_Fin|bluedog_Thor_CZFin|bluedog_1875_NoseNoSep|bluedog_1875_NoseSep|bluedog_SOLTAN_NoseCone]:NEEDS[Bluedog_DB,RealFuels]:FIRST
{
    %aoBDBExplicitTank = true
}
// BDB Aerodynamics: all existing adjustments for this part type.
// Internal patch order preserves the previous configuration sequence.
// Tank volumes are fixed per part; other parameter values retain the prior layout.

// Bluedog Design Bureau real-size baseline.
// BDB's native design scale is normally 62.5% of the referenced hardware;
// RO's BDB patches therefore use 1.6 except where the reference gives a
// part-specific physical scale below.  Deleted programme families are
// explicitly excluded even if a shared BDB directory still contains a
// historical compatibility part.
@PART[bluedog_Apollo_Block1_Nose|bluedog_LittleJoe2_Fin|bluedog_DeltaIV_noseCone|bluedog_CELV_Fin|bluedog_LDC_NoseCone|bluedog_Saturn_AJ260_Nose|bluedog_Saturn_S1B_Fin|bluedog_Saturn_S1C_Airbrake|bluedog_Saturn_S1C_Fin|bluedog_Saturn_S1_LargeFin|bluedog_Saturn_S1_SmallFin|bluedog_Saturn_S2_Fin|bluedog_MORL_aeroCone|bluedog_Minuteman_Nose|bluedog_Pegasus_Fin|bluedog_Pegasus_Strongback|bluedog_Scout_Algol_Fin|bluedog_Delta_Fin|bluedog_Thor_CZFin|bluedog_1875_NoseNoSep|bluedog_1875_NoseSep|bluedog_SOLTAN_NoseCone]:HAS[#rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

// KSP treats an omitted rescaleFactor as 1.0.
@PART[bluedog_Apollo_Block1_Nose|bluedog_LittleJoe2_Fin|bluedog_DeltaIV_noseCone|bluedog_CELV_Fin|bluedog_LDC_NoseCone|bluedog_Saturn_AJ260_Nose|bluedog_Saturn_S1B_Fin|bluedog_Saturn_S1C_Airbrake|bluedog_Saturn_S1C_Fin|bluedog_Saturn_S1_LargeFin|bluedog_Saturn_S1_SmallFin|bluedog_Saturn_S2_Fin|bluedog_MORL_aeroCone|bluedog_Minuteman_Nose|bluedog_Pegasus_Fin|bluedog_Pegasus_Strongback|bluedog_Scout_Algol_Fin|bluedog_Delta_Fin|bluedog_Thor_CZFin|bluedog_1875_NoseNoSep|bluedog_1875_NoseSep|bluedog_SOLTAN_NoseCone]:HAS[~rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

// Apollo family and associated lunar hardware — 5/8 KSP scale in BDB.
@PART[bluedog_Apollo_Block1_Nose|bluedog_LittleJoe2_Fin]:NEEDS[Bluedog_DB]:FINAL
{
	%rescaleFactor = 1.5646
}

// Saturn I is modelled at a slightly different BDB scale from Saturn V.
@PART[bluedog_Saturn_S1B_Fin|bluedog_Saturn_S1_LargeFin|bluedog_Saturn_S1_SmallFin]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.57645
}

// Launch Development Carrier, IUS/TOS, Scout, Pegasus/Minotaur/Taurus and Vanguard exceptions.
@PART[bluedog_LDC_NoseCone]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.463
}

// Do not use bluedog_Pegasus_* here: BDB uses the prefix both for the
// Pegasus launcher and for the unrelated Saturn-launched Pegasus satellites.
@PART[bluedog_Pegasus_Fin|bluedog_Pegasus_Strongback]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.36
}


@PART[bluedog_Minuteman_Nose]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.336
}


@PART[bluedog_Scout_Algol_Fin]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.354
}

// Saturn-derived hardware, Skylab and MORL use the 1.5529 reference scale.
@PART[bluedog_Saturn_AJ260_Nose|bluedog_MORL_aeroCone]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.5529
}

// RealFuels tank migration for retained BDB hardware.
// Values are taken from the BDB RO reference, with legacy RO-only tank names
// mapped to tank definitions available in this installation:
// Tank-Iso*/Tank-Sep*/SM-* -> Default or ServiceModule as appropriate.

// BDB's own B9 fuel switches are disabled when RealFuels is installed.  Keep
// stock-resource leftovers from becoming unusable by converting them locally.


// RF conversion by historical propellant family; source thrust and Isp are retained.
@PART[bluedog_Apollo_Block1_Nose|bluedog_LittleJoe2_Fin|bluedog_DeltaIV_noseCone|bluedog_CELV_Fin|bluedog_LDC_NoseCone|bluedog_Saturn_AJ260_Nose|bluedog_Saturn_S1B_Fin|bluedog_Saturn_S1C_Airbrake|bluedog_Saturn_S1C_Fin|bluedog_Saturn_S1_LargeFin|bluedog_Saturn_S1_SmallFin|bluedog_Saturn_S2_Fin|bluedog_MORL_aeroCone|bluedog_Minuteman_Nose|bluedog_Pegasus_Fin|bluedog_Pegasus_Strongback|bluedog_Scout_Algol_Fin|bluedog_Delta_Fin|bluedog_Thor_CZFin|bluedog_1875_NoseNoSep|bluedog_1875_NoseSep|bluedog_SOLTAN_NoseCone]:HAS[@MODULE[ModuleEngines*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @PROPELLANT[LiquidFuel]
        {
            @name = Kerosene
            @ratio = 0.37694087
            %DrawGauge = True
        }
        @PROPELLANT[Oxidizer]
        {
            @name = LqdOxygen
            @ratio = 0.62305913
        }
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
            @ratio = 1.0
            %DrawGauge = True
        }
        @PROPELLANT[SolidFuel]
        {
            @name = HTPB
            @ratio = 1.0
            %DrawGauge = True
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
}

// Named fallback for every other retained BDB solid engine. Their source cfgs
// are enumerated in the audit; this block is intentionally exact, not wildcard.
@PART[bluedog_DeltaIV_noseCone|bluedog_1875_NoseSep]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @RESOURCE[SolidFuel]
    {
        @name = HTPB
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = HTPB-SourceFallback
        origMass = #$/mass$
        CONFIG
        {
            name = HTPB-SourceFallback
            minThrust = #$/MODULE[ModuleEnginesRF]/minThrust$
            maxThrust = #$/MODULE[ModuleEnginesRF]/maxThrust$
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = HTPB
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,0$
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,1$
            }
        }
    }
}

// Preserve BDB's B9 geometry, node and transform selectors after AO converts
// the primary engine to ModuleEnginesRF.  Only remove the nested stock-engine
// performance modifiers: RF/MEC is authoritative for thrust, Isp and propellant.
// This deliberately keeps the B9 modules themselves so LinkB9PSModule can drive
// the physical model selected by an RF configuration.
@PART[bluedog_Apollo_Block1_Nose|bluedog_LittleJoe2_Fin|bluedog_DeltaIV_noseCone|bluedog_CELV_Fin|bluedog_LDC_NoseCone|bluedog_Saturn_AJ260_Nose|bluedog_Saturn_S1B_Fin|bluedog_Saturn_S1C_Airbrake|bluedog_Saturn_S1C_Fin|bluedog_Saturn_S1_LargeFin|bluedog_Saturn_S1_SmallFin|bluedog_Saturn_S2_Fin|bluedog_MORL_aeroCone|bluedog_Minuteman_Nose|bluedog_Pegasus_Fin|bluedog_Pegasus_Strongback|bluedog_Scout_Algol_Fin|bluedog_Delta_Fin|bluedog_Thor_CZFin|bluedog_1875_NoseNoSep|bluedog_1875_NoseSep|bluedog_SOLTAN_NoseCone]:HAS[@MODULE[ModuleEnginesRF],@MODULE[ModuleB9PartSwitch]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleB9PartSwitch],*
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesFX]]],*
            {
            }
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesRF]]],*
            {
            }
        }
    }
}

