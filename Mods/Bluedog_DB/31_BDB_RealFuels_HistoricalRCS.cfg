{
    !RESOURCE[MonoPropellant]
    {
    }
    RESOURCE
    {
        name = Nitrogen
        amount = 1200
        maxAmount = 1200
    }
    @MODULE[ModuleRCS*]
    {
        @thrusterPower = 0.005
        !resourceName = NULL
        !PROPELLANT,*
        {
        }
        PROPELLANT
        {
            name = Nitrogen
            ratio = 1.0
            DrawGauge = True
        }
        !atmosphereCurve
        {
        }
        atmosphereCurve
        {
            key = 0 51
            key = 1 24
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        configuration = Mk8-N2-Spin
        origMass = 0.015
        CONFIG
        {
            name = Mk8-N2-Spin
            thrusterPower = 0.005
            pressureFed = True
            ignitions = 0
            PROPELLANT
            {
                name = Nitrogen
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 51
                key = 1 24
            }
        }
    }
}

