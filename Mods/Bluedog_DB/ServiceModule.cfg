// Modified 2026-09-06

// Opt these BDB parts out of AO global runtime tank-volume arithmetic.
@PART[bluedog_Apollo_Block2_SM|bluedog_Apollo_Block3_SM|bluedog_Hexagon_ServiceModule|bluedog_MOL_EquipmentSection]:NEEDS[Bluedog_DB,RealFuels]:FIRST
{
    %aoBDBExplicitTank = true
}
// BDB ServiceModule: all existing adjustments for this part type.
// Internal patch order preserves the previous configuration sequence.
// Tank volumes are fixed per part; other parameter values retain the prior layout.

// Bluedog Design Bureau real-size baseline.
// BDB's native design scale is normally 62.5% of the referenced hardware;
// RO's BDB patches therefore use 1.6 except where the reference gives a
// part-specific physical scale below.  Deleted programme families are
// explicitly excluded even if a shared BDB directory still contains a
// historical compatibility part.
@PART[bluedog_Apollo_Block2_SM|bluedog_Apollo_Block3_SM|bluedog_Hexagon_ServiceModule|bluedog_MOL_EquipmentSection]:HAS[#rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

// KSP treats an omitted rescaleFactor as 1.0.
@PART[bluedog_Apollo_Block2_SM|bluedog_Apollo_Block3_SM|bluedog_Hexagon_ServiceModule|bluedog_MOL_EquipmentSection]:HAS[~rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
{
    %rescaleFactor = 1.6
}

// Apollo family and associated lunar hardware — 5/8 KSP scale in BDB.
@PART[bluedog_Apollo_Block2_SM|bluedog_Apollo_Block3_SM]:NEEDS[Bluedog_DB]:FINAL
{
	%rescaleFactor = 1.5646
}

// RealFuels tank migration for retained BDB hardware.
// Values are taken from the BDB RO reference, with legacy RO-only tank names
// mapped to tank definitions available in this installation:
// Tank-Iso*/Tank-Sep*/SM-* -> Default or ServiceModule as appropriate.

// BDB's own B9 fuel switches are disabled when RealFuels is installed.  Keep
// stock-resource leftovers from becoming unusable by converting them locally.
// bluedog_Apollo_Block2_SM: preserve legacy resource cleanup; calibrated tank follows below.
@PART[bluedog_Apollo_Block2_SM]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!RESOURCE[LiquidFuel],*
	{
	}
	!RESOURCE[Oxidizer],*
	{
	}
}

// bluedog_Apollo_Block3_SM: preserve legacy resource cleanup; calibrated tank follows below.
@PART[bluedog_Apollo_Block3_SM]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!RESOURCE[LiquidFuel],*
	{
	}
	!RESOURCE[Oxidizer],*
	{
	}
}

// bluedog_Hexagon_ServiceModule: offline fixed volume 1500 L; see FixedTankVolumes.md.
@PART[bluedog_Hexagon_ServiceModule]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!RESOURCE[MonoPropellant],*
	{
	}
	!MODULE[ModuleFuelTanks],*
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		volume = 1500
		type = ServiceModule
	}
}

// bluedog_MOL_EquipmentSection: offline fixed volume 1500 L; see FixedTankVolumes.md.
@PART[bluedog_MOL_EquipmentSection]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!RESOURCE[MonoPropellant],*
	{
	}
	!MODULE[ModuleFuelTanks],*
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		volume = 1500
		type = ServiceModule
	}
}


// Apollo / lunar programme service volumes.
@PART[bluedog_Apollo_Block2_SM]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!MODULE[ModuleFuelTanks],* 
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 22535
		basemass = -1
	}
}


@PART[bluedog_Apollo_Block3_SM]:NEEDS[Bluedog_DB,RealFuels]:FINAL
{
	!MODULE[ModuleFuelTanks],* 
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 3000
		basemass = -1
	}
}

// RF conversion by historical propellant family; source thrust and Isp are retained.
@PART[bluedog_Apollo_Block2_SM|bluedog_Apollo_Block3_SM|bluedog_Hexagon_ServiceModule|bluedog_MOL_EquipmentSection]:HAS[@MODULE[ModuleEngines*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @PROPELLANT[LiquidFuel]
        {
            @name = Kerosene
            @ratio = 0.37694087
            %DrawGauge = True
        }
        @PROPELLANT[Oxidizer]
        {
            @name = LqdOxygen
            @ratio = 0.62305913
        }
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
            @ratio = 1.0
            %DrawGauge = True
        }
        @PROPELLANT[SolidFuel]
        {
            @name = HTPB
            @ratio = 1.0
            %DrawGauge = True
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
}

// Preserve BDB's B9 geometry, node and transform selectors after AO converts
// the primary engine to ModuleEnginesRF.  Only remove the nested stock-engine
// performance modifiers: RF/MEC is authoritative for thrust, Isp and propellant.
// This deliberately keeps the B9 modules themselves so LinkB9PSModule can drive
// the physical model selected by an RF configuration.
@PART[bluedog_Apollo_Block2_SM|bluedog_Apollo_Block3_SM|bluedog_Hexagon_ServiceModule|bluedog_MOL_EquipmentSection]:HAS[@MODULE[ModuleEnginesRF],@MODULE[ModuleB9PartSwitch]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    @MODULE[ModuleB9PartSwitch],*
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesFX]]],*
            {
            }
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesRF]]],*
            {
            }
        }
    }
}

// Normalize BDB's own diameter-based TweakScale modules after RealScale, then
// add AO's percentage-based free profile to uncovered RF propulsion/tank and
// ordinary structural/coupling hardware. Real-size geometry remains 100%.
@PART[bluedog_Apollo_Block2_SM|bluedog_Apollo_Block3_SM|bluedog_Hexagon_ServiceModule|bluedog_MOL_EquipmentSection]:HAS[@MODULE[TweakScale],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,TweakScale]:FINAL
{
    @MODULE[TweakScale],*
    {
        @type = free
        @defaultScale = 100
    }
}


@PART[bluedog_Apollo_Block2_SM|bluedog_Apollo_Block3_SM|bluedog_Hexagon_ServiceModule|bluedog_MOL_EquipmentSection]:HAS[@MODULE[ModuleEnginesRF],!MODULE[TweakScale],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,TweakScale]:FINAL
{
    MODULE
    {
        name = TweakScale
        type = free
        defaultScale = 100
    }
}


