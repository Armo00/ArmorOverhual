// Keep GEM nozzle/gimbal variants synchronized with MEC selection without the
// RealismOverhaul helper pass.
@PART[bluedog_Delta_GEM40]:NEEDS[Bluedog_DB,RealFuels,SolverEngines,B9PartSwitch]:FINAL
{
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]],*
    {
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = meshSwitchNozzle
        switcherDescription = Nozzle Size
        switcherDescriptionPlural = Nozzle Sizes
        affectDragCubes = True
        affectFARVoxels = True
        SUBTYPE
        {
            name = Ground
            transform = GroundLitBell
        }
        SUBTYPE
        {
            name = Air
            transform = AirLitBell
        }
    }
    @MODULE[ModuleEngineConfigs]:HAS[#type[ModuleEngines]]
    {
        @CONFIG[GEM-40/Ground]
        {
            %LinkB9PSModule[meshSwitchNozzle]
            {
                subtype = Ground
            }
        }
        @CONFIG[GEM-40/Air]
        {
            %LinkB9PSModule[meshSwitchNozzle]
            {
                subtype = Air
            }
        }
    }
}

@PART[bluedog_Delta_GEM40_Inline]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    MODULE
    {
        name = ModuleGimbal
        gimbalResponseSpeed = 15
        useGimbalResponseSpeed = True
        gimbalTransformName = gimbalTransform
        gimbalRange = 6
    }
    @MODULE[ModuleEngineConfigs]:HAS[#type[ModuleEngines]]
    {
        @configuration = GEM-40VN/Ground
        @CONFIG[GEM-40/Ground]
        {
            @name = GEM-40VN/Ground
            %gimbalRange = 6
        }
        @CONFIG[GEM-40/Air]
        {
            @name = GEM-40VN/Air
            %gimbalRange = 6
        }
    }
}

