// Apollo/LM RCS fuel selection; keep original performance and default fuel.
// NF-Spacecraft MEC pattern; RF refreshes every RCS module on this part.
// Fuel-only CONFIGs preserve each nozzle set's existing thrust and Isp.
// moduleIndex/engineID prevent configuration-cache collisions with main engines.
@PART[bluedog_LM_Truck_RCS]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleRCS*],*
    {
        !resourceName = NULL
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS
        moduleIndex = 0
        engineID = AO-RCS-0
        configuration = Hydrazine
        origMass = -1
        techLevel = -1
        origTechLevel = -1
        CONFIG
        {
            name = Hydrazine
            PROPELLANT
            {
                name = Hydrazine
                ratio = 1
                DrawGauge = True
            }
        }
        CONFIG
        {
            name = MMH/NTO
            PROPELLANT
            {
                name = MMH
                ratio = 0.499
                DrawGauge = True
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.501
            }
        }
        CONFIG
        {
            name = UDMH/NTO
            PROPELLANT
            {
                name = UDMH
                ratio = 0.4977
                DrawGauge = True
            }
            PROPELLANT
