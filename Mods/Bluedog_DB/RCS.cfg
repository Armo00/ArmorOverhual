// BDB RCS: all existing adjustments for this part type.
// Internal patch order preserves the previous configuration sequence.
// Tank volumes are fixed per part; other parameter values retain the prior layout.

// Bluedog Design Bureau real-size baseline.
// BDB's native design scale is normally 62.5% of the referenced hardware;
// RO's BDB patches therefore use 1.6 except where the reference gives a
// part-specific physical scale below.  Deleted programme families are
// explicitly excluded even if a shared BDB directory still contains a
// historical compatibility part.
@PART[bluedog_Apollo_RCS_1X|bluedog_Apollo_RCS_2X|bluedog_Apollo_RCS_3X|bluedog_Apollo_RCS_4X|bluedog_LM_Truck_RCS|bluedog_Centaur_ARCM|bluedog_Hexagon_LifeboatRCS|bluedog_Hexagon_MainRCS|bluedog_MOL_RCS|bluedog_Saturn_S4B_APS_200|bluedog_Saturn_S4B_APS_500|bluedog_MORL_resistojet_RCS|bluedog_Skylab_ACS|bluedog_Burner2|bluedog_Titan23G_ACS|bluedog_Titan_Transtage_RCS]:HAS[#rescaleFactor[*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB]:FINAL
