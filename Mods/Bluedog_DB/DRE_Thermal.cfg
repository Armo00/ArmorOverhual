// Modified 2026-09-07
// Dedicated BDB separation motors marketed as Separatrons.

@PART[bluedog_1875_RadialSep|bluedog_1875_NoseSep|bluedog_Saturn_AJ260_Sepratron]:NEEDS[Bluedog_DB]:FINAL
{
    %maxTemp = 2100
    %skinMaxTemp = 2700

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1890
        %skinMaxOperationalTemp = 2430
    }
}
