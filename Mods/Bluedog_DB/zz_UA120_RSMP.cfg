// RSMP compatibility for BDB's merged UA120 (the old numbered PARTs are separate).
// Prepare RSMP's smoke-only RealPlume template before its AFTER[zRealPlume] pass.
@PART[bluedog_UA120]:NEEDS[Bluedog_DB,RSMP,Waterfall,SmokeScreen]:AFTER[RSMP]
{
    !PLUME[Solid-Lower],* {}
    !PLUME[solid_abort],* {}
    !PLUME[katniss-wfss-solid-lower],* {}
    PLUME
    {
        name = katniss-wfss-solid-lower
        transformName = fxTransform2
        localRotation = 0,0,0
        localPosition = 0,0,0
        localScale = 2
        smokePosition = 0,0,0
        plumeIdentifier = AOUA120Smoke
        energy = 1
    }
}

// FINAL runs after AO's RF conversion and all RealPlume effect generation.
@PART[bluedog_UA120]:NEEDS[Bluedog_DB,RSMP,Waterfall]:FINAL
{
    !MODULE[ModuleWaterfallFX]:HAS[#moduleID[UA120XFX]],* {}
    !MODULE[ModuleWaterfallFX]:HAS[#moduleID[AOUA120AbortFX]],* {}

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = UA120XFX
        engineID = S1SRB
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = S1SRB
        }
        CONTROLLER
        {
            name = Random
            linkedTo = random
            noiseType = perlin
            scale = 0.5
            minimum = -0.5
            speed = 10
            seed = 40
        }
        CONTROLLER
        {
            name = Burnout
            linkedTo = engineEvent
            engineID = S1SRB
            eventName = flameout
            eventDuration = 600
            eventCurve
            {
                key = 0 0
                key = 0.1 1
                key = 600 0.2
            }
        }
        TEMPLATE
        {
            templateName = srb-waterfall
            overrideParentTransform = thrustTransform2
            position = 0,0,1.3
            rotation = 0,0,0
            scale = 0.85,0.85,1.6
        }
        TEMPLATE
        {
            templateName = lemon-SRB-core
            overrideParentTransform = thrustTransform2
            position = 0,0,1.37
            rotation = 0,0,0
            scale = 1,1,0
        }
    }

    // The two top vent transforms live in the shared UA120Transforms model.
    // Do not attach to the eight inactive body models' old abortTransform nodes.
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = AOUA120AbortFX
        engineID = S1SRB_Abort
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = S1SRB_Abort
        }
        TEMPLATE
        {
            templateName = lemon-SRB-core
            overrideParentTransform = fxAbortTransform2
            position = 0,0,0
            rotation = 0,0,0
            scale = 0.2,0.2,0.35
        }
    }

    // Replace RSMP's dangling old Inline modifier, and explicitly restore Radial.
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchType]]
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleWaterfallFX],#moduleID[UA120XFX]]],* {}
        }
        @SUBTYPE[Radial]
        {
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = UA120XFX
                }
                DATA
                {
                    TEMPLATE
                    {
                        templateName = srb-waterfall
                        overrideParentTransform = thrustTransform2
                        position = 0,0,1.3
                        rotation = 0,0,0
                        scale = 0.85,0.85,1.6
                    }
                    TEMPLATE
                    {
                        templateName = lemon-SRB-core
                        overrideParentTransform = thrustTransform2
                        position = 0,0,1.37
                        rotation = 0,0,0
                        scale = 1,1,0
                    }
                }
            }
        }
        @SUBTYPE[Inline]
        {
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = UA120XFX
                }
                DATA
                {
                    TEMPLATE
                    {
                        templateName = srb-waterfall
                        overrideParentTransform = thrustTransform2
                        position = 0,0,1.3
                        rotation = 0,0,0
                        scale = 0.83,0.83,1.6
                    }
                    TEMPLATE
                    {
                        templateName = lemon-SRB-core
                        overrideParentTransform = thrustTransform2
                        position = 0,0,1.37
                        rotation = 0,0,0
                        scale = 1,1,0
                    }
                }
            }
        }
    }

    @MODULE[ModuleEngines*]:HAS[#engineID[S1SRB]]
    {
        %powerEffectName = AOUA120Main
        !runningEffectName = DELETE
    }
    @MODULE[ModuleEngines*]:HAS[#engineID[S1SRB_Abort]]
    {
        %powerEffectName = AOUA120Abort
        !runningEffectName = DELETE
    }
    @MODULE[ModuleEngineConfigs]:HAS[#engineID[S1SRB]]
    {
        @CONFIG,*
        {
            %powerEffectName = AOUA120Main
            !runningEffectName = DELETE
        }
    }

    %EFFECTS
    {
        !running_solid {}
        !running_abort {}
        !Solid-Lower {}
        !solid_abort {}
        @flameout
        {
            !PREFAB_PARTICLE,* {}
        }
        %AOUA120Main
        {
            !AUDIO,* {}
            !MODEL_MULTI_SHURIKEN_PERSIST,* {}
            AUDIO
            {
                channel = Ship
                clip = RSMP/Sounds/srb-loop-3
                volume = 0 0
                volume = 1 1
                pitch = 0 0.8
                pitch = 1 1
                loop = true
            }
        }
        %AOUA120Abort
        {
            !AUDIO,* {}
            !MODEL_MULTI_SHURIKEN_PERSIST,* {}
            AUDIO
            {
                channel = Ship
                clip = RSMP/Sounds/srb-loop-3
                volume = 0 0
                volume = 1 1
                pitch = 0 0.8
                pitch = 1 1
                loop = true
            }
        }
    }
}

// Reuse the installed RSMP smoke curves, then remove the temporary generator node.
// These are particle copies, not a second full RealPlume flame.
@PART[bluedog_UA120]:HAS[@EFFECTS:HAS[@katniss-wfss-solid-lower]]:NEEDS[Bluedog_DB,RSMP,Waterfall,SmokeScreen]:FINAL
{
    @EFFECTS
    {
        @AOUA120Main
        {
            #/EFFECTS/katniss-wfss-solid-lower/MODEL_MULTI_SHURIKEN_PERSIST
            {}
            @MODEL_MULTI_SHURIKEN_PERSIST
            {
                @name = AOUA120Main-smoke
            }
        }
        @AOUA120Abort
        {
            #/EFFECTS/katniss-wfss-solid-lower/MODEL_MULTI_SHURIKEN_PERSIST
            {}
            @MODEL_MULTI_SHURIKEN_PERSIST
            {
                @name = AOUA120Abort-smoke
                @transformName = fxAbortTransform2
                @fixedScale = 0.4
            }
        }
        !katniss-wfss-solid-lower {}
    }
    !PLUME,* {}
}
