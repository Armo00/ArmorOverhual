// Historical liquid RCS, retro and small-service engines. Values are taken
// from the named local BDB-RO patches; this AO file uses only RF/MEC modules.

// Mk8 capsule spin jets. Source: Hexagon/RO_Hexagon.cfg.
@PART[bluedog_Hexagon_Mk8_Retro]:HAS[@MODULE[ModuleRCS*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    !RESOURCE[MonoPropellant]
    {
    }
    RESOURCE
    {
        name = Nitrogen
        amount = 1200
        maxAmount = 1200
    }
    @MODULE[ModuleRCS*]
    {
        @thrusterPower = 0.005
        !resourceName = NULL
        !PROPELLANT,*
        {
        }
        PROPELLANT
        {
            name = Nitrogen
            ratio = 1.0
            DrawGauge = True
        }
        !atmosphereCurve
        {
        }
        atmosphereCurve
        {
            key = 0 51
            key = 1 24
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        configuration = Mk8-N2-Spin
        origMass = 0.015
        CONFIG
        {
            name = Mk8-N2-Spin
            thrusterPower = 0.005
            pressureFed = True
            ignitions = 0
            PROPELLANT
            {
                name = Nitrogen
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 51
                key = 1 24
            }
        }
    }
}

// Hexagon Mk8 recovery retro. CTPB is supplied by AO file 01 using the same
// HTPB-derived definition that RealismOverhaul normally creates.
// The Nitrogen spin RCS MEC in file 31 remains a separate ModuleRCS config.
@PART[bluedog_Hexagon_Mk8_Retro]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]
    {
        @minThrust = 0
        @maxThrust = 7.22
        @PROPELLANT[HTPB]
        {
            @name = CTPB
        }
        @atmosphereCurve
        {
            @key,0 = 0 255
            @key,1 = 1 211
        }
    }
    @RESOURCE[SolidFuel]
    {
        @name = CTPB
        @amount = 14.3
        @maxAmount = 14.3
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Hexagon-Retro
        origMass = 0.015
        CONFIG
        {
            name = Hexagon-Retro
            minThrust = 0
            maxThrust = 7.22
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = CTPB
                ratio = 1.0
                DrawGauge = True
            }
            curveResource = CTPB
            atmosphereCurve
            {
                key = 0 255
                key = 1 211
            }
        }
    }
}

