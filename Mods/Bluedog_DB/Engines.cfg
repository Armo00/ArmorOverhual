// This base is retained solely for the separately calibrated X-405/X-405H
// patches below. All other retained kerolox engines have per-model MECs.
@PART[bluedog_Vega_GE405H]:HAS[@MODULE[ModuleEnginesRF]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Kerolox
        origMass = #$/mass$
        CONFIG
        {
            name = Kerolox
            minThrust = #$/MODULE[ModuleEnginesRF]/minThrust$
            maxThrust = #$/MODULE[ModuleEnginesRF]/maxThrust$
            heatProduction = 100
            massMult = 1.0
            ullage = True
            pressureFed = False
            ignitions = 1
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.5
            }
            PROPELLANT
            {
                name = Kerosene
                ratio = 0.37694087
                DrawGauge = True
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.62305913
            }
            atmosphereCurve
            {
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,0$
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,1$
            }
        }
    }
}

