tage|bluedog_Minotaur_Interstage|bluedog_Minotaur1_S1_Interstage|bluedog_Minotaur1_S2_Interstage|bluedog_Pegasus_Decoupler|bluedog_Pegasus_Orion38_Interstage|bluedog_Taurus_S1_Interstage|bluedog_Taurus_S1_StructuralAdapter|bluedog_Taurus_UpperStageAdapter|bluedog_Delta_Interstage|bluedog_Thor_0p9375mAdapter|bluedog_Thor_0p9375mInterstage|bluedog_1875_RadialDecoupler|bluedog_Titan1_StructuralAdapter|bluedog_Titan2_S2_EngineInterstage|bluedog_IDCSP_Truss|bluedog_Vega_ThirdStage_Adapter]:HAS[@MODULE[ModuleEngines*],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @PROPELLANT[LiquidFuel]
        {
            @name = Kerosene
            @ratio = 0.37694087
            %DrawGauge = True
        }
        @PROPELLANT[Oxidizer]
        {
            @name = LqdOxygen
            @ratio = 0.62305913
        }
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
            @ratio = 1.0
            %DrawGauge = True
        }
        @PROPELLANT[SolidFuel]
        {
            @name = HTPB
            @ratio = 1.0
            %DrawGauge = True
        }
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
}

// Named fallback for every other retained BDB solid engine. Their source cfgs
// are enumerated in the audit; this block is intentionally exact, not wildcard.
@PART[bluedog_DeltaIV_heavyDecoupler|bluedog_SpinDecoupler_p3125m|bluedog_Spintable_0p625|bluedog_Spintable_0p9375|bluedog_Saturn_S1B_Interstage|bluedog_Saturn_S4B_AARDVTruss|bluedog_Saturn_S4B_CentaurTruss|bluedog_Saturn_S4B_Interstage]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB]]]:NEEDS[Bluedog_DB,RealFuels,SolverEngines]:FINAL
{
    @RESOURCE[SolidFuel]
    {
        @name = HTPB
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = HTPB-SourceFallback
        origMass = #$/mass$
        CONFIG
        {
            name = HTPB-SourceFallback
            minThrust = #$/MODULE[ModuleEnginesRF]/minThrust$
            maxThrust = #$/MODULE[ModuleEnginesRF]/maxThrust$
            heatProduction = 100
            massMult = 1.0
            ullage = False
            pressureFed = False
            ignitions = 1
            PROPELLANT
            {
                name = HTPB
                ratio = 1.0
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,0$
                key = #$/MODULE[ModuleEnginesRF]/atmosphereCurve/key,1$
            }
        }
    }
}

// Preserve BDB's B9 geometry, node and transform selectors after AO converts
// the primary engine to ModuleEnginesRF.  Only remove the nested stock-engine
// performance modifiers: RF/MEC is authoritative for thrust, Isp and propellant.
