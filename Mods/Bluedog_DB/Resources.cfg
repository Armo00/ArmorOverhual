// Modified 2026-09-06
// BDB Resources: all existing adjustments for this part type.
// Internal patch order preserves the previous configuration sequence.
// Tank volumes are fixed per part; other parameter values retain the prior layout.

// RealismOverhaul normally supplies CTPB by cloning RealFuels' HTPB
// definition. AO runs with RealFuels but without RO, so provide the same
// resource and solid-tank type locally for the BDB motors that require it.
+RESOURCE_DEFINITION[HTPB]:NEEDS[RealFuels,!RealismOverhaul]
{
    @name = CTPB
    @displayName = CTPB
}


+TANK_DEFINITION[HTPB]:NEEDS[RealFuels,!RealismOverhaul]
{
    @name = CTPB
    @TANK[HTPB]
    {
        @name = CTPB
    }
}


+RESOURCE_DEFINITION[HTPB]:NEEDS[RealFuels,!RealismOverhaul]
