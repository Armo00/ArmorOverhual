// Modified 2026-09-06
// FASA — Launch Clamps & Launch Towers (仅保留 Misc 发射夹具/塔 6 件 + 塔 IVA)

// 基础属性：地面设施 maxTemp 对齐项目惯例 (2800)
// 发射架统一价格 (原 25-2500 不等 → 统一 200)
@PART[FASAlaunchClamp125|FASAlaunchClamp25|FASAlaunchClampApollo|FASAlaunchClampAtlas|FASAlaunchTower|FASAUmbilicalTower]:NEEDS[FASA]:FINAL
{
    @maxTemp = 2800

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 2520
        %skinMaxOperationalTemp = 2520
    }
    @cost = 200
}

// Launch Tower 16 座: 挂接 FASA_IVA_Launch_Tower 内部舱 (原 mod 未接线)
@PART[FASAlaunchTower]:NEEDS[FASA]:FINAL
{
    @rescaleFactor = 1.5
    INTERNAL
    {
        name = FASA_IVA_Launch_Tower
    }
}

// TweakScale — 地面设施, type = free
@PART[FASAlaunchClamp125|FASAlaunchClamp25|FASAlaunchClampApollo|FASAlaunchClampAtlas|FASAlaunchTower|FASAUmbilicalTower]:NEEDS[FASA,TweakScale]:FINAL
{
    !MODULE[TweakScale] {}
    %MODULE[TweakScale]
    {
        %type = free
        %defaultScale = 100
    }
}
