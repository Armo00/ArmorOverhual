@PART[monoprop-tank-*]:Final
{
    @cost *=0.1
    @entryCost *= 5
    @maxTemp = 1473.15
    %skinMaxTemp = 2300

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1325.835
        %skinMaxOperationalTemp = 2070
    }
    @category = FuelTank
}

