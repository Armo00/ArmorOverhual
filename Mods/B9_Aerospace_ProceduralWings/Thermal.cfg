// B9 Procedural Wings: structural wing and control-surface thermal limits.

@PART[B9_Aero_Wing_Procedural_TypeA|B9_Aero_Wing_Procedural_TypeB|B9_Aero_Wing_Procedural_TypeC]:NEEDS[B9_Aerospace_ProceduralWings]:FINAL
{
    %maxTemp = 2400
    %skinMaxTemp = 3200

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 2160
        %skinMaxOperationalTemp = 2880
    }
}
