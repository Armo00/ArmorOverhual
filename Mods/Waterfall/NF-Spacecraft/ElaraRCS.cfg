// Modified 2026-10-24

// NF fallback for the 7.5m Elara. Keep plume size independent of model scaling.
@PART[command-375-biconic-1]:NEEDS[NearFutureSpacecraft,Waterfall]:FINAL
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[rcsFX]]
    {
        %useRelativeScaling = false

        @CONTROLLER[rcs]
        {
            %thrusterTransformName = thrustVector
        }

        @TEMPLATE
        {
            @templateName = template-nfs-rcs-small-1
            %overrideParentTransform = thrustVector
            %position = 0, 0, 0
            %rotation = 0, 0, 180
            %scale = 1.4, 2, 1.4
        }
    }
}

// Override BetterRCS's stock-ISP allocation and scaling after its named passes.
@PART[command-375-biconic-1]:NEEDS[NearFutureSpacecraft,Waterfall,z_BetterRCS]:FINAL
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[rcsFX]]
    {
        @TEMPLATE
        {
            @templateName = BetterRCS_Base
            // Initial nozzle-fit scale; verify plume length in atmosphere and vacuum.
            %scale = 1.4, 1.4, 1.4
        }
    }
}
