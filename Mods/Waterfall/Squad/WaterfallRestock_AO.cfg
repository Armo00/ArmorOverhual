// Modified 2026-09-06
// WaterfallRestock integration for Armor Overhaul.
// Keep WaterfallRestock's model-specific transforms and double only the
// longitudinal component of every engine plume template.

@PART[restock-engine-boar|restock-engine-caravel-1|restock-engine-cherenkov|restock-engine-375-corgi|restock-engine-galleon-1|restock-engine-125-pug|restock-engine-schnauzer-1|restock-engine-torch|restock-engine-panda-1|restock-engine-ursa-1|restock-engine-125-valiant|engineLargeSkipper_v2|ionEngine|LiquidEngineKE-1|liquidEngineMainsail_v2|liquidEngineMini_v2|liquidEngine2-2_v2|LiquidEngineRE-I2|LiquidEngineRE-J10|liquidEngine_v2|liquidEngine|LiquidEngineRK-7|LiquidEngineRV-1|liquidEngine2_v2|liquidEngine2|liquidEngine3_v2|Size2LFB_v2|Size2LFB|microEngine_v2|nuclearEngine|omsEngine|radialEngineMini_v2|Size3AdvancedEngine|Size3EngineCluster|smallRadialEngine_v2|SSME]:NEEDS[Waterfall,WaterfallRestock]:FINAL
{
    @MODULE[ModuleWaterfallFX],*
    {
        @TEMPLATE,*
        {
            @scale[2] *= 2
        }
    }
}

// AO configures both Poodle variants as hydrolox engines. Retain the
// WaterfallRestock transforms but replace its kerolox plume templates.
@PART[liquidEngine2-2_v2]:NEEDS[Waterfall,WaterfallRestock,ReStock]:FINAL
{
    @MODULE[ModuleWaterfallFX],*
    {
        @TEMPLATE,*
        {
            @templateName = waterfall-hydrolox-upper-1
        }
    }
}
