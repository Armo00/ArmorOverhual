// Modified 2026-08-05
// RE-M7 "Pila" — Hydrolox plume (waterfall-hydrolox-rs25-1 template)

@PART[S2Pila]:NEEDS[Waterfall]:FINAL
{
    !MODULE[ModuleWaterfallFX],*{}
    !EFFECTS,*{}

    @MODULE[ModuleEngines*]
    {
        @runningEffectName = running_hydrolox
    }

    EFFECTS
    {
        engage
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/KW/sound_liq4
                volume = 1.0
                pitch = 1.0
                loop = false
            }
        }
        disengage
        {
            AUDIO
            {
                channel = Ship
                clip = sound_vent_soft
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
        flameout
        {
            AUDIO
            {
                channel = Ship
                clip = sound_explosion_low
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
        running_hydrolox
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/EnsouSounds/Loop_Liquid_Medium_High_2
                volume = 0.0 0.0
                volume = 0.05 0.6
                volume = 1.0 1.0
                pitch = 0.0 0.7
                pitch = 1.0 1.0
                loop = true
            }
        }
    }

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = S2Pila-FX
        engineID = basicEngine

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1,1
        }

        TEMPLATE
        {
            templateName = waterfall-hydrolox-rs25-1
            overrideParentTransform = thrustTransform
            position = 0,0,0.3
            rotation = 0, 0, 0
            scale = 1.2, 1.2, 2.4
        }
    }
}
