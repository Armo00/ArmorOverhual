// Modified 2026-06-18
// RemoteTech for all SEP command parts — SEP_23 + SEP_24 + SEP_25
// Passive omni antenna on all crewed/probe core parts

@PART[SEP_24_SHIP_CORE|SEP_24_SHIP_CORE_EXP|SEP_25_SHIP_CORE|SEP_25_BOOSTER_CORE|SEP_24_HOPPY|SEP_24_SHIP_PROTO_BODY]:NEEDS[RemoteTech]:FINAL
{
    !MODULE[ModuleDataTransmitter] {}
    %MODULE[ModuleSPU] {}
    %MODULE[ModuleSPUPassive] {}
    %MODULE[ModuleRTAntennaPassive]
    {
        %OmniRange = 64000000
        %TRANSMITTER
        {
            %PacketInterval = 1
            %PacketSize = 1
            %PacketResourceCost = 0.025
        }
    }
}
