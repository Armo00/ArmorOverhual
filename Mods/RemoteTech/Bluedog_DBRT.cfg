// Modified 2026-09-01

// BDB already supplies detailed RemoteTech antenna/probe conversion before
// RemoteTech loads.  This late guard only removes a stock transmitter if that
// conversion has produced an RT antenna, preventing two radio implementations
// from remaining on the same retained BDB part.
@PART[bluedog_*]:HAS[@MODULE[ModuleRTAntenna],@MODULE[ModuleDataTransmitter],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RemoteTech,!SETIRebalance]:FINAL
{
    !MODULE[ModuleDataTransmitter],* 
    {
    }
}

@PART[bluedog_*]:HAS[@MODULE[ModuleRTAntennaPassive],@MODULE[ModuleDataTransmitter],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,RemoteTech,!SETIRebalance]:FINAL
{
    !MODULE[ModuleDataTransmitter],* 
    {
    }
}
