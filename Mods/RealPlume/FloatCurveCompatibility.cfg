// Modified 2026-09-06
// RealPlume passes per-part scalar energy/speed multipliers into generated
// SmokeScreen MODEL_MULTI_SHURIKEN_PERSIST nodes. KSP then also reads the
// template's curve values with the same field name and rejects the scalar
// entry as a malformed FloatCurve line. Remove only the rejected scalar first
// value; retain every two-column curve entry supplied by the plume template.

@PART[RAPIER|turboJet|turboFanEngine|JetEngine|miniJetEngine|turboFanSize2|JetEngineTrentXWB|JetEngineCFMLeap|omsEngine|ionEngine|LargeOMS|liquidEngineMiniTurbo|S2ServiceEngine|size0PulseJet|TinyOMS|VenLV909b|nfa-multimodal-25-1|nfa-multimodal-25-2|nfa-multimodal-125-1|nfa-turbojet-25-1|nfa-atomic-jet-25-1|nfa-atomic-multimode-25-1|nfa-vtol-0625-1|nfa-vtol-125-1|nfa-turbofan-25-1|nfa-turbofan-25-2|M2X_MATTOCK|M2X_ESTOC|M2X_ESTOCv2|M2X_AugmentedRocket|M2X_OMSpod|M2X_HeavyVTOL|M2X_Turbofan|M2X_Siddeley|M2X_Pegasus|M2X_IonEngine|engineBE4|KKAOSS_engine_g]:HAS[@EFFECTS]:NEEDS[RealPlume,SmokeScreen]:FINAL
{
    // The PLUME metadata has already been consumed in AFTER[zRealPlume].
    // Leaving these scalar fields on the part makes RealPlume parse them again
    // during part compilation as curves, so discard the consumed metadata.
    @PLUME,*
    {
        !energy = DELETE
        !speed = DELETE
    }

    @EFFECTS
    {
        // Hypergolic_LowerOrangeShock writes a scalar offset beside a proper
        // offset FloatCurve on eight generated particle layers. The scalar is
        // rejected once per layer. Its four shock layers also duplicate
        // sizeClamp; retain one copy to avoid the KSPCF persistence warning.
        @Hypergolic_LowerOrangeShock
        {
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*]]
            {
                !offset = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST[shock?]
            {
                !sizeClamp,1 = DELETE
            }
        }

        @*,*
        {
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[.8]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[0.1]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[0.5]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[0.7]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[0.8]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[1]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[1.0]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[1.1]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[1.2]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[1.5]]
            {
                !energy,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#energy[2]]
            {
                !energy,0 = DELETE
            }

            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[0.4]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[0.5]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[0.7]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[0.75]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[0.8]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[1]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[1.0]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[1.2]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[1.3]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[1.4]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[1.44]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[1.5]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[2]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[2.0]]
            {
                !speed,0 = DELETE
            }
            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#speed[5]]
            {
                !speed,0 = DELETE
            }

            @MODEL_MULTI_SHURIKEN_PERSIST,*:HAS[#modelName[RealPlume/*],#power[0.6]]
            {
                !power,0 = DELETE
            }
        }
    }
}
