// Modified 2026-06-26

// Note: blocks ordered broad→specific — Grid*Fin*L matches both variants,
// Grid*Fin*L*Titanium overwrites to restore titanium-specific values
@PART[Grid*Fin*L]:NEEDS[TweakScale,KerbalReusabilityExpansion]:Final
{
    @cost = 300
    %skinMaxTemp = 1000
    @mass = 0.1
    !MODULE[TweakScale] {}
    %MODULE[TweakScale]
    {
        %type = free
        %defaultScale = 100
        %scaleFactors = 10, 25, 50, 75, 100, 125, 150, 200, 300, 400
    }
}

@PART[Grid*Fin*L*Titanium]:NEEDS[TweakScale,KerbalReusabilityExpansion]:Final
{
    @cost = 900
    %skinMaxTemp = 3200
    @mass = 0.12
    !MODULE[TweakScale] {}
    %MODULE[TweakScale]
    {
        %type = free
        %defaultScale = 100
        %scaleFactors = 10, 25, 50, 75, 100, 125, 150, 200, 300, 400
    }
}

!PART[Grid*Fin*M|Grid*Fin*S|Grid*Fin*M*Titanium|Grid*Fin*S*Titanium]{}




