@PART[KF-ALG-Large|KF-ALG-Medium|KF-ALG-Small|KF-ALG-SmallSide]:NEEDS[KerbalFoundries]:FINAL
{
    %maxTemp = 2100
    %skinMaxTemp = 2700

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1890
        %skinMaxOperationalTemp = 2430
    }
}

@PART[KF-ALG-Medium]:FINAL
{
    @MODULE[KSPWheelBase]
    {
        @loadRating = 20
        @maxLoadRating = 30
    }
}

@PART[KF-LegExtending]:Final
{
    @mass = 0.08
}
