// Modified 2026-08-09
// RTG 全局调整 — 功率密度对齐现实 (2.4-6.5 W/kg), 价格 = 功率 × cost/W (密度幂函数溢价)

// --- nfe-rtg-gphs-1 (PB-NUK-II) ---
// 6.5 W/kg × 0.30t = 1950W, cost/W 8.7 → cost 17000
@PART[nfe-rtg-gphs-1]:Final
{
    @cost = 17000
    @description ^= :$:  Generating 1950w of power.:
    @MODULE[ModuleGenerator]
    {
        @OUTPUT_RESOURCE[ElectricCharge]
        {
            @rate = 0.542
        }
    }
}

