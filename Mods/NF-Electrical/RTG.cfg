// --- rtg-0625 (PB-AS-NUK, NFE Legacy — 游戏内未加载, 保持现状) ---
@PART[rtg-0625]:Final
{
    @mass = 0.15
    @cost = 65000
    @description ^= :$:  Generating 1260w of power.:
    !MODULE[ModuleGenerator] {}
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = true
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 0.35  // 150kg for 1260w
        }
    }
}