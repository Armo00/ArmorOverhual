// Modified 2026-08-07
// NFE fission reactor batch adjustment — size ×4 (mass ×4, rescale ×2, heat ×4) + 19% HALEU fuel
// Rules: memory/nuclear-reactor-rules.md (efficiency 0.216-0.432, Ratio = Thermal_MW × 1.175e-8)
// Note: 模块整体重写 (KPBS 惯例), 避免 @key 选择器匹配问题; INPUT/OUTPUT 用 ResourceName

// --- nfe-reactor-tiny-1 ---
// 0.12 MW thermal, 28.8 kW electrical, 24.0% efficiency
// Fuel: 19% HALEU, ~1.3 g/day, core 1.5 u = 16.5 kg, ~33.7 yr
@PART[nfe-reactor-tiny-1]:NEEDS[NearFutureElectrical]:Final
{
    %bulkheadProfiles = size1
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.25
    }
    @mass = 0.056
    @rescaleFactor = 2
    @description ^= :$: Produce 28.8 kW of electrical power with 0.12 MW of waste heat.:
    !MODULE[ModuleSystemHeatFissionReactor] {}
    MODULE
    {
        name = ModuleSystemHeatFissionReactor
        moduleID = reactor
        systemHeatModuleID = reactor
        HeatGeneration
        {
            key = 0 0 0 0
            key = 100 120 0 0
        }
        NominalTemperature = 750
        CriticalTemperature = 1300
        CoreDamageRate = 0.008
        RepairAmountPerKit = 25
        CurrentPowerPercent = 100
        ThrottleIncreaseRate = 5
        MinimumThrottle = 25
        ElectricalGeneration
        {
            key = 0 0
            key = 100 8
        }
        FuelName = EnrichedUranium
        INPUT_RESOURCE
        {
            ResourceName = EnrichedUranium
            Ratio = 0.00000000141
            FlowMode = NO_FLOW
        }
        OUTPUT_RESOURCE
        {
            ResourceName = DepletedFuel
            Ratio = 0.00000000141
            DumpExcess = false
            FlowMode = NO_FLOW
        }
    }
    @RESOURCE[EnrichedUranium]
    {
        @amount = 1.5
        @maxAmount = 1.5
    }
    @RESOURCE[DepletedFuel]
    {
        @maxAmount = 1.5
    }
    // B9PartSwitch 节点不随 rescaleFactor 缩放, 位置 ×2 修正
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
    {
        @SUBTYPE[Compact]
        {
            @attachNode = 0.0, -0.1165, 0, 0.0, -1.0, 0.0
            @NODE[bottom]
            {
                @position = 0.0, -0.1165, 0
            }
        }
        @SUBTYPE[Size0]
        {
            @attachNode = 0.0, -0.4281, 0, 0.0, -1.0, 0.0
            @NODE[bottom]
            {
                @position = 0.0, -0.4281, 0
            }
        }
        @SUBTYPE[Size0Radiators]
        {
            @attachNode = 0.0, -0.4281, 0, 0.0, -1.0, 0.0
            @NODE[bottom]
            {
                @position = 0.0, -0.4281, 0
            }
        }
    }
}

