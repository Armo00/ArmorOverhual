// Modified 2026-07-10

// New Glenn First Stage
// Gross mass: 1220t    Dry mass: 70t      Fuel mass: 1050t

@PART[PA_FirstStageTank]:Final
{
    @entryCost = 500000
    @cost = 20000
    @mass = 50
    %title = New Glenn First Stage Tank
    %description = The First Stage Fuel Tank of New Glenn. Integrated with avionics and control systems for autonomous first stage recovery.

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}

    MODULE
    {
        name = ModuleFuelTanks
        volume = 1242540.0896    // 1360877.2410
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = LqdMethane
            amount = Full
            maxAmount = 41.37%
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 58.63%
        }
        TANK
        {
            name = ElectricCharge
            amount = 15000
            maxAmount = 15000
        }
    }

    // Avionics & Control (moved from Interstage)
    MODULE
    {
        name = ModuleProbeControlPoint
        minimumCrew = 1
        multiHop = True
    }

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.08
        }
        hasHibernation = True
        hibernationMultiplier = 0.00125
        defaultControlPointDisplayName = Default
    }

    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 75
        YawTorque = 75
        RollTorque = 75
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.15
        }
    }

    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 5
    }

    MODULE
    {
        name = MechJebCore
    }

    MODULE
    {
        name = ModuleKerbNetAccess
        MinimumFoV = 5
        MaximumFoV = 90
        AnomalyDetection = 0.3
        DISPLAY_MODES
        {
            Mode = Biome
            Mode = Terrain
        }
    }

    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        packetInterval = 1.0
        packetSize = 2
        packetResourceCost = 12.0
        requiredResource = ElectricCharge
        antennaPower = 500000
    }
}

