// ################################################################
// NV-GX 'Emancipator' Open Cycle Gas Core — 2.5m
// LH2 + EnrU  ISP:3500/1200 Thrust:1700  mass:16  TWR:10.83
// ################################################################
@PART[ntr-gc-25-2]:Final
{
    @entryCost = 4500000
    @cost = 450000
    @mass = 16
    %TechRequired = expNuclearPropulsion
    @description = For too long the nuclear motor industry has held that self-evidently, the contents of the reactor core should be confined inside reactor. No more, we say! Equal opportunity for both hydrogen propellant and uranium! The high temperature of the reactor has led to a open-cycle turbopump, which dumps superheated exhaust out the sides of the engine and can be used for roll control. Rated for a total of 2850s of burn time.

    @MODULE[ModuleEnginesFX]
    {
        @name = ModuleEnginesRF
    }

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = LH2
        origMass = 16

        CONFIG
        {
            name = LH2
            description = NV-GX Emancipator — Open cycle gas core with uranium bleed. ISP 3500/1200, 1700 kN.
            minThrust = 0
            maxThrust = 1700
            heatProduction = 380
            massMult = 1.0
            %ullage = True
            %pressureFed = False
            %ignitions = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 500
            }
            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.9995
                DrawGauge = True
            }
            PROPELLANT
            {
                name = EnrichedUranium
                ratio = 0.0005
            }
            atmosphereCurve
            {
                key = 0 3500
                key = 1 1200
                key = 5 180
            }
        }
    }

    @RESOURCE[EnrichedUranium]
    {
        @amount = 200
        @maxAmount = 200
    }
}

