// Modified 2026-07-25
// KerbalAtomics engines — RF conversion (ModuleEngineConfigs + ModuleEnginesRF)
// Replaces original MultiModeEngine + ModuleEnginesFX
// Pattern: keep one ModuleEnginesFX, convert → ModuleEnginesRF, add ModuleEngineConfigs

// ################################################################
// NV-10 'Eel' Solid Core — 0.625m
// LH2  ISP:1200/180 Thrust:18  mass:0.35
// ################################################################
@PART[ntr-sc-0625-1]:Final
{
    @entryCost = 450000
    @cost = 8500
    @mass = 0.35
    %TechRequired = improvedNuclearPropulsion

    @MODULE[ModuleEnginesFX]
    {
        @name = ModuleEnginesRF
    }

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = LH2
        origMass = 0.35

        CONFIG
        {
            name = LH2
            description = NV-10 Eel — Pure LH₂ mode. ISP 1200/180, 18 kN.
            minThrust = 0
            maxThrust = 18
            heatProduction = 250
            massMult = 1.0
            %ullage = True
            %pressureFed = False
            %ignitions = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 100
            }
            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 1.000
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 1200
                key = 1 180
            }
        }
    }
}

