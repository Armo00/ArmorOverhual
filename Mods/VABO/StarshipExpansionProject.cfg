// Modified 2026-06-18
// VABOrganizer classification for Starship Expansion Project
// Extended to SEP_24 + SEP_25 parts (v3.1.0)

// --- Methalox Engines ---
@PART[SEP_23_RAPTOR2_SL_RC|SEP_23_RAPTOR_VAC|SEP_24_R1C|SEP_24_R1V|SEP_23_BOOSTER_CLUSTER|SEP_25_BOOSTER_CLUSTER]:NEEDS[VABOrganizer]:Final
{
    %VABORGANIZER
    {
        %organizerSubcategory = MethaloxEngines
    }
}

// --- 9m bulkhead profile ---
ORGANIZERBULKHEAD
{
    name = size9_00
    Size = 9
    Label = 9m
    Color = 0.2, 0.9, 0.2
}

