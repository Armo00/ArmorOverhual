// Modified 2026-09-01

// Retained BDB engines: generic RF liquid engines first, then explicit
// propellant-family overrides used by the AO RealFuels patch.
@PART[bluedog_*]:HAS[@MODULE[ModuleEnginesRF],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,VABOrganizer,RealFuels]:FINAL
{
    %VABORGANIZER
    {
        %organizerSubcategory = KeroloxEngines
    }
}

@PART[bluedog_*]:HAS[@MODULE[ModuleEnginesRF]:HAS[@PROPELLANT[HTPB|PBAN|PSPC|CTPB|NGNC|PBAA|PUPE]],~name[bluedog_Gemini_*],~name[bluedog_GeminiFerry_*],~name[bluedog_BigG_*],~name[bluedog_Shuguang_*],~name[bluedog_Mercury_*],~name[bluedog_Atlas*],~name[bluedog_Redstone_*],~name[bluedog_Sergeant_*],~name[bluedog_X15_*]]:NEEDS[Bluedog_DB,VABOrganizer,RealFuels]:FINAL
{
    %VABORGANIZER
    {
        %organizerSubcategory = solidEngines
    }
}

