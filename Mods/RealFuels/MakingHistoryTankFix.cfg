// Modified 2026-09-06
// RealFuels no longer provides a TANK_DEFINITION named RCS. Use the
// ServiceModule tank type for the Making History 1.875 m RCS tank.

@PART[Size1p5_Monoprop]:HAS[@MODULE[ModuleFuelTanks]]:NEEDS[RealFuels]:FINAL
{
    @MODULE[ModuleFuelTanks]
    {
        @type = ServiceModule
    }
}
