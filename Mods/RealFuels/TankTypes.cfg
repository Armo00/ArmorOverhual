// ################################################################
// LqdNitrogen — ServiceModule (pressurized Dewar, boiloff → N2)
// ################################################################
@TANK_DEFINITION[ServiceModule]:NEEDS[RealFuels]:FINAL
{
    TANK
    {
        name = LqdNitrogen
        mass = 0.000079
        utilization = 1
        fillable = True
        amount = 0.0
        maxAmount = 0.0
        temperature = 77.15
        wallThickness = 0.001
        wallConduction = 11.4
        insulationThickness = 0.05
        insulationConduction = 0.000017
        note = (has insulation, pressurized)
        boiloffProduct = Nitrogen
        isDewar = true
    }
}

