// Modified 2025-03-18

// Modified 2026-09-07: cover all PeriapsisMotors Sepratron variants.
@PART[sepIB|sepII|sep8-1]:FINAL
{
    %maxTemp = 2100
    %skinMaxTemp = 2700

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1890
        %skinMaxOperationalTemp = 2430
    }
}

@PART[sepIB]:FINAL
{
    @cost = 11
    @TechRequired = solidRocketMotor
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        !atmosphereCurve{}
        atmosphereCurve
        {
            key= 0 280
            key= 1 270
            key= 5 1
        }
    }
    @RESOURCE[SolidFuel]
    {
        @amount = 34
        @maxAmount = 34  
    }
}

