// ################################################################
// RCS + Vents conversion — BL-2 Starship
// ################################################################

@PART[SEP_25_SHIP_CORE]:Final
{
    @MODULE[ModuleEngines*],*
    {
        @name = ModuleEnginesFX
        %multFlow = 20
        %overrideStagingIconIfBlank = false
        !PROPELLANT[LiquidFuel] {}
        !PROPELLANT[Oxidizer] {}
        PROPELLANT
        {
            name = LqdMethane
            ratio = 0.4137
        }
        PROPELLANT
        {
            name = LqdOxygen
            ratio = 0.5863
        }
    }
}

