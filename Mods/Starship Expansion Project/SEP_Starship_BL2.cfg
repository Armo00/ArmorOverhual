// Modified 2026-09-06
// Starship Block 2 — SEP_25_SHIP_* parts
// Tank volumes density-compensated from RO data (V_us = V_RO × 1.0625)
// Dry mass reference: RO-RP1.cfg

// ################################################################
// General BL-2 Starship thermal/structural
// ################################################################

@PART[SEP_25_SHIP_CORE|SEP_25_SHIP_CARGO|SEP_25_SHIP_PEZ|SEP_25_SHIP_FWD_LEFT_FLAP|SEP_25_SHIP_FWD_RIGHT_FLAP|SEP_25_SHIP_AFT_LEFT_FLAP|SEP_25_SHIP_AFT_RIGHT_FLAP]:Final
{
    @rescaleFactor = 1.6
    @manufacturer = SpaceX
    @breakingForce = 999
    @breakingTorque = 999
    @crashTolerance = 20
    %maxTemp = 2073.15
    %skinMaxTemp = 2973.15

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1865.835
        %skinMaxOperationalTemp = 2675.835
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

@PART[SEP_25_SHIP_CORE|SEP_25_SHIP_CARGO|SEP_25_SHIP_PEZ|SEP_25_SHIP_FWD_LEFT_FLAP|SEP_25_SHIP_FWD_RIGHT_FLAP|SEP_25_SHIP_AFT_LEFT_FLAP|SEP_25_SHIP_AFT_RIGHT_FLAP]:NEEDS[DeadlyReentry]:Final
{
    MODULE
    {
        name = ModuleAeroReentry
        leaveTemp = true
        skinMaxOperationalTemp = 2773.15
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

// ################################################################
// SEP_25_SHIP_CORE — Starship BL-2 Main Tanks
// RO mass: 67.5t | RO volume: 1,670,677L → ours: 1,775,073L
// ################################################################

@PART[SEP_25_SHIP_CORE]:NEEDS[RealFuels,CommunityResourcePack]:Final
{
    RESOURCE,*{}
    !MODULE[ModuleRCSFX],* {}
    !MODULE[ModuleReactionWheel],* {}
    !MODULE[ModuleFuelTanks],* {}

    @title = Starship Block 2 Core
    @description = The main propellant tanks for the Starship Block 2 Vehicle, carries approximately 1500 Metric Tons of Liquid Methane and LOX.
    @mass = 67.5
    %radiatorHeadroom = 0.5

    MODULE
    {
        name = ModuleActiveRadiator
        maxEnergyTransfer = 50000
        overcoolFactor = 0.0186367
        isCoreRadiator = true
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.500
        }
    }

    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = RCS
        thrusterPower = 80
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = running
        showToggles = False
        PROPELLANT
        {
            name = LqdMethane
            ratio = 0.4137
        }
        PROPELLANT
        {
            name = LqdOxygen
            ratio = 0.5863
        }
        atmosphereCurve
        {
            key = 0 330
            key = 1 280
        }
    }

    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 3000
        YawTorque = 3000
        RollTorque = 200
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.015
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 1775088
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = LqdMethane
            amount = Full
            maxAmount = 41.37%
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 58.63%
        }
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 15000
        maxAmount = 15000
    }
}

// ################################################################
// SEP_25_SHIP_CARGO — Starship BL-2 Cargo Nosecone
// RO mass: 34.5t | Header tank: 36,023L
// ################################################################

@PART[SEP_25_SHIP_CARGO]:NEEDS[RealFuels,CommunityResourcePack]:Final
{
    RESOURCE,*{}
    @MODULE[ModuleRCSFX]
    {
        !PROPELLANT,*{}
        PROPELLANT
        {
            name = LqdMethane
            ratio = 0.4137
        }
        PROPELLANT
        {
            name = LqdOxygen
            ratio = 0.5863
        }
    }
    !MODULE[ModuleFuelTanks],* {}

    @title = Starship Block 2 Cargo Nosecone
    @description = This Module can carry cargo or Satellites. Perfect for your LEO Heavy Cargo needs. Includes a header tank for landing burns.
    @mass = 34.5

    RESOURCE
    {
        name = ElectricCharge
        amount = 533000
        maxAmount = 533000
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 36023
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = LqdMethane
            amount = Full
            maxAmount = 41.37%
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 58.63%
        }
    }
}

