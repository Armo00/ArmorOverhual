// RO mass: 1.1t (thinner than BL-1s 1.5t)
// ################################################################

@PART[SEP_25_SHIP_FWD_LEFT_FLAP]:Final
{
    @title = Starship Block 2 FWD Left Flap
    @description = The Front Flap is not, and does not behave like typical control surface. Its purpose is always to hold a set trim and influence airflow around Starship while aerobraking. Thinner and lighter than the Block 1 version.
    @mass = 1.1
}

