// Modified 2026-09-06
// ModuleEngines.EngineType is an enum. LiquidFuel1 is not a valid member and
// causes ModuleEnginesRF.OnLoad to throw after RealFuels converts the module.

@PART[SEP_25_BOOSTER_CLUSTER]:NEEDS[StarshipExpansionProject]:FINAL
{
    @MODULE[ModuleEngines*],0
    {
        @EngineType = LiquidFuel
    }
}
