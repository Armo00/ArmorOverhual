// Starship Structural & Ancillary Parts
// SEP_24_STRUCTURAL / SEP_solar_Panel / SEP_comm_Laser
// Dry mass reference: RO-RP1.cfg

// ################################################################
// SEP_24_STRUCTURAL — Starship Structural Part
// RO mass: 0.5t
// ################################################################

@PART[SEP_24_STRUCTURAL]:Final
{
    @title = Starship Structural Part
    @manufacturer = SpaceX
    @description = Structural parts for Starship including COPVs and HPU.
    @mass = 0.5
    @rescaleFactor = 1.6
    @breakingForce = 999
    @breakingTorque = 999
    @crashTolerance = 20
    %maxTemp = 2073.15
    %skinMaxTemp = 2973.15

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1865.835
        %skinMaxOperationalTemp = 2675.835
    }
    %MODULE[TweakScale]
    {
        %type = free
        %defaultScale = 1.0
    }
}

