    %crashTolerance = 15
    %breakingForce = 250
    %breakingTorque = 250
    @TechRequired = fullFlowStagedCombustionCycleEngine
    @manufacturer = SpaceX
    @title = Raptor 1
    @description = The first operational Raptor engine. A full-flow staged combustion, methane-fueled rocket engine. Though less powerful than later iterations, it paved the way for the SuperHeavy era.
    @mass = 1.8
    @maxTemp = 2800

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 2520
        %skinMaxOperationalTemp = 2520
    }
    @attachRules = 1,1,1,1,0

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleGimbal] {}
    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = Gimbal
        useGimbalResponseSpeed = true
        gimbalResponseSpeed = 16
    }

    @MODULE[ModuleSEPRaptor]
    {
        @gimbalOutRange = 7.5
        @gimbalOutSpeed = 16
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
