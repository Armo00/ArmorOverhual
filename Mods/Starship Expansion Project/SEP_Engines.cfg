// Modified 2026-09-06
// Raptor engine RF configurations for all active SEP engines
// SEP_23_RAPTOR2_SL_RC (Raptor 2 Center) + SEP_23_RAPTOR_VAC (Raptor 2 Vacuum)
// SEP_24_R1C (Raptor 1) + SEP_24_R1V (Raptor 1 Vacuum)

// Delete deprecated Raptor Boost variant (no gimbal, superseded by RC)
!PART[SEP_23_RAPTOR2_SL_RB] {}

// ################################################################
// SEP_23_RAPTOR2_SL_RC — Raptor 2 Center (Sea Level)
// CONFIGs: Raptor 2 + Raptor 3 (Raptor 1 moved to SEP_24_R1C)
// ################################################################

@PART[SEP_23_RAPTOR2_SL_RC]:NEEDS[RealFuels,CommunityResourcePack]:Final
{
    @entryCost = 1500000
    @cost = 2000
    %rescaleFactor = 1.6
    %crashTolerance = 15
    %breakingForce = 250
    %breakingTorque = 250
    @TechRequired = fullFlowStagedCombustionCycleEngine
    @manufacturer = SpaceX
    @title = Raptor 2 Center (Sea Level)
    @description = The SpaceX Raptor is a full-flow staged combustion, methane-fueled rocket engine manufactured by SpaceX. The engine is powered by cryogenic liquid methane and liquid oxygen (LOX), rather than the RP-1 kerosene and LOX used in SpaceXs prior Merlin and Kestrel rocket engines.
    @mass = 1.525
    @maxTemp = 2800

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 2520
        %skinMaxOperationalTemp = 2520
    }
    @attachRules = 1,1,1,1,0

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleGimbal] {}
    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = Gimbal
        useGimbalResponseSpeed = true
        gimbalResponseSpeed = 16
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Raptor 3
        modded = false
        origMass = 1.525

        CONFIG
        {
            name = Raptor 2
            maxThrust = 2393.5
            minThrust = 500
            entryCost = 300000
            cost = 1000
            heatProduction = 100
            ratedBurnTime = 18000
            massMult = 1
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.4137
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.5863
            }
            atmosphereCurve
            {
                key = 0 347
                key = 1 327
            }
            ullage = True
            pressureFed = False
            ignitions = 0
            gimbalRange = 7.5

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 4.0
            }
            IGNITOR_RESOURCE
            {
                name = LqdMethane
                amount = 0.4137
            }
            IGNITOR_RESOURCE
            {
                name = LqdOxygen
                amount = 0.5863
            }
        }

        CONFIG
        {
            name = Raptor 3
            maxThrust = 2920.6
            minThrust = 550
            entryCost = 300000
            cost = 1500
            heatProduction = 100
            ratedBurnTime = 36000
            massMult = 1
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.4137
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.5863
            }
            atmosphereCurve
            {
                key = 0 351
                key = 1 330
            }
            ullage = True
            pressureFed = False
            ignitions = 0
            gimbalRange = 7.5

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 4.0
            }
            IGNITOR_RESOURCE
            {
                name = LqdMethane
                amount = 0.4137
            }
            IGNITOR_RESOURCE
            {
                name = LqdOxygen
                amount = 0.5863
            }
        }
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.25
    }
}

// ################################################################
