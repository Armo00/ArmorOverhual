        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Raptor 1
        modded = false
        origMass = 1.8

        CONFIG
        {
            name = Raptor 1
            maxThrust = 1924
            minThrust = 400
            heatProduction = 100
            ratedBurnTime = 3600
            massMult = 1.0
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.4137
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.5863
            }
            atmosphereCurve
            {
                key = 0 350
                key = 1 330
            }
            ullage = True
            pressureFed = False
            ignitions = 0
            gimbalRange = 7.5

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 3.0
            }
            IGNITOR_RESOURCE
            {
                name = LqdMethane
                amount = 0.4137
            }
            IGNITOR_RESOURCE
            {
                name = LqdOxygen
                amount = 0.5863
            }
        }
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.25
    }
}

