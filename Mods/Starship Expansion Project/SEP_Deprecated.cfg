// SEP_23 deprecated parts — save compatibility maintenance
// In SEP v3.1.0, all SEP_23_SHIP_* and SEP_23_BOOSTER_* parts are marked
// category=none, techHidden=True, title prefixed with "DEPRECATED"
// These patches preserve RF/thermal/Waterfall functionality for existing vessels

