// ################################################################
// SEP_24_SHIP_CORE — Starship BL-1 Main Tanks
// RO mass: 63.5t | RO volume: 1,336,541L → ours: 1,420,058L
// ################################################################

@PART[SEP_24_SHIP_CORE]:NEEDS[RealFuels,CommunityResourcePack]:Final
{
    RESOURCE,*{}
    !MODULE[ModuleRCSFX],* {}
    !MODULE[ModuleReactionWheel],* {}
    !MODULE[ModuleFuelTanks],* {}

    @title = Starship Block 1 Core
    @description = The main propellant tanks for the Starship Block 1 Vehicle, carries approximately 1200 Metric Tons of Liquid Methane and LOX.
    @mass = 63.5
    %radiatorHeadroom = 0.5

    MODULE
    {
        name = ModuleActiveRadiator
        maxEnergyTransfer = 50000
        overcoolFactor = 0.0186367
        isCoreRadiator = true
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.500
        }
    }

    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = RCS
        thrusterPower = 80
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = running
        showToggles = False
        PROPELLANT
        {
            name = LqdMethane
            ratio = 0.4137
        }
        PROPELLANT
        {
            name = LqdOxygen
            ratio = 0.5863
        }
        atmosphereCurve
        {
            key = 0 330
            key = 1 280
        }
    }

    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 3000
        YawTorque = 3000
        RollTorque = 200
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.015
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 1420058
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = LqdMethane
            amount = Full
            maxAmount = 41.37%
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 58.63%
        }
    }
}

