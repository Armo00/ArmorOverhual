        }
        PROPELLANT
        {
            name = LqdOxygen
            ratio = 0.5863
        }
        atmosphereCurve
        {
            key = 0 330
            key = 1 280
        }
    }

    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 3000
        YawTorque = 3000
        RollTorque = 200
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.015
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 1420058
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = LqdMethane
            amount = Full
            maxAmount = 41.37%
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 58.63%
        }
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 53300
        maxAmount = 53300
    }
}

