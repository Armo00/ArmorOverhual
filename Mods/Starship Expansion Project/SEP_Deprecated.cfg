// ################################################################
// SEP_24_HOPPY — Starhopper Prototype
// RO mass: 56t | RO volume: 445,000L → ours: 472,804L
// RCS: Nitrogen cold gas (not methalox)
// ################################################################

@PART[SEP_24_HOPPY]:NEEDS[RealFuels,CommunityResourcePack]:Final
{
    RESOURCE,*{}
    !MODULE[ModuleFuelTanks],* {}

    @title = Starhopper
    @manufacturer = SpaceX
    @description = The legend itself. The very first Stainless Steel Starship ever built with the support of Caldwell Tanks, a water tank manufacturer. Powered by a single Raptor 1 and cold-gas nitrogen thrusters.
    @mass = 56

    MODULE
    {
        name = ModuleFuelTanks
        volume = 472804
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = LqdMethane
            amount = Full
            maxAmount = 41.37%
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 58.63%
        }
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 106000
        maxAmount = 106000
    }

    RESOURCE
    {
        name = Nitrogen
        amount = 250000
        maxAmount = 250000
    }

    // Cold gas nitrogen RCS
    @MODULE[ModuleRCSFX]
    {
        @thrusterPower = 12
        %overrideStagingIconIfBlank = false
        !PROPELLANT,*{}
        PROPELLANT
        {
            name = Nitrogen
            ratio = 1
        }
    }
}

// ################################################################
