// Starship SEP_23 (deprecated)
// ################################################################

// --- General Starship thermal/structural ---
@PART[SEP_23_SHIP_CREW|SEP_23_SHIP_CARGO|SEP_23_SHIP_TANKER|SEP_23_SHIP_HEADER|SEP_23_SHIP_BODY|SEP_23_SHIP_FWD_LEFT|SEP_23_SHIP_FWD_RIGHT|SEP_23_SHIP_AFT_LEFT|SEP_23_SHIP_AFT_RIGHT|SEP_23_SHIP_BODY_EXP|SEP_23_SHIP_CARGO_EXP|SEP_23_SHIP_CREW_EXP|SEP_23_SHIP_NOSE_EXP|SEP_23_SHIP_DEPOT]:Final
{
    @rescaleFactor = 1.0
    @manufacturer = SpaceX
    @tags = SpaceX, Starship, Mars
    @breakingForce = 999
    @breakingTorque = 999
    @crashTolerance = 20
    %maxTemp = 2800
    %skinMaxTemp = 3400

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 2520
        %skinMaxOperationalTemp = 3060
    }
    %skinThermalMassModifier = 0.43613
    %skinInternalConductionMult = 0.0000105
    %skinMassPerArea = 0.815
    %absorptiveConstant = 0.15
    %emissiveConstant = 0.85
    %thermalMassModifier = 1.0
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

@PART[SEP_23_SHIP_CREW|SEP_23_SHIP_CARGO|SEP_23_SHIP_TANKER|SEP_23_SHIP_HEADER|SEP_23_SHIP_BODY|SEP_23_SHIP_FWD_LEFT|SEP_23_SHIP_FWD_RIGHT|SEP_23_SHIP_AFT_LEFT|SEP_23_SHIP_AFT_RIGHT|SEP_23_SHIP_BODY_EXP|SEP_23_SHIP_CARGO_EXP|SEP_23_SHIP_CREW_EXP|SEP_23_SHIP_NOSE_EXP|SEP_23_SHIP_DEPOT]:NEEDS[DeadlyReentry]:Final
{
    MODULE
    {
        name = ModuleAeroReentry
        leaveTemp = true
        skinMaxOperationalTemp = 3400
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

@PART[SEP_23_SHIP_CREW|SEP_23_SHIP_CARGO|SEP_23_SHIP_TANKER|SEP_23_SHIP_HEADER|SEP_23_SHIP_BODY|SEP_23_SHIP_FWD_LEFT|SEP_23_SHIP_FWD_RIGHT|SEP_23_SHIP_AFT_LEFT|SEP_23_SHIP_AFT_RIGHT|SEP_23_SHIP_BODY_EXP|SEP_23_SHIP_CARGO_EXP|SEP_23_SHIP_CREW_EXP|SEP_23_SHIP_NOSE_EXP|SEP_23_SHIP_DEPOT]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
