    @description = This massive flying saucer is what protects your interstage goodies from being fried by your ship engines during hot-staging.
    @mass = 9
    @rescaleFactor = 1.6
    @breakingForce = 999
    @breakingTorque = 999
    @crashTolerance = 20
    %maxTemp = 2800
    %skinMaxTemp = 3400
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

