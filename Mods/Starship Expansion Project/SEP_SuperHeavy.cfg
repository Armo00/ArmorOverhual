// Modified 2026-06-18
// SuperHeavy BL-2 — SEP_25_BOOSTER_* parts
// Tank volumes density-compensated from RO data (V_us = V_RO × 1.0625)
// Dry mass and ISP reference: RO-RP1.cfg

// ################################################################
// SEP_25_BOOSTER_CORE — SuperHeavy BL-2 Main Tanks
// RO mass: 162t | RO volume: 3,675,487L → ours: 3,905,162L
// ################################################################

@PART[SEP_25_BOOSTER_CORE]:NEEDS[RealFuels,CommunityResourcePack]:Final
{
    RESOURCE,*{}
    !MODULE[ModuleRCSFX],* {}
    !MODULE[ModuleReactionWheel],* {}
    !MODULE[ModuleFuelTanks],* {}

    @title = SuperHeavy BL2 Core
    @manufacturer = SpaceX
    @description = The largest rocket stage ever flown. The Superheavy Block 2 Booster carries 3300 metric tons of Liquid Methane and Oxygen, powered by 33 Raptor engines, this is the most powerful rocket ever flown by a wide margin.
    @mass = 162
    @rescaleFactor = 1.6
    @breakingForce = 999
    @breakingTorque = 999
    @crashTolerance = 20
    %maxTemp = 2800
    %skinMaxTemp = 3400
    %skinMassPerArea = 6.0
    %emissiveConstant = 0.54
    %thermalMassModifier = 1.0

    @MODULE[ModuleCommand]
    {
        %hasHibernation = True
        RESOURCE
        {
            name = ElectricCharge
            rate = 1.3
        }
    }

    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = RCS
        thrusterPower = 70
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = running
        showToggles = False
        PROPELLANT
        {
            name = LqdMethane
            ratio = 0.4137
        }
        PROPELLANT
        {
            name = LqdOxygen
            ratio = 0.5863
        }
        atmosphereCurve
        {
            key = 0 330
            key = 1 280
        }
    }

    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 4000
        YawTorque = 4000
        RollTorque = 100
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.015
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 3905162
        type = ServiceModule
        basemass = -1
        TANK
        {
            name = LqdMethane
            amount = Full
            maxAmount = 41.37%
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 58.63%
        }
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 8000
        maxAmount = 8000
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

// Thermal protection for booster
@PART[SEP_25_BOOSTER_CORE]:NEEDS[DeadlyReentry]:Final
{
    MODULE
    {
        name = ModuleAeroReentry
        leaveTemp = true
        skinMaxOperationalTemp = 973.15
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

// ################################################################
// SEP_25_BOOSTER_CLUSTER — SuperHeavy BL-2 Raptor Cluster
// 3 × ModuleEngineConfigs for AllEngines / MiddleInner / CenterThree
// Coexists with ModuleSEPProceduralEngineGUI for per-engine control
// RO singleEngineThrust: 2255.5295 kN | ISP: 347/328
// ################################################################

@PART[SEP_25_BOOSTER_CLUSTER]:NEEDS[RealFuels,CommunityResourcePack]:Final
{
    @title = SuperHeavy BL2 Raptor Cluster
    @manufacturer = SpaceX
    @description = This powerful cluster of 33 Raptor engines is responsible for lifting a Starship stack and returning the booster for rapid reusability. Features independently throttleable engine rings.
    @angularDrag = 0
    %bodyLiftMultiplier = 0.1

    !MODULE[ModuleAlternator],* {}

    @MODULE[ModuleEngines*],*
    {
        @name = ModuleEnginesRF
        %throttleResponseRate = 3
    }

    // Outer Ring — 20 engines
    !MODULE[ModuleEngineConfigs]:HAS[#engineID[AllEngines]] {}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Outer Ring
        modded = false
        engineID = AllEngines

        CONFIG
        {
            name = Outer Ring
            heatProduction = 100
            throttleResponseRate = 0.625
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.4137
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.5863
            }
            atmosphereCurve
            {
                key = 0 347
                key = 1 328
            }
            ullage = True
            pressureFed = False
            ignitions = 0
            gimbalRange = 15

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1.0
            }
            IGNITOR_RESOURCE
            {
                name = LqdMethane
                amount = 0.4137
            }
            IGNITOR_RESOURCE
            {
                name = LqdOxygen
                amount = 0.5863
            }
            massMult = 1.0
        }
    }

    // Middle Ring — 10 engines
    !MODULE[ModuleEngineConfigs]:HAS[#engineID[MiddleInner]] {}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = 10 Raptors
        modded = false
        engineID = MiddleInner

        CONFIG
        {
            name = 10 Raptors
            heatProduction = 100
            throttleResponseRate = 0.625
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.4137
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.5863
            }
            atmosphereCurve
            {
                key = 0 347
                key = 1 328
            }
            ullage = True
            pressureFed = False
            ignitions = 0
            gimbalRange = 15

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1.0
            }
            IGNITOR_RESOURCE
            {
                name = LqdMethane
                amount = 0.4137
            }
            IGNITOR_RESOURCE
            {
                name = LqdOxygen
                amount = 0.5863
            }
            massMult = 1.0
        }
    }

    // Center Ring — 3 engines
    !MODULE[ModuleEngineConfigs]:HAS[#engineID[CenterThree]] {}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = 3 Raptors
        modded = false
        engineID = CenterThree

        CONFIG
        {
            name = 3 Raptors
            heatProduction = 100
            throttleResponseRate = 0.625
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.4137
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.5863
            }
            atmosphereCurve
            {
                key = 0 347
                key = 1 328
            }
            ullage = True
            pressureFed = False
            ignitions = 0
            gimbalRange = 15

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1.0
            }
            IGNITOR_RESOURCE
            {
                name = LqdMethane
                amount = 0.4137
            }
            IGNITOR_RESOURCE
            {
                name = LqdOxygen
                amount = 0.5863
            }
            massMult = 1.0
        }
    }

    // Procedural engine GUI — single engine thrust/mass
    @MODULE[ModuleSEPProceduralEngineGUI]
    {
        @CUSTOMSELECTABLE:HAS[#name[RBCovers]]
        {
            @ITEM:HAS[#name[RBCover]]
            {
                @mass = 12.5
            }
        }
        @ENGINESET:HAS[#name[RBoosts]]
        {
            @singleEngineThrust = 2255.5295
            %singleEngineMinThrust = 902.2118
            @mass = 2.875
        }
        @ENGINESET:HAS[#name[RMiddles13]]
        {
            @singleEngineThrust = 2255.5295
            %singleEngineMinThrust = 902.2118
            @mass = 2.875
        }
        @ENGINESET:HAS[#name[RCenters13]]
        {
            @singleEngineThrust = 2255.5295
            %singleEngineMinThrust = 902.2118
            @mass = 2.875
        }
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

// ################################################################
// SEP_25_BOOSTER_GRIDFIN — SuperHeavy BL-2 Gridfin
// RO mass: 2.5t (×4 = 10t total)
// ################################################################

@PART[SEP_25_BOOSTER_GRIDFIN]:NEEDS[RealFuels,CommunityResourcePack]:Final
{
    @title = SuperHeavy BL2 Gridfin
    @manufacturer = SpaceX
    @description = These massive Steel Gridfins are designed to guide the Superheavy Booster through re-entry and landing back at the launch site after lifting a Starship into space.
    @mass = 2.5
    @rescaleFactor = 1.6
    @breakingForce = 999
    @breakingTorque = 999
    @crashTolerance = 20
    %maxTemp = 2800
    %skinMaxTemp = 3400

    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 1200
        YawTorque = 1200
        RollTorque = 300
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.1
        }
    }
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 9.0
    }
}

// ################################################################
