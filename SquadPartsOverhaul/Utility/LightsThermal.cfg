// Modified 2026-09-07
// Stock standalone lights, including legacy and revamped Illuminators.
@PART[spotLight1|spotLight2|spotLight1_v2|spotLight2_v2|spotLight3|domeLight1|navLight1|stripLight1|groundLight1|groundLight2]:FINAL
{
    %maxTemp = 2100
    %skinMaxTemp = 2700

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1890
        %skinMaxOperationalTemp = 2430
    }
}
