// Modified 2026-09-07
// All stock intake parts, including intake fuselages and engine nacelles.
// The Goliath's integrated intake shares the engine limits in JetEngineThermal.cfg.
@PART[ramAirIntake|miniIntake|IntakeRadialLong|airScoop|CircularIntake|shockConeIntake|radialEngineBody|MK1IntakeFuselage|nacelleBody]:FINAL
{
    %maxTemp = 2100
    %skinMaxTemp = 2700

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1890
        %skinMaxOperationalTemp = 2430
    }
}
