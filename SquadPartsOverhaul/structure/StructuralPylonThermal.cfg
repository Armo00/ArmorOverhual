// Modified 2026-09-07
// Structural Pylon and its small variant, Small Hardpoint.
@PART[structuralPylon|smallHardpoint]:FINAL
{
    %maxTemp = 2100
    %skinMaxTemp = 2700

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1890
        %skinMaxOperationalTemp = 2430
    }
}
