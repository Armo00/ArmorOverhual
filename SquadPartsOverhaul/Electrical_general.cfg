// Modified 2026-06-19
// Battery rules: 1 EC = 1 Wh, 1 cost = $1000
// Energy density: 50-150 Wh/kg (larger → higher)
// Price: $500-2000/kWh (larger → lower)
// See memory/battery-rules.md

// Z-1U Rechargeable Battery Pack — 50 Wh/kg, $2000/kWh
@PART[batteryPack]:Final
{
    @title = Z-1U Rechargeable Battery Pack
    @description = The Z-1U battery pack is the standard model for electrical applications. Holds a maximum 1 kWh of charge.
    @mass = 0.020
    @cost = 2
    @RESOURCE[ElectricCharge]
    {
        @amount = 1000
        @maxAmount = 1000
    }
}

// Z-2U Rechargeable Battery Bank — 65 Wh/kg, $1700/kWh
@PART[batteryBankMini]:Final
{
    @title = Z-2U Rechargeable Battery Bank
    @description = The Z-2U is a stackable variant of the Z-1U battery pack, with increased capacity. In emergency situations, please refrain from "reversing the polarity".
    @mass = 0.032
    @cost = 3.6
    @RESOURCE[ElectricCharge]
    {
        @amount = 2100
        @maxAmount = 2100
    }
}

// Z-4U Rechargeable Battery — 85 Wh/kg, $1400/kWh
@PART[ksp_r_largeBatteryPack]:Final
{
    @title = Z-4U Rechargeable Battery
    @description = The Z-4U battery pack is a versatile, compact electrical charge storage solution designed for heavier loads than AAAA batteries can handle. Holds a maximum of 4.4 kWh of charge.
    @mass = 0.052
    @cost = 6.2
    @RESOURCE[ElectricCharge]
    {
        @amount = 4400
        @maxAmount = 4400
    }
}

// Z-12U Rechargeable Battery Bank — 110 Wh/kg, $900/kWh
@PART[batteryBank]:Final
{
    @title = Z-12U Rechargeable Battery Bank
    @description = The Z-12U is a stackable battery bank, with 12 times the power capacity of the Z-1U.
    @mass = 0.109
    @cost = 10.8
    @RESOURCE[ElectricCharge]
    {
        @amount = 12000
        @maxAmount = 12000
    }
}

// Z-50U Rechargeable Battery Bank — 150 Wh/kg, $500/kWh
@PART[batteryBankLarge]:Final
{
    @title = Z-50U Rechargeable Battery Bank
    @description = New advances in surge control technology made the Z-50U, the largest battery pack ever put into production, a reality. While Zaltonic admits intense electrical discharges can be really cool, shorting the Z-50U's contacts should probably be avoided.
    @mass = 0.333
    @cost = 25
    @RESOURCE[ElectricCharge]
    {
        @amount = 50000
        @maxAmount = 50000
    }
}

// solar panel assumed at 300w/m^2, as in 0.083u/m^2, 1000$/m^2
// None          price:1000$/m^2     mass: 10kg/^2   324w/m^2(0.09u)
// Deployable    price:2000$/m^2     mass: 20kg/^2   324w/m^2(0.09u)
// Roll-out      price:4000$/m^2     mass: 8kg/m^2   468w/m^2(0.13u)
// Concentrating price:4000$/m^2     mass: 30kg/^2   540w/m^2(0.15u)
// Future        price:60000$/m^2    mass: 100kg/^2  3600w/m^2(1u)
// Shrouded price *1.25

// SP-L 1x6 Photovoltaic Panels 6m^2 Deployable, Shrouded
@PART[solarPanels2]:Final
{
    @mass = 0.15
    @rescaleFactor = 2.35  // for 6m^2 panels
    @cost = 15  // 1000$/m^2

    @MODULE[ModuleDeployableSolarPanel]
    {
        @chargeRate = 0.75   // 450w/m^2 not very scientific, but for playable.
    }
}

// OX-4L 1x6 Photovoltaic Panels 6m^2 Deployable
