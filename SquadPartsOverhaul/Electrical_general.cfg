@PART[rtg]:Final
{
    @mass = 0.08
    @cost = 3000
    @description ^= :$:  Generating 400w of power.:
    !MODULE[ModuleGenerator] {}
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = true
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 0.11  // 80kg for 400w, 5.0 W/kg
        }
    }
}

