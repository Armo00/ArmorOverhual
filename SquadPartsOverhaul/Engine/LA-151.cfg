// Modified 2026-08-20
// LA-151 Variable-Performance Nuclear Rocket Motor — Water NTR, cloned from LV-N
// 10.8 GW thermal, 90% conversion, 9.72 GW jet power
// 1.875m, 5.8t, continuous 500s/3964.66kN to 1500s/1321.55kN control

+PART[nuclearEngine]:NEEDS[Squad]:FINAL
{
    @name = AO_LA151
    @title = LA-151 Variable-Performance Nuclear Rocket Motor
    @description = A continuously variable derivative of the LA-150 nuclear thermal rocket motor, powered by a single ARC-150 cold fusion reactor core. The engine uses water (H₂O) as propellant and can trade thrust for efficiency across its full operating range while maintaining approximately constant reactor power. Intended for deep-space transfer stages that benefit from changing performance without switching discrete engine configurations.
    @manufacturer = Armor Aerospace
    @mass = 3.8
    @rescaleFactor = 1.5
    @bulkheadProfiles = size1p5
    @tags = nuclear ntr nerv water steam arc-150 cold fusion deep space transfer variable isp

    // Keep exactly one stock ModuleEnginesFX. LA-151 deliberately does not use
    // RealFuels or ModuleEngineConfigs.
    !MODULE[MultiModeEngine],*{}
    !MODULE[ModuleEnginesFX]:HAS[#engineID[LF]],*{}
    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleRFInFlightConfigSwitcher],*{}

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesFX
        %engineID = LA151
        %minThrust = 0
        %maxThrust = 1982.33
        %heatProduction = 5
        %EngineType = Nuclear

        !PROPELLANT,*{}
        PROPELLANT
        {
            name = Water
            ratio = 1.000
            DrawGauge = True
        }

        !atmosphereCurve{}
        atmosphereCurve
        {
            key = 0 1000
            key = 1 800
        }
    }

    // The ReStock LV-N model exposes thrustTransform but no separate gimbal
    // transform. Rotating it steers both engine thrust and the Waterfall plume.
    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = thrustTransform
        gimbalRange = 15
        enablePitch = true
        enableYaw = true
        enableRoll = true
        useGimbalResponseSpeed = true
        gimbalResponseSpeed = 16
    }

    MODULE
    {
        name = ModuleVariableIspThrust
        engineID = LA151

        performanceSetting = 50
        sliderStep = 1
        allowInFlight = true
        allowWhileRunning = true
        scaleMinThrust = true
        thrustInterpolation = constantPower

        INPUT_RESOURCE
        {
            name = ArcElement
            ratio = 0.00002296296   // ~1.98 U/day, 100 U → ~50 days at full throttle
            flowMode = NO_FLOW
        }

        OUTPUT_RESOURCE
        {
            name = LqdHelium
            ratio = 0.00009589698
            flowMode = NO_FLOW
            dumpExcess = true
        }

        PERFORMANCE_POINT
        {
            percent = 0
            maxThrust = 3964.66
            atmosphereCurve
            {
                key = 0 500
                key = 1 400
            }
        }

        PERFORMANCE_POINT
        {
            percent = 50
            maxThrust = 1982.33
            atmosphereCurve
            {
                key = 0 1000
                key = 1 800
            }
        }

        PERFORMANCE_POINT
        {
            percent = 100
            maxThrust = 1321.55
            atmosphereCurve
            {
                key = 0 1500
                key = 1 1200
            }
        }
    }

    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = true
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 1
        }
    }

    RESOURCE
    {
        name = ArcElement
        amount = 100
        maxAmount = 100
    }
    RESOURCE
    {
        name = LqdHelium
        amount = 0
        maxAmount = 100    // 演示收集罐
    }

}

// RocketSoundEnhancement inherited its sound groups before this clone changed
// the engine ID. Keep the active group wired to the final LA151 engine.
@PART[AO_LA151]:HAS[@MODULE[RSE_Engines]]:NEEDS[RocketSoundEnhancement]:FINAL
{
    @MODULE[RSE_Engines]
    {
        !SOUNDLAYERGROUP[LF],*{}

        @SOUNDLAYERGROUP[LH2]
        {
            @name = LA151
        }
    }

    @RSE_PRESET-Processed,*
    {
        %engineID = LA151
    }
}

// Waterfall FX
@PART[AO_LA151]:NEEDS[Waterfall]:FINAL
{
    !MODULE[ModuleWaterfallFX],*{}

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = LA151FX

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }

        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }

        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1,1
        }

        TEMPLATE
        {
            templateName = waterfall-ka-ntr-lh2-1
            overrideParentTransform = thrustTransform
            position = 0,0,0.08
            rotation = 0, 0, 0
            scale = 0.9, 0.9, 2
        }
    }
}

// TweakScale — 1.875m stack
@PART[AO_LA151]:NEEDS[TweakScale]:FINAL
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.875
    }
}

// VABO
@PART[AO_LA151]:NEEDS[VABOrganizer]:FINAL
{
    %VABORGANIZER
    {
        %organizerSubcategory = nuclearEngines
    }
}
