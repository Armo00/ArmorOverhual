// Modified 2026-09-07
// Squad stock pure air-breathing jet engines. RAPIER is maintained separately.

@PART[miniJetEngine|JetEngine|turboJet|turboFanEngine|turboFanSize2]:FINAL
{
    %maxTemp = 2100
    %skinMaxTemp = 2700

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1890
        %skinMaxOperationalTemp = 2430
    }
}
