// Modified 2026-07-28
// LA-150 Nuclear Rocket Motor — Water NTR, cloned from LV-N
// 1.875m, 5.8t, RF ModuleEngineConfigs: 3 CONFIGs (500s/900s/1200s)

+PART[nuclearEngine]:FINAL
{
    @name = AO_LA150
    @title = LA-150 Nuclear Rocket Motor
    @description = A mid-size nuclear thermal rocket motor powered by a single ARC-150 cold fusion reactor core. Using water (H₂O) as propellant, the engine offers three selectable operating points trading thrust for efficiency. The ARC-150s self-regulating design eliminates the need for active reactor control during steady-state operation. Ideal for deep-space transfer stages using water as a storable, dense propellant.
    @manufacturer = Armor Aerospace
    @mass = 5.8
    @rescaleFactor = 1.5
    @bulkheadProfiles = size1p5
    @tags = nuclear ntr nerv water steam arc-150 cold fusion deep space transfer

    // Clean up KA interference
    !MODULE[MultiModeEngine]{}
    !MODULE[ModuleEnginesFX]:HAS[#engineID[LF]]{}

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        %engineID = LA150
    }

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        engineID = LA150
        configuration = LA-150-900
        origMass = 5.8

        CONFIG
        {
            name = LA-150-500
            description = LA-150 — High thrust. 265 kN, ISP 500s.
            minThrust = 0
            maxThrust = 265
            heatProduction = 50
            massMult = 1.0
            %ullage = True
            %pressureFed = False
            %ignitions = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 20
            }
            PROPELLANT
            {
                name = Water
                ratio = 1.000
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 500
                key = 1 160
            }
        }

        CONFIG
        {
            name = LA-150-900
            description = LA-150 — Balanced mode. 147 kN, ISP 900s.
            minThrust = 0
            maxThrust = 147
            heatProduction = 50
            massMult = 1.0
            %ullage = True
            %pressureFed = False
            %ignitions = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 20
            }
            PROPELLANT
            {
                name = Water
                ratio = 1.000
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 900
                key = 1 300
            }
        }

        CONFIG
        {
            name = LA-150-1200
            description = LA-150 — High efficiency cruise. 110 kN, ISP 1200s.
            minThrust = 0
            maxThrust = 110
            heatProduction = 50
            massMult = 1.0
            %ullage = True
            %pressureFed = False
            %ignitions = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 20
            }
            PROPELLANT
            {
                name = Water
                ratio = 1.000
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 1200
                key = 1 420
            }
        }
    }

    MODULE
    {
        name = ModuleRFInFlightConfigSwitcher
        engineID = LA150
        allowSwitchWhileRunning = true
        keepWindowOpen = true
        showScreenMessage = true
        switchCooldown = 0.25
    }
}

// RocketSoundEnhancement inherited its sound groups before this clone changed
// the RF engine ID. Keep the active group wired to the final LA150 engine.
@PART[AO_LA150]:HAS[@MODULE[RSE_Engines]]:NEEDS[RocketSoundEnhancement]:FINAL
{
    @MODULE[RSE_Engines]
    {
        !SOUNDLAYERGROUP[LF]{}

        @SOUNDLAYERGROUP[LH2]
        {
            @name = LA150
        }
    }

    @RSE_PRESET-Processed,*
    {
        %engineID = LA150
    }
}

// Waterfall FX
@PART[AO_LA150]:NEEDS[Waterfall]:FINAL
{
    !MODULE[ModuleWaterfallFX],*{}

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = LA150FX

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }

        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }

        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1,1
        }

        TEMPLATE
        {
            templateName = waterfall-ka-ntr-lh2-1
            overrideParentTransform = thrustTransform
            position = 0,0,0.08
            rotation = 0, 0, 0
            scale = 0.9, 0.9, 2
        }
    }
}

// TweakScale — 1.875m stack
@PART[AO_LA150]:NEEDS[TweakScale]:FINAL
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.875
    }
}

// VABO
@PART[AO_LA150]:NEEDS[VABOrganizer]:FINAL
{
    %VABORGANIZER
    {
        %organizerSubcategory = nuclearEngines
    }
}
