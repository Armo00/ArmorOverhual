// Modified 2026-07-27
// LA-150 Nuclear Rocket Motor — LN2 NTR, cloned from LV-N
// 1.875m, 5.5t, 2 CONFIGs: 150kN/850s + 82kN/1500s

+PART[nuclearEngine]:FINAL
{
    @name = AO_LA150
    @title = LA-150 Nuclear Rocket Motor
    @description = A mid-size nuclear thermal rocket motor powered by a single ARC-150 cold fusion reactor core. Using liquid nitrogen (LN₂) as propellant, it offers a moderate-thrust option at 850s or a high-efficiency cruise mode at 1500s. The ARC-150s self-regulating design eliminates the need for active reactor control during steady-state operation. Ideal for deep-space transfer stages constrained by propellant volume rather than mass.
    @manufacturer = Armor Aerospace
    @mass = 5.5
    @rescaleFactor = 1.5
    @bulkheadProfiles = size1p5
    @tags = nuclear ntr nerv ln2 nitrogen arc-150 cold fusion deep space transfer

    // Clean up KerbalAtomics interference (if installed), keep one engine
    !MODULE[MultiModeEngine]{}
    !MODULE[ModuleEnginesFX]:HAS[#engineID[LF]]{}

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = LA-150-850
        origMass = 5.5

        CONFIG
        {
            name = LA-150-850
            description = LA-150 — High thrust mode. 150 kN, ISP 850s.
            minThrust = 0
            maxThrust = 150
            heatProduction = 50
            massMult = 1.0
            %ullage = True
            %pressureFed = False
            %ignitions = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 20
            }
            PROPELLANT
            {
                name = LqdNitrogen
                ratio = 1.000
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 850
                key = 1 310
            }
        }

        CONFIG
        {
            name = LA-150-1500
            description = LA-150 — High efficiency cruise mode. 82 kN, ISP 1500s.
            minThrust = 0
            maxThrust = 82
            heatProduction = 50
            massMult = 1.0
            %ullage = True
            %pressureFed = False
            %ignitions = 0
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 20
            }
            PROPELLANT
            {
                name = LqdNitrogen
                ratio = 1.000
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 1500
                key = 1 420
            }
        }
    }
}

// Waterfall FX
@PART[AO_LA150]:NEEDS[Waterfall]:FINAL
{
    !MODULE[ModuleWaterfallFX],*{}

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = LA150FX

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }

        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }

        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1,1
        }

        TEMPLATE
        {
            templateName = waterfall-ka-ntr-lh2-1
            overrideParentTransform = thrustTransform
            position = 0,0,0.08
            rotation = 0, 0, 0
            scale = 0.9, 0.9, 2
        }
    }
}

// TweakScale — 1.875m stack
@PART[AO_LA150]:NEEDS[TweakScale]:FINAL
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.875
    }
}

// VABO
@PART[AO_LA150]:NEEDS[VABOrganizer]:FINAL
{
    %VABORGANIZER
    {
        %organizerSubcategory = nuclearEngines
    }
}
