@PART[sepMotor1]:FINAL
{
    %maxTemp = 2100
    %skinMaxTemp = 2700
    @cost = 10
    @TechRequired = solidRocketMotor

    %MODULE[ModuleAeroReentry]:NEEDS[DeadlyReentry]
    {
        %leaveTemp = true
        %maxOperationalTemp = 1890
        %skinMaxOperationalTemp = 2430
    }

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        !atmosphereCurve{}
        atmosphereCurve
        {
            key= 0 280
            key= 1 270
            key= 5 1
        }
    }
}
