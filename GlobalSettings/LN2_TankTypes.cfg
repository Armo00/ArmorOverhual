// Modified 2026-07-26
// Add LqdNitrogen to ServiceModule, Cryogenic, and BalloonCryo tank types
// Parameters mirrored from LqdOxygen with LN2 boiling point (77.15 K)

// ServiceModule — pressurized Dewar, boiloff → gaseous N2
@TANK_DEFINITION[ServiceModule]:NEEDS[RealFuels]:FINAL
{
    TANK
    {
        name = LqdNitrogen
        mass = 0.000079
        utilization = 1
        fillable = True
        amount = 0.0
        maxAmount = 0.0
        temperature = 77.15
        wallThickness = 0.001
        wallConduction = 11.4
        insulationThickness = 0.05
        insulationConduction = 0.000017
        note = (has insulation, pressurized)
        boiloffProduct = Nitrogen
        isDewar = true
    }
}

// Cryogenic — MLI-insulated, unpressurized
@TANK_DEFINITION[Cryogenic]:NEEDS[RealFuels]:FINAL
{
    TANK
    {
        name = LqdNitrogen
        mass = 0.0000112
        utilization = 1
        fillable = True
        amount = 0.0
        maxAmount = 0.0
        temperature = 77.15
        wallThickness = 0.0025
        wallConduction = 16
        insulationThickness = 0.0381
        insulationConduction = 0.014
        note = (has insulation)
    }
}

